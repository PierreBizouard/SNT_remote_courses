<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>S1 · Techno Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#110f26;--panel:#1c1940;--deep:#16132f;--line:#3a3468;--fg:#ece8ff;--muted:#9d96cc;--amber:#ffb547;--cyan:#5ce1e6;--pink:#ff6aa8;--good:#6ee7a0;--bad:#ff5a5a;--ink:#1a1300;--blood:#b3001b;
--f-display:'Silkscreen',monospace;--f-mono:'JetBrains Mono',monospace;--f-body:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
#wrap{max-width:960px;margin:0 auto;padding:10px 16px 28px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
header h1{flex:1;margin:0;font:700 clamp(14px,4vw,20px) var(--f-display);color:var(--amber);letter-spacing:.02em}
header .pts{font:700 17px var(--f-mono);color:var(--cyan)}
.iconbtn{min-width:44px;height:44px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font:700 15px var(--f-body)}
h2{margin:0 0 6px;font:700 clamp(18px,4.6vw,26px) var(--f-display);color:var(--cyan);letter-spacing:.02em;text-wrap:balance}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:70ch}
b{color:var(--amber)}
.btn{min-height:46px;padding:0 16px;background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:9px;font:700 15px var(--f-body)}
.btn:active{transform:translateY(2px)}
.btn.ok{background:var(--amber);color:var(--ink);border-color:#c98a24}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.fb{min-height:1.5em;font-weight:700;margin:8px 0}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.hud{display:flex;gap:12px;align-items:center;justify-content:space-between;font:700 14px var(--f-mono);margin-bottom:6px}
.hud .lives{color:var(--bad);font-size:18px;letter-spacing:2px}
/* menu */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:14px 0}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:14px}
.gcard:hover{border-color:var(--amber)}
.gcard .e{grid-row:span 3;font-size:44px;line-height:1}
.gcard .t{font:700 16px var(--f-display);letter-spacing:.02em}
.gcard .d{color:var(--muted);font-size:14px}
.gcard .s{font:700 13px var(--f-mono);color:var(--good)}
.gcard.done{border-color:var(--good)}
/* scène commune */
.stage{position:relative;height:min(62vh,540px);min-height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:manipulation;-webkit-user-select:none;user-select:none}
body.paused .stage{filter:blur(14px)}
.float{position:absolute;transform:translate(-50%,-50%);font:700 17px var(--f-mono);pointer-events:none;z-index:60;animation:rise 1s forwards;white-space:nowrap;text-shadow:0 2px 4px #000}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.laser{position:absolute;height:4px;transform-origin:0 50%;border-radius:2px;pointer-events:none;z-index:40;animation:fade .25s forwards}
@keyframes fade{to{opacity:0}}
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(8,6,20,.82)}
.overlay .card{max-width:520px;width:100%;text-align:center}
/* zombies */
.zst{background:linear-gradient(#1b2b22,#2a2216 70%,#3b2a1a)}
.qbar{min-height:58px;margin-bottom:6px;padding:10px 14px;background:var(--deep);border:2px solid var(--amber);border-radius:12px;font:700 clamp(15px,4vw,19px) var(--f-body);text-align:center}
.z{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);cursor:crosshair;z-index:10}
.z .em{font-size:46px;line-height:1;filter:drop-shadow(0 4px 4px #000a)}
.z .lab{max-width:min(30vw,190px);margin-top:2px;padding:4px 8px;background:#f2ead2;color:#2a1a08;border:2px solid #5a3a1a;border-radius:7px;font:700 13px/1.2 var(--f-body);text-align:center}
.z.angry .em{filter:drop-shadow(0 0 10px red)}
.z.angry .lab{text-decoration:line-through;opacity:.6}
.z.dead{animation:die .5s forwards;pointer-events:none}
@keyframes die{to{transform:translate(-50%,-50%) scale(1.8) rotate(25deg);opacity:0}}
.z.flee{transition:opacity .4s;opacity:0;pointer-events:none}
.turret{position:absolute;left:50%;bottom:6px;font-size:42px;transform:translateX(-50%);z-index:20;pointer-events:none}
.barricade{position:absolute;left:0;right:0;bottom:62px;height:6px;background:repeating-linear-gradient(90deg,#8b5a2b 0 30px,#5a3a1a 30px 34px);opacity:.8}
.splat{position:absolute;width:70px;height:70px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--blood) 0 40%,transparent 41%),radial-gradient(circle at 80% 30%,var(--blood) 0 14%,transparent 15%),radial-gradient(circle at 20% 75%,var(--blood) 0 12%,transparent 13%);opacity:.85;pointer-events:none;z-index:2}
.blood{position:absolute;inset:0;pointer-events:none;z-index:80;animation:bfade 2.2s forwards}
.blood i{position:absolute;border-radius:50%;background:radial-gradient(circle,#d0001f 0 55%,#7a0010 56% 62%,transparent 63%)}
.blood i::after{content:'';position:absolute;left:45%;top:60%;width:14%;height:160%;border-radius:0 0 40px 40px;background:#b3001b;animation:drip 2s ease-in forwards}
@keyframes drip{from{height:20%}to{height:260%}}
@keyframes bfade{0%,60%{opacity:1}to{opacity:0}}
/* pieuvre */
.ost{background:radial-gradient(ellipse at 50% 0,#163455,#0a1426 70%)}
.ost svg{position:absolute;inset:0;width:100%;height:100%}
.link{stroke:#5ce1e6;stroke-width:4;stroke-linecap:round}
.link.cut{stroke:#ff5a5a;stroke-dasharray:6 8}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;z-index:10;background:none;border:0;padding:0}
.node .em{font-size:30px;line-height:1;width:52px;height:52px;display:grid;place-items:center;border-radius:50%;background:#0e1e36;border:2px solid #2f5f8f}
.node.router .em{border-color:var(--amber)}
.node .nm{font:700 11px var(--f-mono);color:var(--fg);background:#0b1426cc;padding:1px 5px;border-radius:5px;margin-top:2px;white-space:nowrap}
.node .ad{font:700 12px var(--f-mono);color:var(--amber)}
.node.flash-bad .em{box-shadow:0 0 0 4px var(--bad)}
.wrench{position:absolute;transform:translate(-50%,-50%);z-index:15;width:42px;height:42px;border-radius:50%;background:#3a1a24;border:2px solid var(--bad);font-size:20px;display:grid;place-items:center;animation:pulse .8s infinite alternate}
.wrench.fix{animation:spin .8s linear infinite;border-color:var(--good)}
@keyframes pulse{to{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.pk{position:absolute;transform:translate(-50%,-50%);z-index:20;padding:3px 7px;border-radius:7px;background:var(--amber);color:var(--ink);font:700 13px var(--f-mono);pointer-events:none;white-space:nowrap;box-shadow:0 2px 6px #000}
.pk.wait{animation:blink .5s infinite alternate}
.pk small{font-size:10px;margin-left:4px}
@keyframes blink{to{background:#fff2c9}}
.octo{position:absolute;transform:translate(-50%,-50%);font-size:76px;line-height:1;z-index:30;pointer-events:none;filter:drop-shadow(0 0 12px #ff6aa8aa)}
.octo .eyes{position:absolute;left:50%;top:30%;transform:translateX(-50%);display:flex;gap:10px}
.octo .eyes i{width:12px;height:12px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 10px 4px #ff2a2a;opacity:.35;transition:opacity .15s}
.octo.fire .eyes i{opacity:1}
.hpbar{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:min(60%,260px);height:10px;border-radius:5px;background:#3a1a24;overflow:hidden;z-index:31}
.hpbar div{height:100%;background:var(--pink);transition:width .4s}
.alert{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:50;padding:8px 14px;border-radius:10px;background:#3a0010e6;border:2px solid var(--bad);font:700 16px var(--f-display);color:#fff;pointer-events:none;text-align:center}
.rtable{font:500 13px/1.6 var(--f-mono)}
.rtable b{color:var(--good)} .rtable i{color:var(--muted);font-style:normal}
/* boîte noire */
.bb{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0}
.bbox{width:clamp(120px,30vw,190px);aspect-ratio:1;border-radius:16px;background:#050409;border:3px solid #2a2550;display:grid;place-items:center;font-size:44px;position:relative;box-shadow:inset 0 0 30px #000}
.bbox.run .gear{animation:spin2 .7s linear infinite}
@keyframes spin2{to{transform:rotate(360deg)}}
.bbox .q{position:absolute;bottom:6px;font:700 12px var(--f-display);color:#4a4480}
.io{display:flex;flex-direction:column;gap:6px;align-items:center}
.io input{width:100%;max-width:150px;height:50px;text-align:center;font:700 24px var(--f-mono);background:var(--deep);color:var(--fg);border:2px solid var(--line);border-radius:10px}
.out{min-width:110px;min-height:50px;display:grid;place-items:center;padding:0 10px;font:700 24px var(--f-mono);background:var(--deep);border:2px solid var(--line);border-radius:10px;color:var(--good)}
.out.pop{animation:popo .4s}
@keyframes popo{from{transform:translateX(-40px);opacity:0}}
table.hist{border-collapse:collapse;font:500 14px var(--f-mono);margin:6px 0}
table.hist td,table.hist th{border:1px solid var(--line);padding:3px 10px;text-align:center}
table.hist th{color:var(--muted);font-weight:500}
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;min-height:48px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font-weight:700}
.opt.right{border-color:var(--good);background:#18382d}
.opt.wrong{border-color:var(--bad);background:#3a1a24}
.pred{display:flex;gap:8px;align-items:center;justify-content:center;margin:6px 0;font:700 18px var(--f-mono)}
.pred input{width:120px;height:44px;text-align:center;font:700 18px var(--f-mono);background:var(--deep);color:var(--fg);border:2px solid var(--line);border-radius:9px}
.pred input.right{border-color:var(--good)} .pred input.wrong{border-color:var(--bad)}
/* fil d'actu */
.feedwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:12px}
.post{background:#f6f4ff;color:#1b1838;border-radius:14px;padding:12px 14px;min-height:150px}
.post .src{display:flex;align-items:center;gap:8px;font:700 13px var(--f-body);color:#5a5580}
.post .src .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#ddd8ff;font-size:16px}
.post h3{margin:8px 0;font:700 clamp(16px,4vw,19px)/1.3 var(--f-body)}
.post .meta{font:500 12px var(--f-mono);color:#6d688f}
.post .tag{display:inline-block;padding:2px 8px;border-radius:10px;font:700 12px var(--f-body);margin-right:6px}
.verif{margin-top:8px;padding:6px 10px;border-radius:8px;font:700 13px var(--f-body)}
.verif.t{background:#d8f8e6;color:#0d4a2a} .verif.f{background:#ffdbe2;color:#7a0016}
.world{position:relative;height:300px;border-radius:12px;background:#0b0a1c;border:1px solid var(--line);overflow:hidden}
.world svg{position:absolute;inset:0;width:100%;height:100%}
.pp{transition:fill .35s,r .35s}
.gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 12px;margin-top:8px;font:700 12px var(--f-mono)}
.gauge .g{height:9px;border-radius:5px;background:var(--deep);overflow:hidden;margin-top:2px}
.gauge .g div{height:100%;transition:width .6s}
.events{margin-top:8px;font-size:14px;max-height:130px;overflow:auto}
.events div{padding:4px 0;border-bottom:1px solid var(--line);animation:popo .4s}
.likes{font:700 15px var(--f-mono);color:var(--pink)}
/* la bulle */
.feed3{display:grid;gap:10px}
.nw{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#f6f4ff;color:#1b1838;border-radius:12px;padding:10px 12px;animation:popo .35s}
.nw .ic{font-size:28px}
.nw .tt{font:700 15px/1.3 var(--f-body)}
.nw .tp{font:500 12px var(--f-mono);color:#6d688f}
.nw .lk{min-width:54px;height:46px;border-radius:10px;border:2px solid #ff6aa8;background:#fff;font-size:22px}
.nw.target{outline:4px solid var(--good)}
.prof{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:4px 12px;font:700 12px var(--f-mono)}
.prof .g{height:8px;border-radius:4px;background:var(--deep);overflow:hidden}
.prof .g div{height:100%;background:var(--pink);transition:width .5s}
.bubblemap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.bubblemap .tpc{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
.bubblemap .tpc h4{margin:0 0 4px;font:700 13px var(--f-body)}
.bubblemap .seen{color:var(--good)} .bubblemap .unseen{color:var(--muted)}
.ring{width:100%;max-width:360px;display:block;margin:6px auto}
.goal{border:2px solid var(--good);background:#18382d;border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:700}
/* les likes */
.lkwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.lbl{margin:8px 0 4px;font:700 12px var(--f-mono);color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{min-height:50px;padding:4px;background:var(--deep);border:2px solid var(--line);border-radius:10px;font:700 12px var(--f-body);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.chip .em{font-size:22px;line-height:1.1}
.chip.on{border-color:var(--pink);background:#3a1a34}
.chip:disabled{opacity:.3;cursor:default}
.phone{position:relative;height:400px;border-radius:24px;background:#f6f4ff;border:7px solid #2a2550;overflow:hidden;color:#1b1838}
.phone .scr{position:absolute;inset:0;overflow:auto;padding:6px 8px}
.phone .empty{margin-top:40%;text-align:center;color:#8d88b0;font-size:14px}
.notif{position:absolute;left:8px;right:8px;top:8px;z-index:5;padding:8px 10px;border-radius:12px;background:#1b1838ee;color:#fff;font:700 13px var(--f-body);animation:ndrop .3s}
@keyframes ndrop{from{transform:translateY(-130%);opacity:0}}
.mypost{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;padding:8px 4px;border-bottom:1px solid #ddd8ff;animation:popo .35s}
.mypost .ic{font-size:30px}
.mypost .tx{font:700 13px/1.3 var(--f-body)}
.mypost .mt{font:500 11px var(--f-mono);color:#6d688f}
.mypost .ct{font:700 16px var(--f-mono);color:#e0306f;min-width:58px;text-align:right}
.mypost.viral{background:#ffe3ef}
.flame{display:flex;align-items:center;gap:8px;margin-top:10px;font:700 14px var(--f-mono)}
.flame .g,.lvl .g{flex:1;height:10px;border-radius:5px;background:var(--deep);overflow:hidden}
.flame .g div{height:100%;background:linear-gradient(90deg,#ff5a5a,#ffb547)}
.flame.low .g div{background:var(--bad);animation:blink .3s infinite alternate}
.lvl{display:flex;align-items:center;gap:10px;font:700 13px var(--f-mono);margin-bottom:8px}
.lvl .g div{height:100%;background:var(--cyan);transition:width .5s}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:150;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--amber);color:var(--ink);font:700 15px var(--f-body);animation:ndrop .3s;box-shadow:0 4px 14px #000a;text-align:center}
.heart{position:absolute;font-size:22px;pointer-events:none;z-index:6;animation:hfly 1.1s forwards}
@keyframes hfly{to{transform:translate(var(--dx),-150px) scale(1.5);opacity:0}}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.ab .col{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.ab .big{font:700 28px var(--f-mono);color:var(--pink)}
.algo{font:500 14px/1.6 var(--f-mono);background:#050409;border:1px solid var(--line);border-radius:10px;padding:10px 12px;white-space:pre-wrap;text-align:left;color:var(--good)}
.dots{position:relative;height:160px;border-left:2px solid var(--line);border-bottom:2px solid var(--line);margin:10px 4px 26px 34px}
.dots span{position:absolute;transform:translate(-50%,50%);font-size:18px;line-height:1}
.dots .ax{position:absolute;font:500 11px var(--f-mono);color:var(--muted);transform:none}
.hlist{display:grid;gap:3px;font:500 13px var(--f-mono)}
.hlist div{display:grid;grid-template-columns:2.2em 1fr 3.4em;gap:6px;align-items:center}
.hlist i{display:block;height:10px;border-radius:4px;background:var(--pink)}
textarea{width:100%;min-height:64px;padding:10px;background:var(--deep);color:var(--fg);border:1px solid var(--line);border-radius:10px;font:15px var(--f-body);resize:vertical}
.disc{margin-top:16px;border-color:var(--cyan)}
.disc h3{margin:0 0 6px;font:700 15px var(--f-display);color:var(--cyan)}
.notes li{margin-bottom:10px}
.notes .q{color:var(--muted);font-size:14px}
@media (max-width:640px){ .lkwrap{grid-template-columns:1fr} .phone{height:300px} .feedwrap{grid-template-columns:1fr} .bb{grid-template-columns:1fr;justify-items:center} }
@media (prefers-reduced-motion:reduce){ .blood i::after,.wrench,.pk.wait{animation:none!important} }
</style>

<div id="wrap">
  <header><button class="iconbtn" id="home" aria-label="Retour au menu">☰</button><h1>Techno Survivor</h1><button class="iconbtn" id="pausebtn" hidden>Pause</button><span class="pts" id="pts">0 pt</span></header>
  <main id="main"></main>
</div>
<div class="overlay" id="ov" hidden><div class="card" id="ovc"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s), main=$('#main');
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(tag,cls,html,parent){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; parent.appendChild(e); return e; }
function place(e,x,y){ e.style.left=x+'px'; e.style.top=y+'px'; }

/* ---------- sauvegarde locale ---------- */
const KEY='snt-s1-survivor';
let D={ pts:0, best:{}, disc:{} };
try{ const v=JSON.parse(localStorage.getItem(KEY)); if(v && typeof v==='object') D=Object.assign(D,v); }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){} $('#pts').textContent=D.pts+' pt'; }
function addPts(n,x,y,st){ D.pts+=Math.round(n); save(); if(st && x!=null) floatTxt(st,x,y,'+'+Math.round(n),'var(--good)'); }
function floatTxt(st,x,y,t,c){ const e=mk('div','float',t,st); e.style.color=c||'#fff'; place(e,x,y); setTimeout(()=>e.remove(),1000); }
function laser(st,x1,y1,x2,y2,col){ const e=mk('div','laser',null,st); const dx=x2-x1, dy=y2-y1; e.style.left=x1+'px'; e.style.top=y1+'px'; e.style.width=Math.hypot(dx,dy)+'px'; e.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`; e.style.background=col; e.style.boxShadow=`0 0 10px ${col}`; setTimeout(()=>e.remove(),260); }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- boucle de jeu (s'arrête en pause) ---------- */
const G={ cur:null, pause:false };
let last=0;
function frame(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; if(G.cur && !G.pause && G.cur.update) G.cur.update(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function startGame(g){ stopGame(); G.cur=g; G.pause=false; $('#pausebtn').hidden=!g.update; }
function stopGame(){ if(G.cur && G.cur.stop) G.cur.stop(); G.cur=null; G.pause=false; document.body.classList.remove('paused'); $('#pausebtn').hidden=true; $('#pausebtn').textContent='Pause'; $('#ov').hidden=true; }
function togglePause(){ if(!G.cur || !G.cur.update || G.cur.over) return; G.pause=!G.pause; document.body.classList.toggle('paused',G.pause); $('#pausebtn').textContent=G.pause?'Reprendre':'Pause'; }
$('#pausebtn').onclick=togglePause;
addEventListener('keydown',e=>{ if(e.key==='Escape' && G.cur){ e.preventDefault(); togglePause(); } });
function overlay(html){ $('#ovc').innerHTML=html; $('#ov').hidden=false; }

/* ---------- découverte de fin de jeu ---------- */
function discovery(id,q,opts,goodIdx,explain){
  const box=mk('div','card disc',null,main); const prev=D.disc[id]||{}; let pickI=null;
  box.innerHTML=`<h3>Ta découverte</h3><p>${q}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="fb"></div>
    <p class="lead">Avec tes mots, en une phrase :</p><textarea placeholder="J'ai découvert que…">${esc(prev.txt||'')}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn ok" data-ok>Enregistrer et revenir au menu</button></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    pickI=+b.dataset.i;
    box.querySelectorAll('.opt').forEach((x,i)=>{ x.classList.toggle('right',i===goodIdx); x.classList.toggle('wrong',i===pickI && i!==goodIdx); x.disabled=true; });
    const fb=box.querySelector('.fb'); fb.className='fb '+(pickI===goodIdx?'good':'bad'); fb.innerHTML=(pickI===goodIdx?'Oui ! ':'Pas tout à fait. ')+`<span style="color:var(--fg);font-weight:400">${explain}</span>`;
    if(pickI===goodIdx && !prev.got){ prev.got=1; addPts(20); }
  });
  box.querySelector('[data-ok]').onclick=()=>{ D.disc[id]={ q, pick:pickI!=null?opts[pickI]:(prev.pick||''), got:prev.got, txt:box.querySelector('textarea').value.trim() }; save(); menu(); };
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function head(e,t,lead){ main.innerHTML=`<h2>${e} ${t}</h2>${lead?`<p class="lead">${lead}</p>`:''}`; scrollTo(0,0); }
function endCard(title,body,again,disc){
  stopGame();
  overlay(`<h2>${title}</h2><p>${body}</p><div class="row c"><button class="btn ok" id="o-a">Rejouer</button><button class="btn" id="o-d">${disc?'Ma découverte':'Menu'}</button></div>`);
  $('#o-a').onclick=()=>{ $('#ov').hidden=true; again(); };
  $('#o-d').onclick=()=>{ $('#ov').hidden=true; if(disc){ main.querySelectorAll('.stage,.hud,.qbar').forEach(e=>e.remove()); disc(); } else menu(); };
}

/* =========================================================
   1 · ZOMBIES QCM : abats le zombie qui porte la bonne réponse
   ========================================================= */
const ZQ=[
  ['Quelle invention est la plus ancienne ?','La maîtrise du feu',['L\'écriture','La roue','L\'imprimerie']],
  ['L\'écriture est apparue il y a environ…','5 300 ans',['300 000 ans','500 ans','2 millions d\'années']],
  ['Homo sapiens existe depuis environ…','300 000 ans',['5 000 ans','2 000 ans','30 millions d\'années']],
  ['Le numérique, c\'est d\'abord…','Transformer l\'information en nombres',['Tout ce qui est virtuel','Internet','Les jeux vidéo']],
  ['Que montre l\'iceberg de la technologie ?','La partie cachée est bien plus grande que la partie visible',['Les ordinateurs ont froid','Le téléphone suffit à tout faire']],
  ['Pourquoi copier un fichier ne coûte presque rien ?','Ce sont des nombres recopiés à l\'identique',['Les fichiers sont petits','Internet est gratuit']],
  ['Juillet 2024, la mise à jour ratée de CrowdStrike…','A bloqué des millions d\'ordinateurs',['A effacé Internet','A supprimé tous les SMS']],
  ['Internet et le Web…','Le Web est un service qui utilise Internet',['C\'est exactement la même chose','Internet est un site du Web']],
  ['En 1703, Leibniz décrit…','Le système binaire',['L\'imprimerie','Le téléphone','La radio']],
  ['Le métier Jacquard (1801) était programmé avec…','Des cartes perforées',['Un clavier','Un écran tactile','Le Wi-Fi']],
  ['Avant -5000, comment écoutait-on de la musique ?','Chants, flûtes et tambours',['On n\'en écoutait pas','Avec la radio']],
  ['Panne de courant géante en Espagne (2025) : qu\'est-ce qui marche ?','Une radio à piles',['Le distributeur de billets','Le métro','La pompe à essence']],
  ['Le premier smartphone grand public date de…','2007',['1985','1995','2019']],
  ['Un disque vinyle est un support…','Analogique',['Numérique','Virtuel']],
  ['Un CD est un support…','Numérique',['Analogique','Biologique']],
  ['ChatGPT a été rendu public en…','2022',['2007','1999','2012']],
  ['Le premier ordinateur électronique (ENIAC) date de…','1945',['1890','1981','2000']],
  ['Internet (ARPANET) est né en…','1969',['1989','2001','1945']],
  ['Le Web a été inventé en…','1989',['1969','2007','1950']],
  ['Notre relation à la technologie est…','Ambivalente : on aime et on rejette',['Toujours positive','Toujours négative']],
  ['Pourquoi les inventions s\'accélèrent ?','L\'information circule de plus en plus vite',['On est plus intelligents qu\'avant','Il n\'y a plus de règles']]
];
function gZombie(){
  head('🧟','Zombies QCM','Les zombies portent des réponses. <b>Touche</b> celui qui a la bonne réponse avant qu\'ils franchissent la barricade. Une mauvaise cible les rend plus rapides !');
  mk('div','hud','<span class="lives" id="zl"></span><span id="zn"></span>',main);
  const qb=mk('div','qbar',null,main);
  const st=mk('div','stage zst','<div class="barricade"></div><div class="turret">🔫</div>',main);
  const QS=shuffle(ZQ.slice()).slice(0,12);
  const S={ n:-1, lives:3, ok:0, zs:[], mult:1, base:30, wait:0, over:false, W:0, H:0, done:false };
  const g={ over:false };
  const measure=()=>{ S.W=st.clientWidth; S.H=st.clientHeight; };
  const hudUp=()=>{ $('#zl').textContent='♥'.repeat(S.lives)+'♡'.repeat(3-S.lives); $('#zn').textContent=`Question ${Math.min(S.n+1,QS.length)} / ${QS.length} · ${S.ok} abattus`; };
  function wave(){
    S.zs.forEach(z=>z.el.remove()); S.zs=[]; S.n++; S.mult=1; S.done=false;
    if(S.n>=QS.length) return finish();
    const [q,good,bad]=QS[S.n]; qb.textContent=q; hudUp();
    const answers=shuffle([good,...bad.slice(0,3)]), n=answers.length;
    answers.forEach((a,i)=>{
      const el=mk('div','z',`<span class="em">🧟</span><span class="lab">${a}</span>`,st);
      const z={ el, a, good:a===good, x:(i+.5)/n*S.W, y:-30-rand(0,30)-(i%2)*55, vy:(S.base+S.n*1.8)*rand(.85,1.2), ph:rand(0,6) };
      el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); shoot(z); });
      S.zs.push(z);
    });
  }
  function shoot(z){
    if(S.over || G.pause || S.done || !S.zs.includes(z)) return;
    const zx=parseFloat(z.el.style.left), zy=parseFloat(z.el.style.top);
    laser(st,S.W/2,S.H-30,zx,zy,z.good?'#6ee7a0':'#ff5a5a');
    if(z.good){
      S.done=true; S.ok++;
      addPts(10+Math.max(0,Math.round((1-zy/S.H)*10)),zx,zy-30,st);
      const sp=mk('div','splat',null,st); place(sp,zx,zy+10);
      z.el.classList.add('dead');
      S.zs.forEach(o=>{ if(o!==z) o.el.classList.add('flee'); });
      S.wait=.9;
    } else {
      if(z.el.classList.contains('angry')) return;
      z.el.classList.add('angry'); S.mult*=1.35; floatTxt(st,zx,zy-40,'GRRR ! Plus vite !','#ff5a5a'); shake(st);
    }
  }
  function bite(){
    S.done=true; S.lives--; hudUp(); shake(document.body);
    // gerbe de sang sur l'écran
    const b=mk('div','blood',null,st);
    for(let k=0;k<9;k++){ const i=mk('i',null,null,b); const s=rand(60,160); Object.assign(i.style,{width:s+'px',height:s+'px',left:rand(-5,85)+'%',top:rand(-5,70)+'%'}); }
    setTimeout(()=>b.remove(),2300);
    const good=S.zs.find(o=>o.good);
    floatTxt(st,S.W/2,S.H/2,'Mordu ! Réponse : '+(good?good.a:''),'#ffd0d0');
    S.zs.forEach(o=>o.el.classList.add('flee'));
    S.wait=1.8;
  }
  function finish(){
    S.over=g.over=true;
    D.best.zombie=Math.max(D.best.zombie||0,S.ok); save();
    const win=S.lives>0;
    endCard(win?'Tu as survécu !':'Dévoré…', win?`${S.ok} zombies abattus sur ${QS.length}. Il te reste ${S.lives} ♥.`:`Les zombies ont franchi la barricade. ${S.ok} abattus avant la fin.`, gZombie, null);
  }
  g.update=dt=>{
    if(S.over) return;
    if(!S.W) measure();
    if(S.wait>0){ if((S.wait-=dt)<=0){ if(S.lives<=0) return finish(); wave(); } return; }
    for(const z of S.zs){
      z.y+=z.vy*S.mult*dt; z.ph+=dt*3;
      place(z.el,clamp(z.x+Math.sin(z.ph)*8,50,S.W-50),z.y);
      if(!S.done && z.y>S.H-80){ bite(); break; }
    }
  };
  addEventListener('resize',measure);
  g.stop=()=>removeEventListener('resize',measure);
  startGame(g); measure(); hudUp(); wave();
}

/* =========================================================
   2 · LA PIEUVRE : réparer Internet et router les paquets
   ========================================================= */
function gOcto(){
  head('🐙','La pieuvre laser','Une pieuvre géante aux yeux laser coupe les câbles d\'Internet ! <b>Répare</b> les câbles coupés (🔧) et <b>guide les paquets</b> : quand un paquet clignote sur un routeur, touche la machine où il doit aller. Personne ne t\'a donné les règles : devine-les en lisant les adresses.');
  mk('div','hud','<span id="oh"></span><span>🐙 vie de la pieuvre</span>',main);
  const st=mk('div','stage ost','<svg aria-hidden="true"></svg><div class="hpbar"><div style="width:100%"></div></div>',main);
  const tbl=mk('div','card rtable',null,main);
  const svg=st.querySelector('svg');
  // règles cachées, tirées au hasard à chaque partie
  const hostsDef=shuffle([['🏫','Lycée'],['🏥','Hôpital'],['🎮','Jeux'],['🏦','Banque'],['📺','Vidéo'],['📰','Journal']]);
  const up=Math.random()<.5;
  const N={
    S:{x:.07,y:.58,em:'💻',nm:'Toi'},
    A:{x:.3,y:.58,em:'🗼',nm:'Routeur A',router:1,parent:'S'},
    B:{x:.56,y:.36,em:'🗼',nm:'Routeur B',router:1,pre:up?'1':'2',parent:'A'},
    C:{x:.56,y:.82,em:'🗼',nm:'Routeur C',router:1,pre:up?'2':'1',parent:'A'}
  };
  const sub=[shuffle(['1','2','3']),shuffle(['1','2','3'])];
  ['B','C'].forEach((r,ri)=>[.24,.38,.52].forEach((y,k)=>{ const h=hostsDef[ri*3+k]; N[r+k]={x:.88,y:ri?y+.42:y,em:h[0],nm:h[1],addr:N[r].pre+'.'+sub[ri][k],parent:r}; }));
  const kids=id=>Object.keys(N).filter(k=>N[k].parent===id);
  const links=Object.keys(N).filter(k=>N[k].parent).map(k=>({a:N[k].parent,b:k,cut:false,fix:0,line:null,w:null}));
  const linkTo=b=>links.find(l=>l.b===b);
  const K={};   // ce que le joueur a découvert
  const S={ W:0,H:0, pk:[], hp:10, lost:0, ok:0, spawn:1.2, cutT:5, octo:{x:.5,ph:0}, over:false, firing:0 };
  const g={ over:false };
  links.forEach(l=>{ l.line=document.createElementNS('http://www.w3.org/2000/svg','line'); l.line.setAttribute('class','link'); svg.appendChild(l.line); });
  Object.entries(N).forEach(([id,n])=>{
    n.el=mk('button','node'+(n.router?' router':''),`<span class="em">${n.em}</span><span class="nm">${n.nm}</span><span class="ad"></span>`,st);
    n.el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); tapNode(id); });
  });
  const octo=mk('div','octo','🐙<span class="eyes"><i></i><i></i></span>',st);
  const P=id=>({x:N[id].x*S.W,y:N[id].y*S.H});
  function layout(){
    S.W=st.clientWidth; S.H=st.clientHeight;
    Object.values(N).forEach(n=>place(n.el,n.x*S.W,n.y*S.H));
    links.forEach(l=>{ const a=P(l.a), b=P(l.b); l.line.setAttribute('x1',a.x); l.line.setAttribute('y1',a.y); l.line.setAttribute('x2',b.x); l.line.setAttribute('y2',b.y); if(l.w) place(l.w,(a.x+b.x)/2,(a.y+b.y)/2); });
  }
  function labels(){
    ['B','C'].forEach(r=>{ N[r].el.querySelector('.ad').textContent=K[r]?N[r].pre+'.*':''; });
    Object.entries(N).forEach(([id,n])=>{ if(n.addr) n.el.querySelector('.ad').textContent=K[id]?n.addr:'?.?'; });
    tbl.innerHTML=`<b style="color:var(--cyan)">Ta table de routage</b> (elle se remplit avec tes découvertes)<br>`+
      `Routeur A : ${K.B?`<b>${N.B.pre}.*</b> → B`:'<i>?.* → B</i>'} · ${K.C?`<b>${N.C.pre}.*</b> → C`:'<i>?.* → C</i>'}<br>`+
      ['B','C'].map(r=>`Routeur ${r} : `+kids(r).map(h=>K[h]?`<b>${N[h].addr}</b> → ${N[h].em}`:`<i>?.? → ${N[h].em}</i>`).join(' · ')).join('<br>');
  }
  const hudUp=()=>{ $('#oh').textContent=`📦 livrés : ${S.ok} · perdus : ${S.lost} / 6`; st.querySelector('.hpbar div').style.width=(S.hp*10)+'%'; };
  function cut(l){
    l.cut=true; l.line.classList.add('cut');
    const a=P(l.a), b=P(l.b);
    l.w=mk('button','wrench','🔧',st); place(l.w,(a.x+b.x)/2,(a.y+b.y)/2);
    l.w.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(!l.fix && !G.pause){ l.fix=.8; l.w.classList.add('fix'); } });
    if(links.filter(x=>x.cut).length>=3) alertMsg('INTERNET EN PANNE !');
  }
  function alertMsg(t){ const a=mk('div','alert',t,st); setTimeout(()=>a.remove(),1400); }
  function spawn(){
    const h=pick(Object.keys(N).filter(k=>N[k].addr));
    const el=mk('div','pk',`📦 ${N[h].addr}`,st);
    const p={ el, dest:N[h].addr, at:'S', to:null, t:0, x:P('S').x, y:P('S').y, wait:0 };
    S.pk.push(p); send(p,'A');
  }
  function send(p,to){ p.from=p.at; p.to=to; p.t=0; p.wait=0; p.el.classList.remove('wait'); }
  function arrive(p){
    p.at=p.to; p.to=null; const n=N[p.at];
    if(n.addr){
      if(n.addr===p.dest) return delivered(p);
      K[p.at]=1; labels(); n.el.classList.add('flash-bad'); setTimeout(()=>n.el.classList.remove('flash-bad'),700);
      return lose(p,`Raté : ${n.em} a l'adresse ${n.addr}`);
    }
    if(n.pre){ K[p.at]=1; labels(); if(p.dest[0]!==n.pre) return lose(p,`${n.nm} ne gère que ${n.pre}.*`); }
    p.wait=Math.max(5,9-S.ok*.25); p.el.classList.add('wait');
  }
  function delivered(p){
    S.ok++; K[p.at]=1; labels(); kill(p);
    const pos=P(p.at); addPts(10,pos.x,pos.y-30,st);
    // les routeurs reliés tirent sur la pieuvre
    const ox=S.octo.x*S.W, oy=S.H*.11;
    ['A','B','C'].forEach(r=>{ if(!linkTo(r).cut){ const q=P(r); laser(st,q.x,q.y,ox,oy,'#5ce1e6'); } });
    S.hp=Math.max(0,S.hp-1); hudUp(); floatTxt(st,ox,oy+40,'-1 ❤','#ff6aa8');
    if(S.hp<=0) finish(true);
  }
  function lose(p,msg){ S.lost++; floatTxt(st,clamp(p.x,110,S.W-110),p.y-36,msg,'#ffb3b3'); kill(p); hudUp(); shake(st); if(S.lost>=6) finish(false); }
  function kill(p){ p.el.remove(); const i=S.pk.indexOf(p); if(i>=0) S.pk.splice(i,1); }
  function tapNode(id){
    if(G.pause || S.over) return;
    const n=N[id]; if(!n.parent) return;
    const ws=S.pk.filter(p=>p.at===n.parent && !p.to && p.wait>0).sort((a,b)=>a.wait-b.wait);
    if(!ws.length) return;
    if(linkTo(id).cut){ const pos=P(id); floatTxt(st,pos.x,pos.y-40,'Câble coupé : répare-le 🔧','#ff5a5a'); return; }
    send(ws[0],id);
  }
  function finish(win){
    if(S.over) return; S.over=g.over=true;
    D.best.octo=Math.max(D.best.octo||0,S.ok); save();
    endCard(win?'La pieuvre est vaincue !':'Internet est tombé…', win?`${S.ok} paquets livrés, ${S.lost} perdus. Tes routeurs ont repoussé la pieuvre.`:`Trop de paquets perdus. Tu en as livré ${S.ok}. Regarde ta table de routage et retente !`, gOcto, ()=>{
      mk('div','card',`<p>Les vraies règles de cette partie :</p><div class="rtable">Routeur A : <b>${N.B.pre}.*</b> → B · <b>${N.C.pre}.*</b> → C<br>${['B','C'].map(r=>`Routeur ${r} : `+kids(r).map(h=>`<b>${N[h].addr}</b> → ${N[h].em} ${N[h].nm}`).join(' · ')).join('<br>')}</div>`,main);
      discovery('octo','Comment un routeur sait-il où envoyer un paquet ?',[
        'Il l\'envoie au hasard et espère qu\'il arrive',
        'Il lit l\'adresse de destination et suit sa table de routage, morceau par morceau',
        'Il envoie une copie du paquet à toutes les machines du monde'],1,
        'Chaque routeur ne connaît qu\'une partie du chemin : il lit le début de l\'adresse et passe le paquet au bon voisin. Si un câble est coupé, le paquet ne passe plus : Internet dépend de son infrastructure physique.');
    });
  }
  g.update=dt=>{
    if(S.over) return;
    if(!S.W) layout();
    S.octo.ph+=dt*.6; S.octo.x=.5+Math.sin(S.octo.ph)*.22; place(octo,S.octo.x*S.W,S.H*.11);
    if(S.firing>0 && (S.firing-=dt)<=0) octo.classList.remove('fire');
    if((S.cutT-=dt)<=0){
      S.cutT=Math.max(3.2,7-S.ok*.25)*rand(.8,1.2);
      const ok=links.filter(l=>!l.cut);
      if(ok.length){ const l=pick(ok), a=P(l.a), b=P(l.b), ox=S.octo.x*S.W, oy=S.H*.11, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
        octo.classList.add('fire'); S.firing=.35; laser(st,ox-8,oy-8,mx,my,'#ff2a2a'); laser(st,ox+8,oy-8,mx,my,'#ff2a2a'); cut(l); }
    }
    links.forEach(l=>{ if(l.fix>0 && (l.fix-=dt)<=0){ l.fix=0; l.cut=false; l.line.classList.remove('cut'); l.w.remove(); l.w=null; addPts(2); } });
    if((S.spawn-=dt)<=0){ const max=S.ok<4?1:S.ok<9?2:3; if(S.pk.length<max) spawn(); S.spawn=rand(2,4); }
    for(const p of [...S.pk]){
      if(S.over) break;
      if(p.to){
        if(linkTo(p.to).cut){ p.el.classList.add('wait'); continue; }   // bloqué devant un câble coupé
        p.el.classList.remove('wait');
        const a=P(p.from), b=P(p.to), d=Math.hypot(b.x-a.x,b.y-a.y)||1;
        p.t+=dt*170/d; const t=Math.min(1,p.t); p.x=a.x+(b.x-a.x)*t; p.y=a.y+(b.y-a.y)*t; place(p.el,p.x,p.y-26);
        if(t>=1) arrive(p);
      } else if(p.wait>0){
        p.wait-=dt; p.el.innerHTML=`📦 ${p.dest}<small>${Math.ceil(p.wait)}s</small>`;
        if(p.wait<=0) lose(p,'Trop tard : paquet expiré');
      }
    }
  };
  const onR=()=>layout(); addEventListener('resize',onR);
  g.stop=()=>removeEventListener('resize',onR);
  startGame(g); layout(); labels(); hudUp();
}

/* =========================================================
   3 · LA BOÎTE NOIRE : deviner la règle cachée
   ========================================================= */
const BOX=[
  { f:n=>n*2, ok:'Elle double le nombre (× 2)', bad:['Elle ajoute 2','Elle met le nombre au carré','Elle ajoute 10'] },
  { f:n=>n+7, ok:'Elle ajoute 7', bad:['Elle double le nombre','Elle ajoute 5','Elle retire 7'] },
  { f:n=>n*n, ok:'Elle met le nombre au carré (n × n)', bad:['Elle double le nombre','Elle ajoute le nombre suivant','Elle multiplie par 4'] },
  { f:n=>n%2, ok:'Elle donne 0 si le nombre est pair, 1 s\'il est impair', bad:['Elle donne 0 ou 1 au hasard','Elle donne 1 si le nombre est plus grand que 10','Elle donne le dernier chiffre'] },
  { f:n=>n<10?n+10:n-10, ok:'Si le nombre est plus petit que 10, elle ajoute 10, sinon elle retire 10', bad:['Elle ajoute 10','Elle retire 10','Elle inverse les chiffres'] },
  { f:n=>Number(n.toString(2)), ok:'Elle écrit le nombre en binaire', bad:['Elle multiplie par 10','Elle écrit le nombre à l\'envers','Elle met le nombre au carré'] }
];
function gBox(lv=0){
  const B=BOX[lv]; const tests=[]; let phase='test';
  stopGame();
  head('⬛','La boîte noire',`Boîte ${lv+1} / ${BOX.length}. Cette boîte transforme les nombres selon une <b>règle cachée</b>. Fais des essais, regarde ce qui sort, puis propose ton hypothèse. Moins tu fais d'essais, plus tu gagnes de points.`);
  const box=mk('div',null,`<div class="bb"><div class="io"><input id="bi" type="number" inputmode="numeric" min="0" max="99" placeholder="0 à 99" aria-label="Nombre à entrer"><button class="btn ok" id="bgo">Entrer ▶</button></div>

  function run(){

  // preuve : prédire 3 sorties avant de les voir
  function proof(){

    };
  }

}

const EMO={ col:['😡','Colère','#ff5a5a',.85,3], peur:['😱','Peur','#b69cff',.8,2.5], rire:['😂','Rire','#ffb547',.65,2], joie:['🥰','Entraide','#6ee7a0',.55,1.5], info:['🤔','Info','#5ce1e6',.35,.6] };
const NEWS=[
  ['col','LaVraieInfo24','SCANDALE : la cantine va servir des insectes à tous les repas dès lundi !!!',0,'Aucune cantine n\'a annoncé ça : site connu pour ses fausses infos.'],

  ['peur','@vid_insolite','VIDÉO : un requin filmé dans la Seine à Paris !',0,'C\'est un hypertrucage (deepfake).'],
  ['info','Santé publique','Étude : un ado sur trois dort moins de 7 heures à cause des écrans le soir',1,'Étude réelle, publiée et sourcée.'],

];
function gFeed(){
  stopGame();
  head('📱','Le fil d\'actu','Tu as 300 abonnés. Pour chaque publication, choisis : <b>republier</b> ou <b>ignorer</b>. Tu peux vérifier 3 fois une info. Regarde les émotions se propager dans le monde… et ton compteur de likes.');
  const news=shuffle(NEWS.slice()).slice(0,10);
  const S={ i:0, likes:0, checks:3, fakeShared:0, shared:0, ev:new Set(), token:{}, busy:false };
  mk('div',null,`<div class="hud"><span id="fn"></span><span class="likes" id="fl">❤ 0 like</span></div>
    <div class="feedwrap"><div><div class="post" id="post"></div><div class="row" style="margin-top:10px"><button class="btn ok" id="rp">🔁 Republier</button><button class="btn" id="ig">Ignorer</button><button class="btn" id="vf">🔎 Vérifier (3)</button></div></div>
    <div><div class="world" id="world"><svg aria-label="Le monde : chaque point est une personne, le blanc c'est toi"></svg></div><div class="gauges" id="gg"></div><div class="events" id="evs"></div></div></div>`,main);
  // le monde : 46 personnes reliées à leurs voisins proches (toi au centre)
  const svg=$('#world svg'), NP=46, P=[];
  for(let k=0;k<NP;k++){ const a=rand(0,Math.PI*2), r=k?Math.sqrt(rand(.02,1))*44:0; P.push({ x:50+Math.cos(a)*r*1.5/1.5, y:50+Math.sin(a)*r, m:{col:0,peur:0,rire:0,joie:0,info:0}, nb:[] }); }
  P.forEach((p,i)=>{ P.map((q,j)=>[j,Math.hypot(q.x-p.x,q.y-p.y)]).filter(([j])=>j!==i).sort((a,b)=>a[1]-b[1]).slice(0,i?3:7).forEach(([j])=>{ if(!p.nb.includes(j)){ p.nb.push(j); P[j].nb.push(i); } }); });
  svg.setAttribute('viewBox','0 0 100 100');
  let lines='';
  P.forEach((p,i)=>p.nb.forEach(j=>{ if(j>i) lines+=`<line x1="${p.x}" y1="${p.y}" x2="${P[j].x}" y2="${P[j].y}" stroke="#2a2650" stroke-width=".4"/>`; }));
  svg.innerHTML=lines+P.map((p,i)=>`<circle class="pp" cx="${p.x}" cy="${p.y}" r="${i?1.7:2.8}" fill="${i?'#4a4570':'#fff'}"/>`).join('');
  const dots=[...svg.querySelectorAll('circle')];
  const color=i=>{ const m=P[i].m; let best=null, v=.15; for(const k in m){ if(m[k]>v){ v=m[k]; best=k; } } return best?EMO[best][2]:(i?'#4a4570':'#fff'); };
  const paint=()=>dots.forEach((d,i)=>{ d.setAttribute('fill',color(i)); d.setAttribute('r',(i?1.7:2.8)+Math.min(1.6,Math.max(...Object.values(P[i].m))*1.2)); });
  const avg=k=>Math.round(P.reduce((s,p)=>s+Math.min(1,p.m[k]),0)/NP*100);
  function gauges(){
    const tr=clamp(100-S.fakeShared*18-avg('col')*.3,0,100);
    $('#gg').innerHTML=[['😡 Colère',avg('col'),'#ff5a5a'],['😱 Peur',avg('peur'),'#b69cff'],['🥰 Entraide',avg('joie'),'#6ee7a0'],['🤝 Confiance',Math.round(tr),'#5ce1e6']].map(([t,v,c])=>`<div class="gauge">${t} ${v}%<div class="g"><div style="width:${v}%;background:${c}"></div></div></div>`).join('');
    return tr;
  }
  function event(t){ if(S.ev.has(t)) return; S.ev.add(t); $('#evs').insertAdjacentHTML('afterbegin',`<div>${t}</div>`); }
  // propagation : une vague part d'une personne, plus loin pour les émotions fortes
  function spread(src,e,force){
    const tok=S.token, base=EMO[e][3], seen=new Set([src]); let front=[src], depth=0;
    P[src].m[e]+=.6;
    const step=()=>{
      if(tok!==S.token) return;
      depth++; const nx=[];
      front.forEach(i=>P[i].nb.forEach(j=>{ if(!seen.has(j) && Math.random()<base*force*Math.pow(.9,depth)){ seen.add(j); nx.push(j); P[j].m[e]+=.55; } }));
      paint(); front=nx;
      if(nx.length && depth<7) setTimeout(step,260); else afterSpread();
    };
    paint(); setTimeout(step,260);
  }
  function afterSpread(){
    const tr=gauges();
    if(avg('col')>35) event('📢 Une manifestation dégénère en ville : chacun accuse l\'autre camp.');
    if(avg('peur')>35) event('🛒 Ruée dans les supermarchés : plus de papier toilette !');
    if(avg('joie')>30) event('🤝 Record de dons à la collecte solidaire du quartier.');
    if(tr<55) event('📉 Plus personne ne croit les médias : même les vraies infos sont rejetées.');
    if(avg('rire')>30) event('😂 Le chat du train devient la mascotte de la ville.');
    S.busy=false; S.i++; next();
  }
  function show(){
    const [e,src,title]=news[S.i], E=EMO[e];
    $('#fn').textContent=`Publication ${S.i+1} / ${news.length}`;
    $('#post').innerHTML=`<div class="src"><span class="av">${E[0]}</span>${src} <span class="meta">· il y a ${randi(2,59)} min</span></div><h3>${title}</h3>
      <span class="tag" style="background:${E[2]}33">${E[0]} ${E[1]}</span><span class="meta">🔥 potentiel : ${Math.round(E[4]*rand(900,1600)).toLocaleString('fr-FR')} partages</span><div id="vres"></div>`;
    $('#vf').textContent=`🔎 Vérifier (${S.checks})`; $('#vf').disabled=!S.checks;
  }
  function next(){
    if(S.i>=news.length) return end();
    P.forEach(p=>{ for(const k in p.m) p.m[k]*=.82; }); paint(); gauges();
    show(); ['#rp','#ig'].forEach(s=>$(s).disabled=false);
  }
  function choose(share){
    if(S.busy) return; S.busy=true; ['#rp','#ig','#vf'].forEach(s=>$(s).disabled=true);
    const [e,, ,trueNews]=news[S.i];
    if(share){ S.shared++; if(!trueNews) S.fakeShared++; const gain=Math.round(EMO[e][4]*randi(40,90)); S.likes+=gain; $('#fl').textContent=`❤ ${S.likes.toLocaleString('fr-FR')} likes`; const w=$('#world'); floatTxt(w,w.clientWidth/2,w.clientHeight/2-20,'+'+gain+' ❤','#ff6aa8'); addPts(1); spread(0,e,1); }
    else spread(randi(5,NP-1),e,.55);   // d'autres le partagent quand même, moins fort
  }
  $('#rp').onclick=()=>choose(true); $('#ig').onclick=()=>choose(false);
  $('#vf').onclick=()=>{ if(!S.checks || S.busy) return; S.checks--; const [, , ,t,why]=news[S.i]; $('#vres').innerHTML=`<div class="verif ${t?'t':'f'}">${t?'✔ Vrai':'✘ Faux'} : ${why}</div>`; $('#vf').disabled=true; $('#vf').textContent=`🔎 Vérifier (${S.checks})`; };
  function end(){
    const c=avg('col'), p=avg('peur'), j=avg('joie');
    const world=(c+p)>(j+20)?'Le monde est devenu <b>tendu et méfiant</b> : colère et peur dominent.':j>=c?'Le monde est plutôt <b>apaisé et solidaire</b>.':'Le monde est <b>partagé</b> : un peu de tout.';
    D.best.feed=Math.max(D.best.feed||0,S.likes); save();
    mk('div','card',`<h3 style="margin:0 0 6px">Bilan</h3><p>${world}</p><p>Tu as republié <b>${S.shared}</b> publications, dont <b>${S.fakeShared}</b> fausses, et gagné <b>${S.likes.toLocaleString('fr-FR')} likes</b>.</p>
      <p class="lead">Compare avec ton voisin : celui qui a le plus de likes a-t-il rendu le monde meilleur ?</p><div class="row"><button class="btn" id="fr">Rejouer</button></div>`,main);
    $('#fr').onclick=gFeed;
    discovery('feed','Pourquoi les publications qui mettent en colère ou font peur circulent plus vite ?',[
      'Parce qu\'elles sont plus souvent vraies',
      'Parce que les émotions fortes donnent envie de partager, et que les plateformes mettent en avant ce qui fait réagir',
      'C\'est le hasard'],1,
      'Les émotions fortes se propagent plus loin et rapportent plus de likes : c\'est l\'<b>économie de l\'attention</b>. Chaque personne est un relais : en republiant ou non, tu changes la direction que prend le monde.');
  }

}

// thèmes rangés en cercle : chaque thème est voisin des deux d'à côté
const TOP=[['⚽','Sport'],['🎮','Jeux vidéo'],['💻','Tech'],['🔬','Sciences'],['🌍','Climat'],['🐼','Animaux'],['😂','Humour'],['🎵','Musique'],['👗','Mode'],['🎬','Cinéma'],['🚨','Faits divers'],['🗳️','Politique']];
const ART=[
  ['Le PSG gagne au bout du suspense','Une lycéenne sélectionnée en équipe de France de handball','Les JO 2028 dévoilent leurs nouveaux sports'],
  ['Le jeu le plus attendu de l\'année repoussé','Un joueur termine Zelda en 20 minutes','Les e-sportifs bientôt reconnus comme athlètes ?'],
  ['Un nouveau téléphone pliable à 2 000 €','Une IA écrit un roman entier','Panne géante chez un réseau social'],
  ['Le télescope James Webb photographie une galaxie record','Des chercheurs recréent un son vieux de 3 000 ans','Une fusée réutilisable se pose sur une barge'],
  ['Record de chaleur en octobre','Les glaciers des Alpes ont perdu 10 % en deux ans','Une ville rend ses bus gratuits pour moins polluer'],
  ['Un bébé panda est né au zoo de Beauval','Les abeilles reviennent dans les villes sans pesticides','Un chien sauve son maître d\'une avalanche'],
  ['Le mème du chat qui juge tout le monde','Un prof se filme en train de rater sa démo','Les pires titres de films traduits en français'],
  ['Un rappeur français bat un record de streams','Concert surprise dans le métro','La musique la plus écoutée au monde cette semaine'],
  ['La mode des années 2000 revient','Une marque accusée de détruire ses invendus','Des vêtements fabriqués avec des bouteilles en plastique'],
  ['Le film de super-héros de trop ?','Un film d\'animation français aux Oscars','Les séries les plus regardées du mois'],
  ['Incendie spectaculaire dans un entrepôt','Arnaque au faux colis : des milliers de victimes','Course-poursuite filmée en direct'],
  ['Le vote à 16 ans en débat','Grève dans les transports jeudi','Un député interpelle le ministre sur les écrans à l\'école']
];
const ADJ=(a,b)=>{ const d=Math.abs(a-b); return Math.min(d,TOP.length-d); };
function gBubble(){
  stopGame();
  head('🫧','La bulle','Ton fil te propose 3 nouvelles à chaque tour. <b>Like</b> celle qui t\'intéresse le plus : l\'algorithme apprend ce que tu aimes… Joue 12 tours.');
  const w=TOP.map(()=>1), seen=new Set();
  let round=0, mission=null;
  const box=mk('div',null,`<div class="hud"><span id="br"></span><span class="likes" id="bl"></span></div><div id="bgoal"></div><div class="feed3" id="bf3"></div>
    <div class="card"><p style="margin:0 0 6px"><b style="color:var(--cyan)">Ce que l'algorithme pense de toi</b></p><div class="prof" id="bprof"></div></div>`,main);
  const prof=()=>{ const mx=Math.max(...w); $('#bprof').innerHTML=TOP.map((t,i)=>`<div>${t[0]} ${t[1]}<div class="g"><div style="width:${Math.round(w[i]/mx*100)}%"></div></div></div>`).join(''); };
  // tirage pondéré de 3 thèmes différents
  function draw(){
    const idx=TOP.map((_,i)=>i), out=[];
    for(let k=0;k<3;k++){ let s=idx.reduce((a,i)=>a+w[i],0), r=Math.random()*s; let c=idx[0]; for(const i of idx){ r-=w[i]; if(r<=0){ c=i; break; } } out.push(c); idx.splice(idx.indexOf(c),1); }
    return out;
  }
  function like(t){
    // boucle de rétroaction : le thème liké et ses voisins montent, le reste baisse
    TOP.forEach((_,i)=>{ const d=ADJ(i,t); w[i]*= d===0?2.4 : d===1?1.5 : .8; });
    const s=w.reduce((a,b)=>a+b,0); w.forEach((v,i)=>w[i]=v/s*TOP.length);
  }
  function show(){
    const ts=draw();
    if(mission){ const near=ts.includes(mission.t); $('#br').textContent=`Mission : ${mission.likes} like${mission.likes>1?'s':''} utilisé${mission.likes>1?'s':''} (objectif ${mission.par})`;
      if(near) return found(ts); }
    else $('#br').textContent=`Tour ${round+1} / 12`;
    $('#bf3').innerHTML=ts.map(t=>{ const a=ART[t].map((x,k)=>[x,k]).filter(([,k])=>!seen.has(t+'-'+k)); const [title,k]=a.length?pick(a):[ART[t][0],0]; return `<div class="nw" data-t="${t}" data-k="${k}"><span class="ic">${TOP[t][0]}</span><span><span class="tt">${title}</span><br><span class="tp">${TOP[t][1]}</span></span><button class="lk" aria-label="J'aime">❤</button></div>`; }).join('');
    $('#bf3').querySelectorAll('.nw').forEach(n=>{ seen.add(n.dataset.t+'-'+n.dataset.k); n.querySelector('.lk').onclick=()=>{ like(+n.dataset.t); prof(); if(mission){ mission.likes++; if(mission.likes>=15) return failMission(); } else round++; if(!mission && round>=12) return reveal(); show(); }; });
  }
  // fin de la phase libre : tout ce que tu n'as pas vu
  function reveal(){
    $('#bf3').innerHTML=''; $('#br').textContent='Fin du fil';
    const tot=TOP.length*3, nb=seen.size;
    const never=TOP.filter((_,t)=>![0,1,2].some(k=>seen.has(t+'-'+k)));
    mk('div','card',`<h3 style="margin:0 0 6px">Tout ce que tu n'as pas vu</h3><p>Tu as vu <b>${nb}</b> nouvelles sur ${tot}. ${never.length?`Tu n'as <b>jamais</b> vu un seul article sur : ${never.map(t=>t[0]+' '+t[1]).join(', ')}.`:''}</p>
      <div class="bubblemap">${TOP.map((tp,t)=>`<div class="tpc"><h4>${tp[0]} ${tp[1]}</h4>${ART[t].map((a,k)=>`<div class="${seen.has(t+'-'+k)?'seen':'unseen'}">${seen.has(t+'-'+k)?'👁':'·'} ${a}</div>`).join('')}</div>`).join('')}</div>
      <p class="lead" style="margin-top:8px">En vert : ce que l'algorithme t'a montré. En gris : tout le reste du monde.</p><div class="row"><button class="btn ok" id="bm">Mission : sortir de ta bulle ▶</button></div>`,main).scrollIntoView({behavior:'smooth'});
    $('#bm').onclick=startMission;
  }
  // mission : faire apparaître une nouvelle éloignée de ton profil en un minimum de likes
  function startMission(){
    main.querySelectorAll('.card:not(:last-of-type)').forEach(()=>{});
    const top=w.indexOf(Math.max(...w)), far=(top+6)%TOP.length, k=randi(0,2);
    mission={ t:far, k, likes:0, par:ADJ(top,far)-1 };
    main.querySelectorAll('.card').forEach(c=>{ if(!c.contains($('#bprof'))) c.remove(); });
    $('#bgoal').innerHTML=`<div class="goal">🎯 Mission : fais apparaître dans ton fil l'article « ${ART[far][k]} » (${TOP[far][0]} ${TOP[far][1]}).<br><span style="font-weight:400">C'est très loin de ton profil. Objectif : en <b>${mission.par} likes</b> ou moins. Astuce : like des sujets de plus en plus proches.</span></div>`;
    show(); scrollTo(0,0);
  }

    <div class="games">${GAMES.map(([id,e,t,d],i)=>`<button class="gcard${D.disc[id]?' done':''}" data-i="${i}"><span class="e">${e}</span><span class="t">${i+1} · ${t}</span><span class="d">${d}</span><span class="s">${D.disc[id]?'✓ découverte notée':''}${D.best[id]?` · record ${D.best[id].toLocaleString('fr-FR')}`:''}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="notes">📒 Mes découvertes</button></div>`;
  main.querySelectorAll('.gcard').forEach(b=>b.onclick=()=>GAMES[+b.dataset.i][4]());
  $('#notes').onclick=notes; scrollTo(0,0);
}
function notes(){
  stopGame();
  const L=GAMES.map(([id,e,t])=>({e,t,d:D.disc[id]}));
  main.innerHTML=`<h2>📒 Mes découvertes</h2><p class="lead">Recopie-les dans ton cahier, ou copie-les pour ton professeur.</p>
    <ol class="notes">${L.map(({e,t,d})=>`<li><b>${e} ${t}</b><br>${d?`<span class="q">${esc(d.q)}</span><br>${esc(d.pick||'(pas de réponse)')}${d.txt?`<br>« ${esc(d.txt)} »`:''}`:'<span class="q">Pas encore fait.</span>'}</li>`).join('')}</ol>
    <p>Total : <b>${D.pts} points</b></p><div class="row"><button class="btn ok" id="cpy">Copier le texte</button><button class="btn" id="back">Menu</button><button class="btn" id="rs">Tout effacer</button></div><p class="fb" id="nf"></p>`;
  const txt='Mes découvertes (SNT S1)\n\n'+L.map(({e,t,d})=>`${e} ${t}\n${d?`${d.q}\n→ ${d.pick||'-'}${d.txt?`\n« ${d.txt} »`:''}`:'(pas fait)'}`).join('\n\n');
  $('#cpy').onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); $('#nf').className='fb good'; $('#nf').textContent='Copié !'; }catch(e){ $('#nf').className='fb bad'; $('#nf').textContent='Copie impossible ici : sélectionne le texte à la main.'; } };
  $('#back').onclick=menu;
  $('#rs').onclick=()=>{ if(confirm('Effacer tes découvertes, records et points ?')){ D={pts:0,best:{},disc:{}}; save(); menu(); } };
}
$('#home').onclick=menu;
save(); menu();
</script>

</body></html>

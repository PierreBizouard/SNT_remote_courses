    if(S.ms>=3) return finish();
    mission();
  }
  function finish(){
    S.over=g.over=true; D.best.sel=Math.max(D.best.sel||0,S.likes); save();
    z.innerHTML='';
    mk('div','card',`<h3 style="margin:0 0 6px">Deux boucles</h3>
      <ul><li><b>Mission 1</b> : tes likes ont renforcé tes thèmes, qui sont revenus plus souvent, que tu as likés encore plus… C'est une <b>boucle de rétroaction positive</b> : elle <b>amplifie</b>. Résultat : un flux qui te ressemble, mais une diversité qui s'effondre (c'est la bulle).</li>
      <li><b>Mission 2</b> : le thème que tu voulais n'apparaissait presque plus, donc tu ne pouvais pas le liker, donc il n'apparaissait pas… Pour en sortir il faut de la <b>découverte</b> : du hasard qui casse la boucle.</li>
      <li><b>Mission 3</b> : l'anti-répétition est une <b>contre-réaction</b> (rétroaction négative) : plus un thème prend de place, plus elle le freine. Sur les courbes, tu l'as vue : le thème qui dépasse le seuil est poussé vers le bas (▼), les courbes se resserrent au lieu de s'écarter. Elle <b>stabilise</b>, comme un thermostat ou la transpiration qui fait baisser la température du corps.</li></ul>
      <p>Les vrais réseaux règlent ces boutons pour que tu restes le plus longtemps possible. Depuis 2023, en Europe, le règlement sur les services numériques (DSA) oblige les très grandes plateformes à proposer au moins un fil qui n'est <b>pas</b> basé sur ton profil.</p>
      <div class="row"><button class="btn" id="sl-a2">Rejouer</button><button class="btn ok" id="sl-dd">Noter ma découverte</button></div>`,z);
    $('#sl-a2').onclick=gSel;
    $('#sl-dd').onclick=()=>{ $('#sl-dd').parentNode.remove(); discovery('sel','Pourquoi un fil peut-il finir par ne montrer presque qu\'une seule chose ?',[

      'Parce que les autres thèmes n\'existent plus',
      'Parce que l\'algorithme choisit au hasard'],0,
      'Une <b>boucle de rétroaction positive</b> amplifie ce qui existe déjà : c\'est elle qui fabrique la bulle. Une <b>contre-réaction</b> (découverte, anti-répétition) freine l\'emballement et rééquilibre le flux.'); };
    z.scrollIntoView({behavior:'smooth'});
  }
  g.update=dt=>{
    if(S.over) return;
    S.t+=dt; S.mt+=dt; S.spawn-=dt;
    if(S.spawn<=0){ spawn(); S.spawn=.85; }
    const H=flux.clientHeight;
    for(const o of S.it){ o.y+=62*dt; o.el.style.top=o.y+'px'; }
    S.it=S.it.filter(o=>{ if(o.y>H+10){ o.el.remove(); return false; } return true; });
    // l'algorithme oublie lentement ce qu'on ne like plus
    const r=val('#sl-r'); S.prof=S.prof.map(p=>Math.max(.15,p*(1-dt*.015*(.3+r))));

    if(S.ms===0 && S.hist.length>=12 && S.m>=.85) done();

    else if(S.ms===2){ if(S.m>=.55 && S.div>=.75) S.hold+=dt; else S.hold=Math.max(0,S.hold-1.5*dt); mission(); if(S.hold>=10) done(); else if(S.mt>30 && !S.hinted){ S.hinted=1; hint('Essaie l\'anti-répétition : c\'est une contre-réaction.'); } }
  };
  S.ms=0; mission(); startGame(g);
}

// qui fait la boîte : temps (s par commande), coût par commande, mise en place, erreurs
const UW={
  h:{e:'🙋',n:'Humain',t:5,c:3,setup:0},
  r:{e:'⚙️',n:'Machine à règles',t:.5,c:.2,setup:15},
  a:{e:'🤖',n:'IA',t:1,c:.5,setup:30}
};
// simule N commandes à travers la chaîne ; renvoie les mesures et les causes d'erreurs
function usineSim(M,chain,N=20,rnd=Math.random){
  const ST=M.steps, res={ time:0, cost:0, err:0, sat:0, notes:{}, items:[] };
  const note=(k,t)=>{ res.notes[k]=res.notes[k]||{t,n:0}; res.notes[k].n++; };
  // mise en place : une machine inventée ne se paie qu'une fois
  const setups=new Set(); chain.forEach(b=>{ if(b.w!=='h') setups.add(b.m||b.id); });
  chain.forEach(b=>{ if(b.w!=='h' && setups.has(b.m||b.id)){ setups.delete(b.m||b.id); res.cost+=UW[b.w].setup; } });
  // étapes manquantes ou dans le désordre
  const ids=chain.map(b=>b.id), pos=Object.fromEntries(ids.map((id,i)=>[id,i]));
  const missing=Object.keys(ST).filter(k=>ST[k].req && !ids.includes(k));
  const disorder=chain.filter(b=>ST[b.id]&&(ST[b.id].after||[]).some(a=>pos[a]==null||pos[a]>pos[b.id]));
  const rI=chain.findIndex(b=>ST[b.id]&&ST[b.id].route), hasClaim=chain.some(b=>ST[b.id]&&ST[b.id].claim);
  for(let i=0;i<N;i++){
    let t=0, c=0, bad=false, sat=100, lost=0; const marks=[];
    chain.forEach((b,k)=>{
      const s=ST[b.id]||{exc:0,emp:0,grav:0,data:.5,custom:1}, W=UW[b.w];
      let tt=W.t*(b.m?.6:1)*(b.w==='a'&&s.phys?1.5:1); c+=W.c;
      if(k>0 && chain[k-1].w!==b.w && !(b.m&&chain[k-1].m===b.m)) tt+=.3;   // passage de relais
      let e=false;
      const ex=rnd()<s.exc;
      if(ex){
        // un aiguillage placé avant repère le cas bizarre et l'envoie à un humain
        const caught=rI>=0 && rI<k && rnd()<{h:1,a:.85,r:.3}[chain[rI].w];
        if(caught){ tt+=UW.h.t; c+=UW.h.c; if(rnd()<.02) e=true; }
        else if(b.w==='r'){ if(rnd()<.9){ e=true; note('r-'+b.id,`${s.e} ${s.n} : la machine à règles ne sait pas quoi faire (${s.x})`); } }
        else if(b.w==='a'){ if(rnd()<.5){ e=true; note('a-'+b.id,`${s.e} ${s.n} : l'IA répond avec assurance… et se trompe (${s.x})`); } }
        else if(rnd()<.05) e=true;
      } else {
        const pe=b.w==='h'?.02:b.w==='r'?.005:.1*(1-s.data*.7);
        if(rnd()<pe){ e=true; if(b.w==='a') note('a2-'+b.id,`${s.e} ${s.n} : l'IA manque d'exemples pour bien apprendre`); if(b.w==='h') note('h-'+b.id,`${s.e} ${s.n} : un humain fatigué fait une erreur`); }
      }
      if(s.emp && b.w!=='h'){ const p=s.emp*(b.w==='r'?40:22); sat-=p; if(p>=15 && i===0) note('emp-'+b.id,`${s.e} ${s.n} : une réponse de machine, froide, là où il fallait de l'empathie`); }
      if(e){ bad=true; lost+=s.grav*15; marks.push(k); }
      t+=tt;
    });
    if(missing.length){ bad=true; lost+=45; if(i===0) missing.forEach(m=>note('miss-'+m,`Il manque une étape indispensable : ${ST[m].e} ${ST[m].n}`)); }
    if(disorder.length){ bad=true; lost+=30; if(i===0) disorder.forEach(b=>note('ord-'+b.id,`${ST[b.id].e} ${ST[b.id].n} arrive trop tôt dans la chaîne`)); }
    if(hasClaim) lost/=2;
    sat=clamp(sat-lost,0,100);
    res.time+=t; res.cost+=c; res.err+=bad?1:0; res.sat+=sat; res.items.push({bad,marks});
  }
  chain.forEach(b=>{ if(ST[b.id]&&ST[b.id].useless) note('use-'+b.id,`${ST[b.id].e} ${ST[b.id].n} : à quoi sert cette boîte ? Elle coûte du temps et de l'argent`); });
  res.time=Math.round(res.time/N*10)/10; res.cost=Math.round(res.cost); res.sat=Math.round(res.sat/N);
  return res;
}

function gFiltre(lv){
  stopGame();
  const L=FLV[lv];
  head('🔀',`L'usine à filtres · ${lv+1}/${FLV.length}`,`${L.e} <b>${L.t}</b>. ${L.story}<br><small>Touche un <b>filtre ❓</b> pour choisir sa question, touche une <b>sortie</b> pour choisir où elle mène, puis lance la machine.</small>`);
  mk('div','hud','<span id="fl-n"></span><span id="fl-s"></span>',main);
  const st=mk('div','stage fst','<svg class="fpipes" id="fl-p"></svg>',main);
  const ctl=mk('div','row c',`<button class="btn ok" id="fl-go">▶ Lancer 12 objets</button>`,main);
  const out=mk('div',null,null,main);
  // structure de l'arbre : positions des filtres et des sorties
  const gates=[], leaves=[];
  (function walk(n,d,par,side){
    if(n.leaf!=null){ const o={ k:leaves.length, d, par, side, bin:null }; leaves.push(o); n.o=o; return; }
    const o={ k:n.g, d, par, side, cond:null, n }; gates[n.g]=o; n.o=o;
    walk(n.yes,d+1,o,'yes'); walk(n.no,d+1,o,'no');
  })(L.tree,0,null,null);
  const depth=Math.max(...leaves.map(l=>l.d));
  leaves.forEach((l,i)=>{ l.x=(i+.5)/leaves.length; l.y=.88; });
  (function px(n){ if(n.leaf!=null) return [n.o.x]; const xs=[...px(n.yes),...px(n.no)]; n.o.x=(Math.min(...xs)+Math.max(...xs))/2; n.o.y=.13+n.o.d*(.62/Math.max(1,depth)); return xs; })(L.tree);
  const S={ W:0, H:0, run:false, items:[], q:[], spawn:0, done:0, ok:0, errs:[], over:false };
  const g={ over:false };
  const condOf=id=>L.conds.find(c=>c[0]===id);
  gates.forEach(o=>{ o.el=mk('button','fgate',null,st); o.el.onclick=()=>{ if(!S.run) pickCond(o); }; });
  leaves.forEach(o=>{ o.el=mk('button','fbin',null,st); o.el.onclick=()=>{ if(!S.run) pickBin(o); }; });
  function paint(){
    gates.forEach(o=>{ const c=condOf(o.cond); o.el.innerHTML=c?esc(c[1]):'❓ Choisir un filtre'; o.el.classList.toggle('empty',!c); });
    leaves.forEach(o=>{ const b=L.bins[o.bin]; o.el.innerHTML=b?`<span>${b[0]}</span>${esc(b[1])}<b class="fc" id="fc${o.k}"></b>`:'❓ Sortie'; o.el.classList.toggle('empty',!b); });
    const ready=gates.every(o=>o.cond)&&leaves.every(o=>o.bin!=null);
    $('#fl-go').disabled=!ready||S.run;
    $('#fl-n').textContent=`Niveau ${lv+1} · objectif ${L.goal===12?'12 / 12':`${L.goal} / 12 au moins`}`;
  }
  function layout(){
    S.W=st.clientWidth; S.H=st.clientHeight;
    const P=o=>[o.x*S.W,o.y*S.H];
    gates.concat(leaves).forEach(o=>{ const [x,y]=P(o); place(o.el,x,y); o.el.style.maxWidth=Math.min(S.W/leaves.length*1.7,220)+'px'; });
    leaves.forEach(o=>{ o.el.style.width=Math.min(S.W/leaves.length-8,170)+'px'; });
    let s=`<line x1="${S.W/2}" y1="0" x2="${gates[0].x*S.W}" y2="${gates[0].y*S.H}" class="pp"/>`;
    gates.concat(leaves).forEach(o=>{ if(!o.par) return; const [x1,y1]=P(o.par), [x2,y2]=P(o);
      s+=`<polyline points="${x1},${y1} ${x2},${y1+(y2-y1)*.35} ${x2},${y2}" class="pp ${o.side}"/>`;
      s+=`<text x="${(x1+x2)/2+(o.side==='yes'?-4:4)}" y="${y1+(y2-y1)*.35-6}" class="pl ${o.side}" text-anchor="${o.side==='yes'?'end':'start'}">${o.side==='yes'?'OUI':'NON'}</text>`; });
    $('#fl-p').setAttribute('viewBox',`0 0 ${S.W} ${S.H}`); $('#fl-p').innerHTML=s;
  }
  function pickCond(o){
    overlay(`<h2>Quelle question pour ce filtre ?</h2><p>Si la réponse est <b style="color:var(--good)">OUI</b>, l'objet part à gauche. Si c'est <b style="color:var(--bad)">NON</b>, à droite.</p><div class="opts">${L.conds.map(c=>`<button class="opt" data-c="${c[0]}">${esc(c[1])}</button>`).join('')}</div>`);
    document.querySelectorAll('#ovc [data-c]').forEach(b=>b.onclick=()=>{ o.cond=b.dataset.c; $('#ov').hidden=true; paint(); });
  }
  function pickBin(o){
    overlay(`<h2>Où mène cette sortie ?</h2><div class="opts">${L.bins.map((b,i)=>`<button class="opt" data-b="${i}">${b[0]} ${esc(b[1])}</button>`).join('')}</div>`);
    document.querySelectorAll('#ovc [data-b]').forEach(b=>b.onclick=()=>{ o.bin=+b.dataset.b; $('#ov').hidden=true; paint(); });
  }
  const tagsOf=p=>Object.entries(L.tags).map(([k,t])=>p[k]?t[0]:t[1]||'').filter(Boolean);
  // le chemin d'un objet : on pose chaque question, OUI à gauche, NON à droite
  function route(p){
    const pts=[[S.W/2,-30]], ans=[], gs=[]; let n=L.tree;
    while(n.leaf==null){ gs.push(n.o); pts.push([n.o.x*S.W,n.o.y*S.H]); const y=!!p[n.o.cond]; ans.push(y); const nx=y?n.yes:n.no; pts.push([nx.o.x*S.W,n.o.y*S.H+(nx.o.y-n.o.y)*S.H*.35]); n=nx; }
    pts.push([n.o.x*S.W,n.o.y*S.H-12]);
    return { pts, ans, gs, leaf:n.o };
  }
  function launch(){
    S.run=true; S.q=shuffle(L.it.slice()).slice(0,12); S.done=0; S.ok=0; S.errs=[]; S.spawn=0; out.innerHTML='';
    leaves.forEach(l=>l.cnt=[0,0]); paint(); layout(); $('#fl-s').textContent='0 ✓ · 0 ✗';
  }
  function spawn(){
    const [e,t,p,good]=S.q.shift();
    const el=mk('div','fit',`<b>${e} ${esc(t)}</b><span>${tagsOf(p).join(' ')}</span>`,st);
    const r=route(p);
    S.items.push({ el, p, good, t, e, r, seg:0, f:0, gi:0 });
  }
  function arrive(o){
    o.el.remove(); S.done++;
    const ok=o.r.leaf.bin===o.good; if(ok) S.ok++; else S.errs.push(o);
    const [x,y]=[o.r.leaf.x*S.W,o.r.leaf.y*S.H];
    floatTxt(st,x,y-40,ok?'✓':'✗ '+L.bins[o.good][0],ok?'var(--good)':'var(--bad)');
    if(!ok) shake(o.r.leaf.el);
    o.r.leaf.cnt[ok?0:1]++; const c=$('#fc'+o.r.leaf.k); if(c) c.textContent=` ${o.r.leaf.cnt[0]}✓${o.r.leaf.cnt[1]?' '+o.r.leaf.cnt[1]+'✗':''}`;
    $('#fl-s').textContent=`${S.ok} ✓ · ${S.done-S.ok} ✗`;
    if(S.done>=12) result();
  }
  function result(){
    S.run=false; paint();
    const win=S.ok>=L.goal, last=lv===FLV.length-1;
    addPts(S.ok*2);
    if(win){ D.best.filtre=Math.max(D.best.filtre||0,lv+1); save(); }
    out.innerHTML='';
    mk('div','card',`<h3 style="margin:0 0 6px">${S.ok} / 12 bien triés ${win?'🎉':''}</h3>
      ${S.errs.length?`<ul class="ferr">${S.errs.map(o=>`<li>${o.e} ${esc(o.t)} → arrivé dans ${L.bins[o.r.leaf.bin].join(' ')}, il fallait ${L.bins[o.good].join(' ')}<br><small>${o.r.ans.map((a,i)=>`${esc(condOf(pathGates(o)[i]).at(1))} ${a?'OUI':'NON'}`).join(' → ')}</small></li>`).join('')}</ul>`:'<p>Aucune erreur : ta machine trie parfaitement.</p>'}
      ${lv===FLV.length-1?`<p><b>Impossible d'avoir 12 / 12 ici.</b> Un compte connu peut être piraté, un site sérieux peut publier une parodie, une info vraie peut venir d'un inconnu. Les filtres ne regardent que des <b>indices</b>, pas le <b>sens</b>. D'où la sortie « à vérifier par un humain ».</p>`:''}
      <div class="row">${win&&!last?`<button class="btn ok" id="fl-nx">Niveau suivant ▶</button>`:''}${win&&last?`<button class="btn ok" id="fl-dd">Noter ma découverte</button>`:''}<button class="btn" id="fl-re">${win?'Rejouer ce niveau':'Modifier mes filtres'}</button></div>`,out).scrollIntoView({behavior:'smooth'});
    if($('#fl-nx')) $('#fl-nx').onclick=()=>gFiltre(lv+1);
    $('#fl-re').onclick=()=>{ out.innerHTML=''; scrollTo(0,0); };
    if($('#fl-dd')) $('#fl-dd').onclick=()=>{ S.over=g.over=true; main.querySelectorAll('.stage,.hud,.row.c').forEach(e=>e.remove()); out.innerHTML='';
      discovery('usine','Comment fonctionne un filtre automatique (anti-spam, modération, tri) ?',[
        'Il pose des questions (oui ou non) et chaque réponse envoie l\'objet sur un chemin différent',
        'Il comprend le sens de chaque message comme un humain',
        'Il ne se trompe jamais une fois réglé'],0,
        'Un filtre, c\'est un <b>algorithme</b> : une suite de tests « si… alors… sinon… » rangés en <b>arbre de décision</b>. L\'ordre des questions compte, et chaque chemin peut avoir ses propres questions. Mais un filtre ne regarde que des indices : pour les cas ambigus, il faut encore un humain.'); };
  }
  const pathGates=o=>o.r.gs.map(x=>x.cond);
  $('#fl-go').onclick=()=>{ if(!S.run) launch(); };
  g.update=dt=>{
    if(S.over) return;
    if(!S.W) layout();
    if(S.run && S.q.length && (S.spawn-=dt)<=0){ spawn(); S.spawn=1.25; }
    const sp=Math.max(120,S.H*.33);
    for(const o of S.items.slice()){
      let mv=sp*dt;
      while(mv>0 && o.seg<o.r.pts.length-1){
        const a=o.r.pts[o.seg], b=o.r.pts[o.seg+1], len=Math.hypot(b[0]-a[0],b[1]-a[1])||1, left=len*(1-o.f);
        if(mv<left){ o.f+=mv/len; mv=0; } else { mv-=left; o.seg++; o.f=0;
          // l'objet vient de passer un filtre : on affiche la réponse
          if(o.seg%2===1 && o.seg<o.r.pts.length-1){ const ans=o.r.ans[(o.seg-1)/2], go=o.r.gs[(o.seg-1)/2]; if(go){ go.el.classList.remove('fy','fn'); void go.el.offsetWidth; go.el.classList.add(ans?'fy':'fn'); } } }
      }
      const a=o.r.pts[o.seg], b=o.r.pts[Math.min(o.seg+1,o.r.pts.length-1)];
      place(o.el,a[0]+(b[0]-a[0])*o.f,a[1]+(b[1]-a[1])*o.f);
      if(o.seg>=o.r.pts.length-1){ S.items.splice(S.items.indexOf(o),1); arrive(o); }
    }
  };
  const onR=()=>{ if(!S.run) layout(); };
  addEventListener('resize',onR);
  g.stop=()=>removeEventListener('resize',onR);
  startGame(g); paint(); layout();
}

    r.items.forEach((it,i)=>setTimeout(()=>{ if(bits[i]){ bits[i].textContent=it.bad?'💥':'✅'; bits[i].classList.add(it.bad?'bad':'ok'); } },120*i+200));
    const g=(k,lab,v,unit,cmp)=>`<div class="ug ${ok[k]?'ok':'ko'}"><span>${lab}</span><b>${v}${unit}</b><small>objectif ${cmp}</small></div>`;
    const notes=Object.values(r.notes).sort((a,b)=>b.n-a.n).slice(0,5);
    const res=mk('div','card',`<h3 style="margin:0 0 6px">${all?'✅ Objectif atteint !':'Résultat de ta chaîne'}</h3>
      <div class="ugs">${g('err','❌ Erreurs',r.err,' / 20','≤ '+G0.err)}${g('time','⏱ Délai',r.time,' s','≤ '+G0.time+' s')}${g('cost','💶 Coût',r.cost,' €','≤ '+G0.cost+' €')}${g('sat','😊 Satisfaction',r.sat,' %','≥ '+G0.sat+' %')}</div>
      ${notes.length?`<ul class="unotes">${notes.map(n=>`<li>${n.t}${n.n>1?` <b>(${n.n} fois)</b>`:''}</li>`).join('')}</ul>`:''}
      ${!all&&runs>=2?`<p class="lead" style="font-size:13px">💡 ${!ok.time||!ok.cost?'Trop lent ou trop cher ? Les humains ne peuvent pas tout faire : confie le répétitif aux machines.':!ok.err?'Trop d\'erreurs ? Une boîte « 🔀 Repérer les cas bizarres » placée tôt peut envoyer l\'imprévu à un humain.':'Clients mécontents ? Là où il faut de l\'empathie, mets un humain.'}${runs>=3?' Et fusionner des boîtes en machine fait gagner du temps et de l\'argent.':''}</p>`:''}
      <div class="row">${all?`<button class="btn ok" id="u-nx">${mi+1<UMIS.length?'Mission suivante ▶':'Le bilan ▶'}</button>`:''}</div>`,out);
    if(all){ addPts(25); $('#u-nx').onclick=()=>{ const h=hist.concat([{M,chain:chain.map(b=>({...b})),r,runs}]); mi+1<UMIS.length?playUsine(mi+1,h):usineEnd(h); }; }
    out.scrollIntoView({behavior:'smooth',block:'start'});
  }
  draw();
}
function usineEnd(hist){
  stopGame();
  head('🏭','L\'usine à tâches : le bilan','');
  D.best.usine=Math.max(D.best.usine||0,hist.length); save();
  const cnt={h:0,r:0,a:0}; hist.forEach(x=>x.chain.forEach(b=>cnt[b.w]++));
  const own=hist.flatMap(x=>x.chain.filter(b=>b.txt).map(b=>b.txt)), machines=[...new Set(hist.flatMap(x=>x.chain.filter(b=>b.m).map(b=>b.me+' '+b.mn)))];
  mk('div','card',`<h3 style="margin:0 0 6px">Tes usines</h3>
    ${hist.map(x=>`<div class="ufin"><b>${x.M.e} ${x.M.t}</b> <small>(${x.runs} essai${x.runs>1?'s':''})</small><div>${x.chain.map(b=>`<span class="uchip">${x.M.steps[b.id]?x.M.steps[b.id].e:'✏️'} ${UW[b.w].e}</span>`).join('<i>→</i>')}</div></div>`).join('')}
    <p>Dans tes chaînes : <b>${cnt.h}</b> boîtes humaines 🙋, <b>${cnt.r}</b> machines à règles ⚙️, <b>${cnt.a}</b> IA 🤖.${machines.length?` Tes machines inventées : ${machines.map(esc).join(', ')}.`:''}${own.length?` Tes boîtes à toi : ${own.map(t=>'« '+esc(t)+' »').join(', ')}.`:''}</p>
    <h3 style="margin:10px 0 6px">Ce qu'on retient</h3>
    <ul><li>On n'automatise pas un métier d'un coup : on le <b>découpe en tâches</b>, puis on choisit qui fait chaque tâche.</li>
    <li>Les machines à règles sont imbattables sur le <b>répétitif sans surprise</b>. L'IA gère une partie de l'imprévu, si elle a beaucoup d'<b>exemples</b>… mais elle se trompe avec assurance.</li>
    <li>Les humains restent indispensables pour les <b>cas bizarres</b>, l'<b>empathie</b> et les décisions graves. Le bon schéma : la machine fait le gros du travail, repère ce qui sort de l'ordinaire, et le passe à un humain.</li>
    <li>L'économiste Daniel Susskind le résume ainsi : les machines prennent des <b>tâches</b>, pas des métiers entiers. Et la frontière bouge : ce qu'elles ne savent pas faire aujourd'hui, elles le feront peut-être demain.</li></ul>
    <div class="row"><button class="btn" id="u-a">Rejouer</button><button class="btn ok" id="u-d">Noter ma découverte</button></div>`,main);
  $('#u-a').onclick=gUsine;
  $('#u-d').onclick=()=>{ $('#u-d').parentNode.remove(); discovery('usine','Comment l\'IA et les machines transforment-elles le travail ?',[
    'Elles prennent des tâches : on découpe le travail, on automatise le répétitif et on garde l\'humain pour l\'imprévu et l\'empathie',
    'Elles remplacent des métiers entiers d\'un seul coup',
    'Elles ne changent rien, les humains font toujours tout'],0,
    'Automatiser, c\'est d\'abord <b>découper un processus en boîtes</b> (entrée → traitement → sortie). Chaque boîte peut être confiée à un humain, à une machine à règles ou à une IA, selon qu\'elle est répétitive, imprévisible ou demande de l\'empathie.'); };
}

/* ---------- menu ---------- */
const GAMES=[
  ['inv','🕰️','Les inventions','Remets chaque famille d\'inventions dans l\'ordre (écrire, électricité, images, sons…), retrouve les familles cachées dans un smartphone, puis construis la grande frise.',gInv],
  ['scribe','✍️','CyberSpeedScribe','Recopie des symboles, en tracé puis en pixels, à toute vitesse… puis recopie tes propres copies. Lesquels s\'abîment ?',gScribe],
  ['feed','📱','Le fil d\'actu','Republier ou pas ? Regarde les émotions se propager et le monde changer.',gFeed],
  ['dopa','🧠','La boucle de dopamine','Fais défiler un fil et regarde ta dopamine en direct : pourquoi est-ce si dur d\'arrêter ?',gDopa],
  ['usine','🔀','L\'usine à filtres','Des filtres OUI / NON envoient chaque objet sur un chemin : spams, modération, colis, fausses infos. Bonus : l\'usine à tâches.',gUsineMenu],
  ['box','⬛','La boîte noire','Des nombres entrent, d\'autres sortent. Trouve la règle cachée et prouve-la.',()=>gBox(0)],
  ['zombie','🧟','Zombies QCM','IA, Google, TikTok… ce que tu crois savoir. Tire sur la bonne réponse, gère tes balles et tes vies !',gZombie],
  ['octo','🐙','La pieuvre laser','Une pieuvre géante attaque ton réseau. Guide les paquets jusqu\'aux tourelles (adresses IPv4) pour lancer des missiles : arbre, étoile, anneau, maillé, sous-réseaux.',gOcto],
  ['bubble','🫧','La bulle','Like ce qui te plaît… et découvre tout ce que l\'algorithme ne t\'a jamais montré.',gBubble],
  ['likes','❤️','Les likes','Publie, gagne des likes, garde ta flamme… et découvre ce qui fait vraiment marcher un post.',gLikes],
  ['reseau','🌐','Le réseau','Rappeuse, acteur, streameuse, médecin, prof… : deux semaines d\'actu étudiante, 100 posts, des émotions qui se propagent. Gagne des abonnés… puis retrouve la réalité.',gReseau],
  ['sel','🎚️','Le sélecteur','Like, règle l\'algorithme et regarde le flux : boucle qui s\'emballe ou contre-réaction ?',gSel]
];
// les épreuves s'ouvrent deux par deux : une paire s'ouvre quand les deux épreuves d'avant sont terminées
// (découverte notée) ; les points varient trop d'une épreuve à l'autre pour servir de seuil. Code prof : tout ouvert.
const prevPair=i=>{ const p=Math.floor(i/2); return p?[GAMES[2*p-2],GAMES[2*p-1]]:[]; };
const isOpen=i=>D.prof||prevPair(i).every(g=>D.disc[g[0]]);
function menu(){
  stopGame();
  main.innerHTML=`<h2>Techno Survivor</h2>${D.prof?'<p class="fb good" style="margin:0 0 8px">🔑 Mode enseignant : toutes les épreuves sont ouvertes.</p>':''}<p class="lead">Douze épreuves pour découvrir comment marche la technologie. À la fin de chacune, note ta découverte : on la reprendra ensemble en cours.</p>
    <div class="games">${GAMES.map(([id,e,t,d],i)=>!isOpen(i)?`<button class="gcard locked" data-i="${i}" aria-disabled="true"><span class="e">${e}</span><span class="t">${i+1} · ${t}</span><span class="d">${d}</span><span class="s lk">🔒 Termine d'abord ${prevPair(i).filter(g=>!D.disc[g[0]]).map(g=>g[1]+' '+g[2]).join(' et ')}</span></button>`:`<button class="gcard${D.disc[id]?' done':''}" data-i="${i}"><span class="e">${e}</span><span class="t">${i+1} · ${t}</span><span class="d">${d}</span><span class="s">${D.disc[id]?'✓ découverte notée':''}${D.best[id]?` · record ${D.best[id].toLocaleString('fr-FR')}`:''}</span></button>`).join('')}</div>
    <div class="row"><button class="btn" id="notes">📒 Mes découvertes</button><button class="btn" id="profb">${D.prof?'🔓 Quitter le mode enseignant':'🔑 Mode enseignant'}</button></div>${SCORM?'<p class="lead" style="font-size:13px">✅ Ta progression et tes découvertes sont enregistrées sur ÉLÉA.</p>':''}`;
  main.querySelectorAll('.gcard').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(isOpen(i)) GAMES[i][4](); else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } });
  $('#notes').onclick=notes; $('#profb').onclick=profMode; scrollTo(0,0);
}
// mode enseignant : ouvre toutes les épreuves, protégé par un mot de passe
function profMode(){
  if(D.prof){ D.prof=false; save(); return menu(); }
  overlay(`<h2>🔑 Mode enseignant</h2><p>Mot de passe :</p><input type="password" id="pw" autocomplete="off" style="width:100%;padding:10px;font-size:16px;border-radius:8px;border:1px solid var(--line);background:var(--deep);color:var(--fg)"><p class="fb" id="pwm"></p><div class="row c"><button class="btn ok" id="pwok">Valider</button><button class="btn" id="pwx">Annuler</button></div>`);
  const ok=()=>{ if($('#pw').value.trim().toUpperCase()==='SNT-PROF'){ D.prof=true; save(); $('#ov').hidden=true; menu(); } else { $('#pwm').className='fb bad'; $('#pwm').textContent='Mot de passe incorrect.'; $('#pw').select(); } };
  $('#pwok').onclick=ok; $('#pw').onkeydown=e=>{ if(e.key==='Enter') ok(); };
  $('#pwx').onclick=()=>{ $('#ov').hidden=true; };
  setTimeout(()=>$('#pw').focus(),50);
}
function notes(){
  stopGame();
  const L=GAMES.map(([id,e,t])=>({e,t,d:D.disc[id]}));
  main.innerHTML=`<h2>📒 Mes découvertes</h2><p class="lead">Recopie-les dans ton cahier, ou copie-les pour ton professeur.</p>
    <ol class="notes">${L.map(({e,t,d})=>`<li><b>${e} ${t}</b><br>${d?`${d.q?`<span class="q">${esc(d.q)}</span><br>`:''}${esc(d.pick||'(pas de réponse)')}${d.txt?`<br>« ${esc(d.txt)} »`:''}`:'<span class="q">Pas encore fait.</span>'}</li>`).join('')}</ol>
    <p>Total : <b>${D.pts} points</b></p><div class="row"><button class="btn ok" id="cpy">Copier le texte</button><button class="btn" id="back">Menu</button><button class="btn" id="rs">Tout effacer</button></div><p class="fb" id="nf"></p>
    <div class="row" style="margin-top:10px"><input id="pc" placeholder="Code prof" style="padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--deep);color:var(--fg);width:150px"><button class="btn" id="pcb">Tout ouvrir</button></div>`;
  $('#pcb').onclick=()=>{ if($('#pc').value.trim().toUpperCase()==='SNT-PROF'){ D.prof=true; save(); $('#nf').className='fb good'; $('#nf').textContent='Toutes les épreuves sont ouvertes.'; } else { $('#nf').className='fb bad'; $('#nf').textContent='Code incorrect.'; } };
  const txt='Mes découvertes (SNT S1)\n\n'+L.map(({e,t,d})=>`${e} ${t}\n${d?`${d.q?d.q+'\n':''}→ ${d.pick||'-'}${d.txt?`\n« ${d.txt} »`:''}`:'(pas fait)'}`).join('\n\n');
  $('#cpy').onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); $('#nf').className='fb good'; $('#nf').textContent='Copié !'; }catch(e){ $('#nf').className='fb bad'; $('#nf').textContent='Copie impossible ici : sélectionne le texte à la main.'; } };
  $('#back').onclick=menu;
  $('#rs').onclick=()=>{ if(confirm('Effacer tes découvertes, records et points ?')){ D={pts:0,best:{},disc:{}}; save(); menu(); } };
}
$('#home').onclick=menu;
save(); menu();
</script>

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>S1 · Techno Survivor</title>
<!-- version affichée : à augmenter à chaque mise à jour -->
<div id="version" style="position:fixed;top:1px;left:50%;transform:translateX(-50%);z-index:99999;font:600 10px/1.4 system-ui,sans-serif;color:#fffc;background:#000a;padding:0 7px;border-radius:0 0 6px 6px;pointer-events:none">v18 · 15/10/2026</div>
<!-- plein écran (si le navigateur ou ÉLÉA l'autorise) -->
<button id="fsbtn" type="button" title="Plein écran" aria-label="Plein écran" style="position:fixed;top:1px;left:calc(50% + 62px);z-index:99999;font:600 10px/1.4 system-ui,sans-serif;color:#fffc;background:#000a;border:0;padding:0 7px;border-radius:0 0 6px 6px;cursor:pointer" hidden>⛶ plein écran</button>
<script>(function(){ var b=document.getElementById('fsbtn'), d=document, e=d.documentElement;
  var on=function(){ return d.fullscreenElement||d.webkitFullscreenElement; };
  if(!(d.fullscreenEnabled||d.webkitFullscreenEnabled)) return;
  b.hidden=false;
  b.onclick=function(){ if(on()) (d.exitFullscreen||d.webkitExitFullscreen).call(d); else (e.requestFullscreen||e.webkitRequestFullscreen).call(e); };
  var up=function(){ b.textContent=on()?'✕ quitter le plein écran':'⛶ plein écran'; };
  d.addEventListener('fullscreenchange',up); d.addEventListener('webkitfullscreenchange',up);
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#110f26;--panel:#1c1940;--deep:#16132f;--line:#3a3468;--fg:#ece8ff;--muted:#9d96cc;--amber:#ffb547;--cyan:#5ce1e6;--pink:#ff6aa8;--good:#6ee7a0;--bad:#ff5a5a;--ink:#1a1300;--blood:#b3001b;
--f-display:'Silkscreen',monospace;--f-mono:'JetBrains Mono',monospace;--f-body:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
#wrap{max-width:960px;margin:0 auto;padding:10px 16px 28px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
header h1{flex:1;margin:0;font:700 clamp(14px,4vw,20px) var(--f-display);color:var(--amber);letter-spacing:.02em}
header .pts{font:700 17px var(--f-mono);color:var(--cyan)}
.iconbtn{min-width:44px;height:44px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font:700 15px var(--f-body)}
h2{margin:0 0 6px;font:700 clamp(18px,4.6vw,26px) var(--f-display);color:var(--cyan);letter-spacing:.02em;text-wrap:balance}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:70ch}
b{color:var(--amber)}
.btn{min-height:46px;padding:0 16px;background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:9px;font:700 15px var(--f-body)}
.btn:active{transform:translateY(2px)}
.btn.ok{background:var(--amber);color:var(--ink);border-color:#c98a24}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.fb{min-height:1.5em;font-weight:700;margin:8px 0}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.hud{display:flex;gap:12px;align-items:center;justify-content:space-between;font:700 14px var(--f-mono);margin-bottom:6px}
.hud .lives{color:var(--bad);font-size:18px;letter-spacing:2px}
/* menu */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:14px 0}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:14px}
.gcard:hover{border-color:var(--amber)}
.gcard .e{grid-row:span 3;font-size:44px;line-height:1}
.gcard .t{font:700 16px var(--f-display);letter-spacing:.02em}
.gcard .d{color:var(--muted);font-size:14px}
.gcard .s{font:700 13px var(--f-mono);color:var(--good)}
.gcard.done{border-color:var(--good)}
.gcard.locked{cursor:not-allowed;opacity:.75}
.gcard.locked .e,.gcard.locked .t,.gcard.locked .d{filter:blur(5px);user-select:none}
.gcard.locked .s.lk{color:var(--amber)}
/* scène commune */
.stage{position:relative;height:min(62vh,540px);min-height:380px;border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:manipulation;-webkit-user-select:none;user-select:none}
body.paused .stage{filter:blur(14px)}
.float{position:absolute;transform:translate(-50%,-50%);font:700 17px var(--f-mono);pointer-events:none;z-index:60;animation:rise 1s forwards;white-space:nowrap;text-shadow:0 2px 4px #000}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
.laser{position:absolute;height:4px;transform-origin:0 50%;border-radius:2px;pointer-events:none;z-index:40;animation:fade .25s forwards}
@keyframes fade{to{opacity:0}}
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(8,6,20,.82)}
.overlay .card{max-width:520px;width:100%;text-align:center}
/* zombies */
.zst{background:linear-gradient(#1b2b22,#2a2216 70%,#3b2a1a)}
.qbar{min-height:58px;margin-bottom:6px;padding:10px 14px;background:var(--deep);border:2px solid var(--amber);border-radius:12px;font:700 clamp(15px,4vw,19px) var(--f-body);text-align:center}
.z{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%);cursor:crosshair;z-index:10}
.z .em{font-size:46px;line-height:1;filter:drop-shadow(0 4px 4px #000a)}
.z .lab{max-width:min(30vw,190px);margin-top:2px;padding:4px 8px;background:#f2ead2;color:#2a1a08;border:2px solid #5a3a1a;border-radius:7px;font:700 13px/1.2 var(--f-body);text-align:center}
.z.angry .em{filter:drop-shadow(0 0 10px red)}
.z.angry .lab{text-decoration:line-through;opacity:.6}
.z.dead{animation:die .5s forwards;pointer-events:none}
@keyframes die{to{transform:translate(-50%,-50%) scale(1.8) rotate(25deg);opacity:0}}
.z.flee{transition:opacity .4s;opacity:0;pointer-events:none}
.z.hit .em{filter:drop-shadow(0 0 8px #d0001f)}
.z .zb{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#d0001f 0 50%,#7a0010 52% 60%,transparent 62%);pointer-events:none}
.z .dt{display:block;margin-top:2px;font:700 12px var(--f-mono);color:#b3001b}
.z .dt:empty{display:none}
.zfr{display:grid;gap:6px;margin-top:8px;min-height:40px}
.zrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.zrow>b{width:100%;font-size:13px;color:var(--amber)}
.zrow>i{color:var(--muted);font-style:normal}
.zc{padding:4px 8px;background:#18382d;border:1px solid var(--good);border-radius:8px;font:700 13px var(--f-body)}
.zc.miss{background:#3a1a24;border-color:var(--bad)}
.zc small{display:block;font:400 11px var(--f-mono);color:var(--muted)}
.zfw{overflow:hidden;margin-top:8px;background:var(--deep);border-radius:10px}
.zfw svg{display:block;width:100%;height:auto}
.zcv{display:block;width:100%;max-width:720px;height:auto;border-radius:10px;touch-action:none;cursor:crosshair}
.zbars{display:grid;gap:4px;margin:8px 0}
.zbars div{display:grid;grid-template-columns:110px 1fr 56px;gap:8px;align-items:center;font-size:13px}
.zbars i{display:block;height:12px;border-radius:6px;min-width:2px;background:var(--good)}
.znums{font:700 14px var(--f-mono);padding:6px 8px;background:var(--deep);border-radius:8px;margin-top:4px;overflow-wrap:anywhere}
.znums small{color:var(--muted);font-weight:400;margin-right:6px}
.dpwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.dpphone{position:relative;background:#0b0a1c;border:3px solid #3a3468;border-radius:26px;padding:16px 12px;max-width:340px;margin:auto}
.dppost{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:#f6f1e2;color:#2a2440;text-align:center;padding:12px;position:relative;overflow:hidden}
.dppost.load{background:#d9d4c4}
.dppost.top{background:linear-gradient(135deg,#ffe08a,#ff9ad0);animation:pop .35s}
.dppost.bof{background:#e6e3da;color:#777}
.dpe{font-size:64px;line-height:1}
.dptx{font:700 17px var(--f-body)}
.dpsp{position:absolute;inset:0;font-size:40px;display:flex;align-items:flex-start;justify-content:flex-end;padding:8px}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.dpnotif{position:absolute;top:-10px;right:-6px;z-index:5;background:var(--bad);color:#fff;border-radius:16px;padding:6px 10px;font:700 15px var(--f-mono);cursor:pointer;box-shadow:0 0 0 4px #ff5a5a55;animation:pop .4s}
.dpgo{min-width:150px;font-size:18px}
.dpbrain{background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px}
.dpbrain svg{display:block;width:100%;height:auto;border-radius:8px}
.dpt{font:700 13px var(--f-body);color:var(--muted);margin-bottom:4px}
.dpg{height:14px;border-radius:7px;background:#2a2550;overflow:hidden}
.dpg i{display:block;height:100%;width:0;background:var(--pink);transition:width .3s}
.dploop{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.dploop span{padding:6px 8px;border:1px solid var(--line);border-radius:8px;font:700 12px var(--f-body);text-align:center;transition:background .2s}
.dploop span.on{background:var(--amber);color:var(--ink)}
.dploop.big span{font-weight:400;font-size:13px}
.dploop span:nth-child(3){order:4} .dploop span:nth-child(4){order:3}
.slwrap{display:grid;grid-template-columns:1fr 1.1fr;gap:12px;align-items:start}
.slflux{height:min(70vh,560px)}
.slit{position:absolute;width:56%;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;padding:8px 10px;background:#f6f1e2;color:#2a2440;border:3px solid;border-radius:12px;cursor:pointer;transition:transform .2s}
.slit span{grid-row:span 2;font-size:26px}
.slit b{font:700 13px var(--f-body);color:#2a2440}
.slit i{font:400 11px var(--f-body);color:#6b6480;font-style:normal}
.slit.liked{transform:scale(.92);background:#ffd6e8}
.slsel{display:grid;gap:8px;background:var(--deep);border:1px solid var(--line);border-radius:12px;padding:10px}
.slsel label{display:grid;font:700 14px var(--f-body)}
.slsel small{font-weight:400;color:var(--muted);font-size:12px}
.slsel input{width:100%;accent-color:var(--amber);height:28px}
.slg{display:grid;grid-template-columns:150px 1fr 48px;gap:8px;align-items:center;margin-top:8px;font-size:13px}
.slhist{display:flex;gap:2px;margin-top:8px;height:14px}
.slhist i{flex:1;border-radius:2px}
.slprof{margin-top:8px;font-size:12px;color:var(--muted)}
.slprof>div{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:center;margin-top:2px}
.slprof .dpg{height:8px}
.slloop{display:grid;gap:6px;margin-top:8px;font-size:13px}
.slloop div{padding:6px 8px;border:1px solid var(--line);border-radius:8px;transition:opacity .3s}
.slbar{display:inline-block;width:80px;height:10px;border-radius:5px;background:#2a2550;vertical-align:middle;overflow:hidden}
.slbar i{display:block;height:100%;background:var(--good)}
.sltc.on{border-color:var(--amber);background:#3a2f1a}
@media (max-width:640px){ .dpwrap,.slwrap{grid-template-columns:1fr} .slflux{height:340px} .slg{grid-template-columns:110px 1fr 44px} .dppost{min-height:170px} }
.z1{position:absolute;transform:translate(-50%,-50%);z-index:10;width:0;height:0}
.z1 .em{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:64px;line-height:1;filter:drop-shadow(0 4px 4px #000a)}
.z1.angry .em{filter:drop-shadow(0 0 12px red)}
.z1.dead{animation:die .5s forwards;pointer-events:none}
.z1.flee{transition:opacity .4s;opacity:0;pointer-events:none}
.zam{font:700 14px var(--f-body);color:#ffe14a;letter-spacing:1px}.zam i{font-style:normal}.zam small{color:var(--muted);letter-spacing:0;font-weight:400}
.zrl{position:absolute;left:8px;bottom:8px;z-index:25;padding:8px 12px;font-size:14px}
.zrl.urge{animation:blink .35s alternate infinite;background:#ffe14a;color:#2a1a08}
.zitem{position:absolute;transform:translate(-50%,-50%);z-index:30;font-size:34px;background:none;border:0;cursor:pointer;filter:drop-shadow(0 0 8px #ffe14a);animation:pop .3s}
.zmode{display:block;margin:8px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;font:13px var(--f-body);cursor:pointer}
.zans{position:absolute;transform:translate(-50%,-50%);width:max-content;padding:7px 10px;background:#f2ead2;color:#2a1a08;border:2px solid #5a3a1a;border-radius:9px;font:700 13px/1.2 var(--f-body);text-align:center;cursor:crosshair;box-shadow:0 3px 0 #5a3a1a}
.zans.no{text-decoration:line-through;opacity:.45;background:#d9b6b6}
.zans.yes{background:var(--good)}
.ivgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:8px 0}
.ivc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;color:var(--fg);min-height:150px}
.linkb{background:none;border:0;padding:0;color:var(--cyan);text-decoration:underline;font:inherit;font-size:.85em;cursor:pointer}
.ivc .pic.ph{width:128px;height:100px;border-radius:10px;overflow:hidden;background:#fff;border:2px solid;padding:0}
.ivc .pic.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ivimg{width:26px;height:26px;border-radius:6px;object-fit:cover;vertical-align:middle;background:#fff}
.ivimg.big{width:90px;height:72px;border-radius:10px}
.ivc .pic{font-size:52px;width:92px;height:92px;display:grid;place-items:center;border-radius:50%}
.ivc b{font-size:14px;text-align:center}
.ivc small{font:700 12px var(--f-mono);color:var(--amber);min-height:1em}
.ivc.done{opacity:.35;border-color:var(--good)}
.ivc.bad{animation:shake .4s;border-color:var(--bad)}
.ivfr{display:grid;gap:6px;margin-top:10px}
.ivrow.pick{cursor:pointer;outline:2px dashed var(--amber);outline-offset:1px}
.ivrow.in{background:#3a2c08;outline:2px solid var(--amber)}
.ivrow.bad{animation:shake .4s;outline-color:var(--bad)}
.ivrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;background:var(--deep);border-radius:10px;min-height:38px}
.ivrow>b{font-size:13px;min-width:150px}
.ivrow>span{display:flex;flex-wrap:wrap;gap:4px}
.ivchip{padding:2px 6px;background:#18382d;border:1px solid var(--good);border-radius:7px;font-size:16px;transition:opacity .2s}
.ivchip.pick{cursor:pointer;outline:2px dashed var(--amber);outline-offset:1px}
.ivchip.in{background:var(--amber);color:var(--ink)} .ivchip.in small{color:var(--ink)}
.ivchip.bad{animation:shake .4s;border-color:var(--bad)}
.ivphone{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;padding:12px;background:var(--deep);border-radius:14px}

.ivphone .parts{display:grid;gap:6px}
.ivphone .pp{padding:4px 10px;border:2px dashed var(--line);border-radius:8px;font:700 14px var(--f-body);min-width:170px}
.ivphone .pp.ok{border-style:solid;border-color:var(--good);background:#18382d}
.ivchip small{font:400 10px var(--f-mono);color:var(--muted)}
.ivfly{position:fixed;z-index:200;font-size:52px;transform:translate(-50%,-50%);transition:left .55s ease-in,top .55s ease-in,transform .55s ease-in;pointer-events:none}
.scbox{max-width:560px;margin-inline:auto}
.sctime{height:10px;border-radius:5px;background:#2a2550;overflow:hidden}
.sctime i{display:block;height:100%;background:var(--amber);width:100%}
.scv{display:block;width:100%;max-width:520px;margin:auto;aspect-ratio:1;touch-action:none;border-radius:12px;cursor:crosshair}
.scrow{margin:8px 0}
.scrow>b{display:block;margin-bottom:4px}
.scev{display:flex;gap:6px;overflow-x:auto}
.scev figure{margin:0;flex:1 1 0;min-width:0;max-width:110px;text-align:center;font-size:11px;color:var(--muted)}
.scev svg{display:block;width:100%;border-radius:8px}
.scev b{color:var(--amber)}
.ugoal{font-size:14px} .ugoal small{display:block;margin-top:4px;color:var(--muted)}
.uwrap{display:grid;grid-template-columns:1fr 1.3fr;gap:10px;align-items:start}
.ubank{display:flex;flex-wrap:wrap;gap:6px}
.ubox{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--deep);color:var(--fg);font:700 13px var(--f-body);text-align:left}
.ubox.used{opacity:.35}
.uchain{display:grid;gap:2px}
.ucell{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--deep)}
.ucell.mach{border:2px solid var(--mc);background:color-mix(in srgb,var(--mc) 12%,var(--deep))}
.umname{font:700 12px var(--f-mono);color:var(--mc);margin-bottom:2px}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}

.unm{flex:1 1 140px;font:700 13px var(--f-body)}
.uw{display:flex;gap:3px}
.uw button,.umv button{min-width:34px;height:34px;padding:0 4px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);font-size:16px}

.umv{display:flex;gap:3px}
.uarr{text-align:center;color:var(--muted);font-size:12px;line-height:1}

.ugs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}

'use strict';
const $=s=>document.querySelector(s), main=$('#main');
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(tag,cls,html,parent){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; parent.appendChild(e); return e; }
function place(e,x,y){ e.style.left=x+'px'; e.style.top=y+'px'; }

/* ---------- sauvegarde : ÉLÉA (SCORM 1.2) si la page y est ouverte, sinon cet appareil ---------- */
const KEY='snt-s1-survivor';
const SCORM=(()=>{
  let api=null;
  try{ let w=window; for(let i=0;i<12 && w;i++){ if(w.API){ api=w.API; break; } if(w===w.parent) break; w=w.parent; } }catch(e){}
  try{ if(!api && window.opener && window.opener.API) api=window.opener.API; }catch(e){}
  if(api){ try{ if(String(api.LMSInitialize(''))!=='true') api=null; }catch(e){ api=null; } }
  return api;
})();
let D={ pts:0, best:{}, disc:{} };
try{ const v=JSON.parse(SCORM ? SCORM.LMSGetValue('cmi.suspend_data') : localStorage.getItem(KEY)); if(v && typeof v==='object') D=Object.assign(D,v); }catch(e){}
// note ÉLÉA : la part des épreuves dont la découverte est notée (100 quand les 12 sont faites)
function save(){
  try{
    if(SCORM){
      // la question n'est pas gardée (elle est dans le jeu) : suspend_data reste petit
      const slim={ pts:D.pts, best:D.best, prof:D.prof, disc:{} };
      for(const k in D.disc){ const d=D.disc[k]; slim.disc[k]={ pick:String(d.pick||'').slice(0,120), got:d.got, ok:d.ok, txt:String(d.txt||'').slice(0,300) }; }
      SCORM.LMSSetValue('cmi.suspend_data',JSON.stringify(slim));
      const n=GAMES.filter(g=>D.disc[g[0]]).length, pct=Math.round(n*100/GAMES.length);
      SCORM.LMSSetValue('cmi.core.score.min','0'); SCORM.LMSSetValue('cmi.core.score.max','100');
      SCORM.LMSSetValue('cmi.core.score.raw',String(pct));
      SCORM.LMSSetValue('cmi.core.lesson_status', n>=GAMES.length ? 'completed' : 'incomplete');
      SCORM.LMSCommit('');
    } else localStorage.setItem(KEY,JSON.stringify(D));
  }catch(e){}
  $('#pts').textContent=D.pts+' pt';
}
addEventListener('pagehide',()=>{ if(SCORM){ try{ save(); SCORM.LMSFinish(''); }catch(e){} } });
// chaque découverte est envoyée à ÉLÉA comme deux « interactions » (le QCM et la phrase de l'élève) :
// l'enseignant les lit dans le rapport des interactions de l'activité SCORM
function sendDisc(id,q,pick,ok,txt){
  if(!SCORM) return;
  try{
    const t=new Date().toTimeString().slice(0,8);
    const add=(suffix,type,resp,result)=>{ const n=+SCORM.LMSGetValue('cmi.interactions._count')||0, k='cmi.interactions.'+n+'.';
      SCORM.LMSSetValue(k+'id',(id+'_'+suffix).replace(/[^\w-]/g,'_'));
      SCORM.LMSSetValue(k+'type',type); SCORM.LMSSetValue(k+'time',t);
      SCORM.LMSSetValue(k+'student_response',String(resp).replace(/[\r\n]+/g,' ').slice(0,250));
      SCORM.LMSSetValue(k+'result',result); };
    if(pick) add('qcm','fill-in',pick,ok?'correct':'wrong');
    if(txt) add('phrase','fill-in',txt,'neutral');
    SCORM.LMSCommit('');
  }catch(e){}
}
function addPts(n,x,y,st){ D.pts+=Math.round(n); save(); if(st && x!=null) floatTxt(st,x,y,'+'+Math.round(n),'var(--good)'); }
function floatTxt(st,x,y,t,c){ const e=mk('div','float',t,st); e.style.color=c||'#fff'; place(e,x,y); setTimeout(()=>e.remove(),1000); }
function laser(st,x1,y1,x2,y2,col){ const e=mk('div','laser',null,st); const dx=x2-x1, dy=y2-y1; e.style.left=x1+'px'; e.style.top=y1+'px'; e.style.width=Math.hypot(dx,dy)+'px'; e.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`; e.style.background=col; e.style.boxShadow=`0 0 10px ${col}`; setTimeout(()=>e.remove(),260); }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- boucle de jeu (s'arrête en pause) ---------- */
const G={ cur:null, pause:false };
let last=0;
function frame(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; if(G.cur && !G.pause && G.cur.update) G.cur.update(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function startGame(g){ stopGame(); G.cur=g; G.pause=false; $('#pausebtn').hidden=!g.update; }
function stopGame(){ if(G.cur && G.cur.stop) G.cur.stop(); G.cur=null; G.pause=false; document.body.classList.remove('paused'); $('#pausebtn').hidden=true; $('#pausebtn').textContent='Pause'; $('#ov').hidden=true; }
function togglePause(){ if(!G.cur || !G.cur.update || G.cur.over) return; G.pause=!G.pause; document.body.classList.toggle('paused',G.pause); $('#pausebtn').textContent=G.pause?'Reprendre':'Pause'; }
$('#pausebtn').onclick=togglePause;
addEventListener('keydown',e=>{ if(e.key==='Escape' && G.cur){ e.preventDefault(); togglePause(); } });
function overlay(html){ $('#ovc').innerHTML=html; $('#ov').hidden=false; }

/* ---------- découverte de fin de jeu ---------- */
function discovery(id,q,opts,goodIdx,explain){
  const box=mk('div','card disc',null,main); const prev=D.disc[id]||{}; let pickI=null;
  box.innerHTML=`<h3>Ta découverte</h3><p>${q}</p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><div class="fb"></div>
    <p class="lead">Avec tes mots, en une phrase :</p><textarea placeholder="J'ai découvert que…">${esc(prev.txt||'')}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn ok" data-ok>Enregistrer et revenir au menu</button></div>`;
  box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    pickI=+b.dataset.i;
    box.querySelectorAll('.opt').forEach((x,i)=>{ x.classList.toggle('right',i===goodIdx); x.classList.toggle('wrong',i===pickI && i!==goodIdx); x.disabled=true; });
    const fb=box.querySelector('.fb'); fb.className='fb '+(pickI===goodIdx?'good':'bad'); fb.innerHTML=(pickI===goodIdx?'Oui ! ':'Pas tout à fait. ')+`<span style="color:var(--fg);font-weight:400">${explain}</span>`;
    if(pickI===goodIdx && !prev.got){ prev.got=1; addPts(20); }
  });
  box.querySelector('[data-ok]').onclick=()=>{ const d={ q, pick:pickI!=null?opts[pickI]:(prev.pick||''), got:prev.got, ok:pickI!=null?pickI===goodIdx:prev.ok, txt:box.querySelector('textarea').value.trim() }; D.disc[id]=d; save(); sendDisc(id,q,pickI!=null?d.pick:'',d.ok,d.txt!==(prev.txt||'')?d.txt:''); menu(); };
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function head(e,t,lead){ main.innerHTML=`<h2>${e} ${t}</h2>${lead?`<p class="lead">${lead}</p>`:''}`; scrollTo(0,0); }
function endCard(title,body,again,disc){
  stopGame();
  overlay(`<h2>${title}</h2><p>${body}</p><div class="row c"><button class="btn ok" id="o-a">Rejouer</button><button class="btn" id="o-d">${disc?'Ma découverte':'Menu'}</button></div>`);
  $('#o-a').onclick=()=>{ $('#ov').hidden=true; again(); };
  $('#o-d').onclick=()=>{ $('#ov').hidden=true; if(disc){ main.querySelectorAll('.stage,.hud,.qbar').forEach(e=>e.remove()); disc(); } else menu(); };
}

function gZombie(cours){
  const BANK=cours?ZQ:ZQC, MAG=5;
  head('🧟','Zombies QCM',(cours?'<b>Révision du cours.</b> ':'')+'Un zombie arrive avec <b>quatre réponses</b> autour de lui. <b>Tire</b> sur la bonne. Chaque tir coûte une balle : <b>recharge</b> à temps ! Un tir raté part à côté… et le zombie accélère. Ramasse les 📦 et les ❤️.');
  mk('div','hud','<span class="lives" id="zl"></span><span id="zam" class="zam"></span><span id="zn"></span>',main);
  const qb=mk('div','qbar',null,main);
  const st=mk('div','stage zst','<div class="barricade"></div><div class="turret">🔫</div>',main);
  const rb=mk('button','btn zrl','🔄 Recharger',st);
  const sw=mk('button','zmode',cours?'↩︎ Version « ce que tu connais »':'📚 Version révision du cours',main);
  sw.onclick=()=>{ stopGame(); gZombie(!cours); };
  const QS=shuffle(BANK.slice()).slice(0,12);
  const S={ n:-1, lives:3, ok:0, miss:0, streak:0, mag:MAG, res:15, rl:0, z:null, wait:0, over:false, W:0, H:0, items:[] };
  const g={ over:false };
  const measure=()=>{ S.W=st.clientWidth; S.H=st.clientHeight; };
  const hudUp=()=>{
    $('#zl').textContent='♥'.repeat(Math.max(0,S.lives))+'♡'.repeat(Math.max(0,3-S.lives));
    $('#zam').innerHTML=(S.rl>0?'<b>recharge…</b>':'<i>'+'▮'.repeat(S.mag)+'</i>'+'▯'.repeat(MAG-S.mag))+` <small>réserve ${S.res}</small>`;
    $('#zn').textContent=`Q ${Math.min(S.n+1,QS.length)}/${QS.length} · ${S.ok} abattus`;
    rb.classList.toggle('urge',S.mag===0&&S.res>0&&S.rl<=0); rb.disabled=S.rl>0||S.mag===MAG||S.res===0;
  };
  function reload(){
    if(S.over||G.pause||S.rl>0||S.mag===MAG||S.res===0) return;
    S.rl=1.1; floatTxt(st,S.W/2,S.H-80,'Rechargement…','#ffe14a'); hudUp();
  }
  rb.addEventListener('pointerdown',ev=>{ ev.preventDefault(); reload(); });
  const SLOT=[[-1,-1],[1,-1],[-1,1],[1,1]];
  function wave(){
    if(S.z) S.z.el.remove(); S.n++;
    if(S.n>=QS.length) return finish();
    const [q,good,bad]=QS[S.n]; qb.textContent=q; hudUp();
    const ans=shuffle([good,...bad.slice(0,3)]);
    const el=mk('div','z1',`<span class="em">🧟</span>${ans.map((a,i)=>`<button class="zans" data-i="${i}">${esc(a)}</button>`).join('')}`,st);
    const z={ el, ans, good, y:80, vy:14+S.n*1.2, ph:0, x:S.W/2, done:false };
    el.querySelectorAll('.zans').forEach(b=>b.addEventListener('pointerdown',ev=>{ ev.preventDefault(); shoot(z,+b.dataset.i,b); }));
    S.z=z; lay(z);
  }
  function lay(z){
    const dx=Math.min(S.W*.27,170), dy=46;
    z.el.querySelectorAll('.zans').forEach((b,i)=>{ b.style.left=(SLOT[i][0]*dx)+'px'; b.style.top=(SLOT[i][1]*dy)+'px'; b.style.maxWidth=Math.min(S.W*.42,200)+'px'; });
  }
  // objets à ramasser : caisse de balles ou cœur
  function drop(kind){
    const e=mk('button','zitem',kind==='ammo'?'📦':'❤️',st);
    const it={ e, kind, t:4.5, x:rand(40,S.W-40), y:rand(S.H*.35,S.H-110) }; place(e,it.x,it.y); S.items.push(it);
    e.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(it.t<=0||G.pause) return; it.t=0; e.remove();
      if(kind==='ammo'){ S.res+=4; floatTxt(st,it.x,it.y-30,'+4 balles','#ffe14a'); } else { S.lives=Math.min(3,S.lives+1); floatTxt(st,it.x,it.y-30,'+1 ♥','#ff8aa8'); }
      hudUp(); });
  }
  function shoot(z,i,b){
    if(S.over||G.pause||z.done||b.classList.contains('no')) return;
    if(S.rl>0) return floatTxt(st,z.x,z.y-70,'Tu recharges !','#ffe14a');
    if(S.mag<=0){ shake(st); return floatTxt(st,z.x,z.y-70,S.res?'Clic… chargeur vide ! Recharge !':'Plus de balles ! Cherche une 📦','#ffe14a'); }
    S.mag--; hudUp();
    const zx=z.x, zy=z.y;
    if(z.ans[i]===z.good){
      z.done=true; S.ok++; S.streak++;
      laser(st,S.W/2,S.H-30,zx,zy,'#6ee7a0'); b.classList.add('yes');
      addPts(10+Math.max(0,Math.round((1-zy/S.H)*10)),zx,zy-50,st);
      const sp=mk('div','splat',null,st); place(sp,zx,zy+10); setTimeout(()=>sp.remove(),1500);
      z.el.classList.add('dead'); S.wait=1;
      if(S.streak%3===0 && S.lives<3) drop('life');
      else if(S.res+S.mag<8 || Math.random()<.35) drop('ammo');
    } else {
      S.miss++; S.streak=0; b.classList.add('no');
      const side=(Math.random()<.5?-1:1)*rand(50,80);
      laser(st,S.W/2,S.H-30,zx+side,zy-20,'#ff5a5a');
      z.vy*=1.45; z.el.classList.add('angry'); floatTxt(st,zx,zy-70,'Raté ! GRRR, il accélère !','#ff5a5a'); shake(st);
    }
    hudUp();
  }
  function bite(){
    const z=S.z; z.done=true; S.lives--; S.streak=0; hudUp(); shake(document.body);
    const b=mk('div','blood',null,st);
    for(let k=0;k<9;k++){ const i=mk('i',null,null,b); const s=rand(60,160); Object.assign(i.style,{width:s+'px',height:s+'px',left:rand(-5,85)+'%',top:rand(-5,70)+'%'}); }
    setTimeout(()=>b.remove(),2300);
    floatTxt(st,S.W/2,S.H/2,'Mordu ! Réponse : '+z.good,'#ffd0d0');
    z.el.classList.add('flee'); S.wait=1.8;
    if(S.mag+S.res<3) drop('ammo');
  }
  function finish(){
    S.over=g.over=true; sw.remove();
    D.best.zombie=Math.max(D.best.zombie||0,S.ok); save();
    const win=S.lives>0;
    endCard(win?'Tu as survécu !':'Dévoré…', (win?`${S.ok} zombies abattus sur ${QS.length}, ${S.miss} tirs ratés. Il te reste ${S.lives} ♥.`:`Les zombies ont franchi la barricade. ${S.ok} abattus avant la fin.`)+(cours?'':'<br>Google, TikTok, ChatGPT… tu les utilises tous les jours. Mais sais-tu vraiment comment ils marchent ?'), ()=>gZombie(cours),
      ()=>discovery('zombie','Les outils que tu utilises tous les jours (Google, TikTok, ChatGPT, Snapchat…) :',
        ['Fonctionnent avec des algorithmes, des données (souvent les tiennes) et des machines bien réelles','Sont magiques : impossible de comprendre comment ils marchent','Sont neutres et gratuits, sans rien en échange'],0,
        'Derrière chaque appli il y a des nombres, des algorithmes qui trient et choisissent, tes données, et des ordinateurs bien physiques. Tout le chapitre va ouvrir le capot !'));
  }
  g.update=dt=>{
    if(S.over) return;
    if(!S.W) measure();
    if(S.rl>0 && (S.rl-=dt)<=0){ const k=Math.min(MAG-S.mag,S.res); S.mag+=k; S.res-=k; hudUp(); }
    for(const it of S.items){ if(it.t>0 && (it.t-=dt)<=0) it.e.remove(); else if(it.t>0 && it.t<1.2) it.e.style.opacity=.4+.6*Math.abs(Math.sin(it.t*12)); }
    S.items=S.items.filter(it=>it.t>0);
    if(S.wait>0){ if((S.wait-=dt)<=0){ if(S.lives<=0) return finish(); wave(); } return; }
    const z=S.z; if(!z||z.done) return;
    z.y+=z.vy*dt; z.ph+=dt*2.5; z.x=S.W/2+Math.sin(z.ph)*Math.min(30,S.W*.05);
    place(z.el,z.x,z.y);
    if(z.y>S.H-130) bite();
  };
  const onR=()=>{ measure(); if(S.z) lay(S.z); };
  addEventListener('resize',onR);
  g.stop=()=>removeEventListener('resize',onR);
  startGame(g); measure(); hudUp(); wave();
}

  fr.innerHTML=FS.map((f,i)=>`<div class="ivrow" data-r="${i}"><b style="color:${f.c}">${f.e} ${f.t}</b><span></span></div>`).join('');
  const hud=()=>{ $('#iv-n').textContent=`Famille ${Math.min(S.r+1,FS.length)} / ${FS.length}`; $('#iv-s').textContent=`✓ ${S.ok} · ✗ ${S.err}`; };
  function round(){
    S.r++; S.next=0;
    if(S.r>=FS.length) return end();
    const f=FS[S.r], items=f.items.slice().sort((a,b)=>a[2]-b[2]);
    qb.innerHTML=`${f.e} <b>${f.t}</b> : clique de la plus ancienne à la plus récente`;
    grid.innerHTML='';
    shuffle(items.map((it,k)=>[it,k])).forEach(([it,k])=>{
      const c=mk('button','ivc',(PH[it[1]]?`<span class="pic ph" style="border-color:${f.c}"><img src="${PH[it[1]]}" alt=""></span>`:`<span class="pic" style="background:radial-gradient(circle at 50% 35%,${f.c}66,${f.c}11 70%)">${it[0]}</span>`)+`<b>${esc(it[1])}</b><small></small>`,grid);
      c.onclick=()=>tap(c,it,k,items);
    });
    hud();
  }
  function tap(c,it,k,items){
    if(c.disabled) return;
    if(k===S.next){
      S.next++; S.ok++; c.disabled=true; addPts(5);
      // la carte rapetisse et vole vers la frise
      const row=fr.querySelector(`.ivrow[data-r="${S.r}"] span`);
      const chip=mk('span','ivchip',`${phI(it)} <small>${fmtY(it[2])}</small>`,row); chip.title=it[1]; chip.dataset.n=it[1];
      const a=c.getBoundingClientRect(), b=chip.getBoundingClientRect();
      const fly=mk('div','ivfly',phI(it,'big'),document.body); Object.assign(fly.style,{left:a.left+a.width/2+'px',top:a.top+a.height/3+'px'});
      chip.style.opacity=0;
      requestAnimationFrame(()=>{ Object.assign(fly.style,{left:b.left+b.width/2+'px',top:b.top+b.height/2+'px',transform:'translate(-50%,-50%) scale(.4)'}); });
      setTimeout(()=>{ fly.remove(); chip.style.opacity=1; },600);
      c.classList.add('done'); c.querySelector('small').textContent=fmtY(it[2]);
      S.got.push(it);
      if(S.next>=items.length){ hud(); setTimeout(round,900); }
      else hud();
    } else {
      S.err++; c.classList.remove('bad'); void c.offsetWidth; c.classList.add('bad');
      c.querySelector('small').textContent=fmtY(it[2]);
      toast(k<S.next?'Celle-là est déjà placée…':'Pas encore : il y a plus ancien !'); hud();
    }
  }
  function end(){
    grid.innerHTML=''; qb.innerHTML='Toutes les familles sont dans l\'ordre !';
    D.best.inv=Math.max(D.best.inv||0,S.ok); save(); addPts(Math.max(5,30-S.err*2));
    phone();
  }
  // le smartphone (2007) réunit presque toutes les familles d'inventions : on clique les familles, pas des inventions précises
  function phone(){
    const PART={ 'Écrire et diffuser':'✍️ écrire, envoyer, le Web', 'Communiquer à distance':'📡 appeler, Internet', 'Calculer':'🧮 un microprocesseur qui calcule', 'Images':'📸 photos et vidéos', 'Sons':'🎧 micro et musique', 'Électricité, piles et batteries':'🔋 une batterie', 'Machines qui « pensent »':'🤖 assistant vocal, IA' };
    const N=Object.keys(PART).length; let found=0;
    qb.innerHTML=`📱 Le smartphone (2007) réunit des inventions de <b>${N} familles</b> sur 8. Clique ces familles dans ta frise !`;
    const ph=mk('div','ivphone',`<div class="scr">📱</div><div class="parts">${Object.keys(PART).map(()=>`<span class="pp">?</span>`).join('')}</div>`,grid);
    fr.querySelectorAll('.ivrow').forEach(r=>{ const f=FS[+r.dataset.r]; r.classList.add('pick'); r.onclick=()=>{
      if(r.classList.contains('in')||ph.classList.contains('done')) return;
      if(PART[f.t]){ r.classList.add('in'); const p=ph.querySelectorAll('.pp')[found++]; p.textContent=PART[f.t]; p.classList.add('ok'); addPts(5);
        if(found===N){ fr.querySelectorAll('.ivrow').forEach(x=>{ x.classList.remove('pick'); x.onclick=null; }); ph.classList.add('done');
          qb.innerHTML=`📱 Un smartphone, c'est ${N} familles d'inventions dans une seule poche ! Seule « Énergie et transport » n'y est pas.`;
          mk('div','row',`<button class="btn ok" id="iv-f">Construire la grande frise ▶</button>`,grid); $('#iv-f').onclick=()=>zFrise(S.got); } }
      else { r.classList.remove('bad'); void r.offsetWidth; r.classList.add('bad'); toast(`${f.e} ${f.t} : pas de moteur ni de roue dans un smartphone !`); }
    }; });
  }
  round();
}

// ---- la grande frise à l'échelle : tout s'entasse à droite, même quand on zoome ----
function zFrise(items){
  stopGame();
  head('📏','La grande frise','Voici toutes tes inventions placées à leur vraie date. Change le zoom : que remarques-tu ?');
  const now=2025, Z=[['Toute l\'histoire',-420000],['10 000 dernières années',now-10000],['1 000 dernières années',now-1000],['500 dernières années',now-500]];
  const c=mk('div','card',`<div class="row" id="zf-z">${Z.map(([t],i)=>`<button class="btn${i?'':' ok'}" data-i="${i}">${t}</button>`).join('')}</div><div class="zfw"><svg id="zf" viewBox="0 0 1000 260" aria-label="Frise chronologique des inventions"></svg></div><p id="zf-n" class="lead" style="margin:6px 0 0"></p>`,main);
  const sorted=[...new Map(items.map(it=>[it[1],it])).values()].sort((a,b)=>a[2]-b[2]);
  let built=0;
  function draw(i){
    const a=Z[i][1], X=y=>40+(y-a)/(now-a)*920;
    const vis=sorted.filter(it=>it[2]>=a).slice(0,built||undefined);
    let s=`<line x1="40" y1="200" x2="960" y2="200" stroke="#9d96cc" stroke-width="3"/>`;
    for(let k=0;k<=4;k++){ const y=Math.round(a+(now-a)*k/4); s+=`<line x1="${X(y)}" y1="194" x2="${X(y)}" y2="206" stroke="#9d96cc"/><text x="${X(y)}" y="228" font-size="15" fill="#9d96cc" text-anchor="middle">${y<-9999?Math.round(y/1000).toLocaleString('fr-FR')+' 000':y}</text>`; }
    const lvl=[]; vis.forEach(it=>{ const x=X(it[2]); let l=0; while(lvl[l]!=null && x-lvl[l]<34) l++; lvl[l]=x; const yy=176-l*30;
      s+=`<line x1="${x}" y1="200" x2="${x}" y2="${yy+6}" stroke="#ffb547" stroke-width="1.5" opacity=".6"/><circle cx="${x}" cy="200" r="5" fill="#ffb547"/>${PH[it[1]]?`<image href="${PH[it[1]]}" x="${x-14}" y="${yy-24}" width="28" height="28" preserveAspectRatio="xMidYMid slice"><title>${esc(it[1])} : ${fmtY(it[2])}</title></image>`:`<text x="${x}" y="${yy}" font-size="22" text-anchor="middle"><title>${esc(it[1])} : ${fmtY(it[2])}</title>${it[0]}</text>`}`; });
    $('#zf').innerHTML=s;
    const all=sorted.filter(it=>it[2]>=a), half=a+(now-a)/2, right=all.filter(it=>it[2]>=half).length;
    $('#zf-n').innerHTML=`${all.length} inventions visibles, dont <b>${right}</b> dans la moitié droite de la frise.`;
    c.querySelectorAll('#zf-z .btn').forEach((b,j)=>b.classList.toggle('ok',j===i));
  }
  c.querySelectorAll('#zf-z .btn').forEach(b=>b.onclick=()=>{ built=0; draw(+b.dataset.i); });
  // la frise se construit invention par invention
  const tm=setInterval(()=>{ if(!document.body.contains(c)){ clearInterval(tm); return; } built++; draw(0); if(built>=sorted.length){ clearInterval(tm); built=0; } },180);
  draw(0);
  const q=mk('div','card',`<h3 style="margin:0 0 6px">Ce que montre la frise</h3><div class="row"><button class="btn ok" id="zf-d">Noter ma découverte</button></div>`,main);
  $('#zf-d').onclick=()=>{ q.remove(); discovery('inv','Que montre la frise des inventions ?',[
    'Les inventions arrivent de plus en plus vite',
    'Les inventions arrivent à un rythme régulier',
    'On invente moins qu\'avant'],0,
    'Sur toute l\'histoire, sur 10 000 ans, sur 1 000 ans et même sur 500 ans, la plupart des points s\'entassent à droite. Chaque invention aide à faire les suivantes, et l\'information circule de plus en plus vite (écriture, imprimerie, télégraphe, Internet).'); };
}

/* =========================================================
   3 · CYBERSPEEDSCRIBE : recopier ses propres copies, à toute vitesse
   ========================================================= */
// symboles tracés (coordonnées 0..100) et symboles en pixel art (8 × 8)
const SCR_L=[
  ['Étoile',()=>{ const p=[]; for(let i=0;i<=10;i++){ const r=i%2?20:44, a=-Math.PI/2+i*Math.PI/5; p.push([50+r*Math.cos(a),52+r*Math.sin(a)]); } return [p]; }],
  ['Spirale',()=>{ const p=[]; for(let i=0;i<=60;i++){ const a=i/60*Math.PI*5, r=4+i*.65; p.push([50+r*Math.cos(a),50+r*Math.sin(a)]); } return [p]; }],
  ['Éclair',()=>[[[58,6],[30,52],[50,52],[38,94],[72,40],[52,40],[66,6]]]],
  ['Cœur',()=>{ const p=[]; for(let i=0;i<=48;i++){ const t=i/48*Math.PI*2; p.push([50+30*Math.pow(Math.sin(t),3),46-(24*Math.cos(t)-10*Math.cos(2*t)-4*Math.cos(3*t)-2*Math.cos(4*t))]); } return [p]; }],
  ['Maison',()=>[[[18,90],[18,46],[50,14],[82,46],[82,90],[18,90]],[[42,90],[42,64],[58,64],[58,90]]]],
  ['Vague',()=>{ const p=[]; for(let i=0;i<=40;i++){ const x=8+i*2.1; p.push([x,50+26*Math.sin(i/40*Math.PI*3)]); } return [p]; }],
  ['Smiley',()=>{ const c=[]; for(let i=0;i<=40;i++){ const a=i/40*Math.PI*2; c.push([50+40*Math.cos(a),50+40*Math.sin(a)]); } const m=[]; for(let i=0;i<=16;i++){ const a=Math.PI*.15+i/16*Math.PI*.7; m.push([50+24*Math.cos(a),50+24*Math.sin(a)]); } return [c,[[36,36],[36,42]],[[64,36],[64,42]],m]; }]
];
const SCR_P=[
  ['Envahisseur','00100100,00011000,00111100,01011010,11111111,10111101,10100101,00011000'],
  ['Cœur pixel','01100110,11111111,11111111,11111111,01111110,00111100,00011000,00000000'],
  ['Fantôme','00111100,01111110,11011011,11111111,11111111,11111111,11011011,10010010'],
  ['Épée','00000011,00000111,00001110,00011100,10111000,01110000,00100000,01010000']
];
function gScribe(){
  stopGame();
  head('✍️','CyberSpeedScribe','Recopie chaque symbole <b>avant la fin du chrono</b>. Attention : quand un symbole revient, le modèle n\'est plus l\'original… c\'est <b>ton dessin d\'avant</b>. Chaque symbole existe <b>en tracé</b> ✏️ et <b>en pixels</b> 🟪 (colorie les cases) : les deux versions alternent.');
  const GEN=4, COL=['#2a2440','#00a8c6','#17a35a','#e08a00','#e0307a'];
  // chaque symbole existe en tracé (analogique) et en pixels (numérique)
  const PIX={ 'Étoile':'00011000,00111100,11111111,01111110,00111100,01111110,11100111,10000001',
    'Cœur':'01100110,11111111,11111111,11111111,01111110,00111100,00011000,00000000',
    'Maison':'00011000,00111100,01111110,11111111,01000010,01011010,01011010,01111110',
    'Smiley':'00111100,01000010,10100101,10000001,10100101,10011001,01000010,00111100',
    'Éclair':'00001110,00011100,00111000,01111110,00001100,00011000,00110000,01100000' };
  const pairs=shuffle(SCR_L.filter(([n])=>PIX[n])).slice(0,2).map(([n,f])=>({ n, a:{n,kind:'l',orig:f(),cur:null,hist:[]}, p:{n,kind:'p',orig:PIX[n].split(',').map(r=>r.split('').map(Number)),cur:null,hist:[]} }));
  const lines=pairs.map(x=>x.a), pg=pairs[0].p, SY=pairs.flatMap(x=>[x.a,x.p]);
  // tracé et pixels alternent : tracé de A, pixels de B, tracé de B, pixels de A…
  const Q=[]; for(let g=0;g<GEN;g++){ const [x,y]=shuffle(pairs.slice()); [x.a,y.p,y.a,x.p].forEach(s=>Q.push([s,g])); }
  mk('div','hud','<span id="sc-n"></span><span id="sc-s"></span>',main);
  const box=mk('div','card scbox',`<div class="sctime"><i id="sc-t"></i></div><div id="sc-q" class="qbar" style="margin:8px 0"></div><svg id="sc" class="scv" viewBox="0 0 100 100"></svg>
    <div class="row" style="margin-top:8px"><button class="btn" id="sc-x">Effacer</button><button class="btn ok" id="sc-v">Valider ▶</button></div>`,main);
  const svg=$('#sc');
  const S={ i:-1, sym:null, gen:0, strokes:[], grid:null, t:0, T:0, over:false, drawing:false, paint:1 };
  const g={ over:false };
  const pathD=strokes=>strokes.map(s=>s.length?'M'+s.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'):'').join(' ');
  function render(){
    const s=S.sym, model=s.cur||s.orig, mc=COL[S.gen];
    let h=`<rect width="100" height="100" fill="#f6f1e2"/>`;
    if(s.kind==='l'){
      h+=`<path d="${pathD(model)}" fill="none" stroke="${mc}" stroke-width="${S.gen?3:2.4}" stroke-linecap="round" stroke-linejoin="round" opacity="${S.gen?.45:.8}"/>`;
      h+=`<path d="${pathD(S.strokes)}" fill="none" stroke="${COL[S.gen+1]}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
    } else {
      for(let r=0;r<8;r++) for(let c=0;c<8;c++){ const x=4+c*11.5, y=4+r*11.5; h+=`<rect x="${x}" y="${y}" width="11" height="11" rx="1" fill="${S.grid[r][c]?COL[S.gen+1]:model[r][c]?mc+'55':'#fff'}" stroke="#ccc" stroke-width=".3"/>`; }
    }
    svg.innerHTML=h;
  }
  function next(){
    S.i++;
    if(S.i>=Q.length) return end();
    const [s,gn]=Q[S.i]; S.sym=s; S.gen=gn; S.strokes=[]; S.grid=[...Array(8)].map(()=>Array(8).fill(0));
    S.T=s.kind==='p'?14:7; S.t=S.T;
    $('#sc-q').innerHTML=`${s.kind==='p'?'🟪':'✏️'} <b>${s.n}</b> · ${gn?`copie n°${gn+1} : repasse <span style="color:${COL[gn]}">ta copie précédente</span>`:'recopie l\'original'}`;
    $('#sc-n').textContent=`Symbole ${S.i+1} / ${Q.length}`;
    render();
  }
  function validate(){
    const s=S.sym;
    if(s.kind==='l'){ const st=S.strokes.filter(x=>x.length>1); s.cur=st; s.hist.push(st); }
    else { s.cur=S.grid.map(r=>r.slice()); s.hist.push(s.cur); }
    addPts(3); next();
  }
  function pt(ev){ const r=svg.getBoundingClientRect(); return [clamp((ev.clientX-r.left)/r.width*100,0,100),clamp((ev.clientY-r.top)/r.height*100,0,100)]; }
  function cell(ev){ const [x,y]=pt(ev), c=Math.floor((x-4)/11.5), r=Math.floor((y-4)/11.5); return r>=0&&r<8&&c>=0&&c<8?[r,c]:null; }
  svg.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(S.over||G.pause) return; svg.setPointerCapture(ev.pointerId); S.drawing=true;
    if(S.sym.kind==='l'){ S.strokes.push([pt(ev)]); }
    else { const k=cell(ev); if(k){ S.paint=S.grid[k[0]][k[1]]?0:1; S.grid[k[0]][k[1]]=S.paint; } }
    render(); });
  svg.addEventListener('pointermove',ev=>{ if(!S.drawing) return;
    if(S.sym.kind==='l'){ const s=S.strokes[S.strokes.length-1], p=pt(ev), l=s[s.length-1]; if(Math.hypot(p[0]-l[0],p[1]-l[1])>.8) s.push(p); }
    else { const k=cell(ev); if(k) S.grid[k[0]][k[1]]=S.paint; }
    render(); });
  const up=()=>{ S.drawing=false; }; svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  $('#sc-x').onclick=()=>{ S.strokes=[]; S.grid=[...Array(8)].map(()=>Array(8).fill(0)); render(); };
  $('#sc-v').onclick=()=>{ if(!S.over) validate(); };
  // écart entre deux tracés : distance moyenne entre les points, dans les deux sens
  function samp(strokes){ const o=[]; strokes.forEach(s=>{ for(let i=1;i<s.length;i++){ const [a,b]=[s[i-1],s[i]], n=Math.max(1,Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])/2)); for(let k=0;k<n;k++) o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n]); } if(s.length===1) o.push(s[0]); }); return o; }
  function gapL(A,B){ const a=samp(A), b=samp(B); if(!b.length) return 100; const md=(P,Qs)=>P.reduce((t,p)=>t+Math.min(...Qs.map(q=>Math.hypot(p[0]-q[0],p[1]-q[1]))),0)/P.length; return Math.min(100,Math.round((md(a,b)+md(b,a))/2*10)/10); }
  const gapP=(A,B)=>{ let d=0; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(A[r][c]!==B[r][c]) d++; return d; };
  function mini(s,m,col){ if(s.kind==='l') return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f6f1e2"/><path d="${pathD(m)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    let h=''; for(let r=0;r<8;r++) for(let c=0;c<8;c++) if(m[r][c]) h+=`<rect x="${4+c*11.5}" y="${4+r*11.5}" width="11" height="11" fill="${col}"/>`; return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#f6f1e2"/>${h}</svg>`; }
  function end(){
    S.over=g.over=true; box.remove();
    const rows=SY.map(s=>{
      const gaps=s.hist.map(h=>s.kind==='l'?gapL(s.orig,h):gapP(s.orig,h));
      return `<div class="scrow"><b>${s.kind==='p'?'🟪':'✏️'} ${s.n}</b><div class="scev"><figure>${mini(s,s.orig,COL[0])}<figcaption>original</figcaption></figure>${s.hist.map((h,i)=>`<figure>${mini(s,h,COL[i+1])}<figcaption>copie ${i+1}<br><b>${s.kind==='l'?gaps[i]+' %':gaps[i]+' case'+(gaps[i]>1?'s':'')}</b></figcaption></figure>`).join('')}</div></div>`;
    }).join('');
    const lg=lines.map(s=>{ const g=s.hist.map(h=>gapL(s.orig,h)); return g[g.length-1]-g[0]; }), grew=lg.filter(x=>x>0).length;
    const cmp=pairs.map(x=>{ const la=gapL(x.a.orig,x.a.hist[x.a.hist.length-1]), lp=gapP(x.p.orig,x.p.hist[x.p.hist.length-1]); return `<li><b>${x.n}</b> : tracé, écart final <b>${la} %</b> · pixels, <b>${lp} case${lp>1?'s':''}</b> fausse${lp>1?'s':''} sur 64</li>`; }).join('');
    const perfect=pairs.filter(x=>gapP(x.p.orig,x.p.hist[x.p.hist.length-1])===0).length;
    D.best.scribe=(D.best.scribe||0)+1; save(); addPts(15);
    mk('div','card',`<h3 style="margin:0 0 6px">L'évolution de tes copies</h3>${rows}
      <h3 style="margin:10px 0 4px">Même symbole, deux façons de le copier</h3><ul>${cmp}</ul>
      <p>${grew>=1?'En tracé, <b>l\'écart avec l\'original grandit</b> de copie en copie : chaque copie ajoute ses erreurs à celles de la précédente, et on ne peut pas savoir exactement où était le trait d\'origine.':'Tu es très précis en tracé ! Mais regarde bien : tes traits s\'éloignent quand même un peu de l\'original.'}
      En pixels, chaque case est <b>pleine ou vide</b> : ${perfect===pairs.length?'tu as recopié tes symboles parfaitement.':'une erreur se voit tout de suite, case par case, et peut se corriger exactement.'}</p>
      <p>Une case pleine ou vide, c'est un <b>1</b> ou un <b>0</b>. Ton dessin en pixels peut s'écrire avec des nombres :</p>
      <div class="znums">${pg.orig.map(r=>r.join('')).join('<br>')}</div>
      <p>Une machine recopie ces nombres <b>sans aucune erreur</b>, autant de fois qu'on veut. C'est toute la force du numérique.</p>
      <div class="row"><button class="btn" id="sc-a">Rejouer</button><button class="btn ok" id="sc-d">Noter ma découverte</button></div>`,main);
    $('#sc-a').onclick=gScribe;
    $('#sc-d').onclick=()=>{ $('#sc-d').parentNode.remove(); discovery('scribe','Pourquoi une copie numérique ne s\'abîme pas, alors qu\'une copie à la main s\'éloigne de l\'original ?',[
      'Parce que le numérique transforme l\'information en nombres, qu\'on recopie à l\'identique',
      'Parce que les ordinateurs dessinent mieux que les humains',
      'Parce qu\'une copie numérique est plus rapide'],0,
      'Le numérique, c\'est d\'abord <b>transformer l\'information en nombres</b> (des 0 et des 1). Un nombre se recopie sans erreur, des milliards de fois : c\'est pour ça qu\'une photo, une musique ou un texte se copient presque gratuitement.'); };
  }
  g.update=dt=>{
    if(S.over||!S.sym) return;
    S.t-=dt; $('#sc-t').style.width=Math.max(0,S.t/S.T*100)+'%'; $('#sc-s').textContent=`⏱ ${Math.max(0,Math.ceil(S.t))} s`;
    if(S.t<=0){ S.drawing=false; validate(); }
  };
  startGame(g); next();
}

/* =========================================================
   2 · LA PIEUVRE : défendre le réseau en livrant les paquets aux tourelles
   ========================================================= */
// chaque niveau = une topologie. Nœuds : qg (ton poste), sw (switch), rt (routeur), tu (tourelle lance-missiles)

function gOcto(){
  head('🐙','La pieuvre laser','Une pieuvre géante attaque ton réseau ! Chaque paquet livré à la bonne <b>tourelle</b> (son adresse IPv4 complète) lance un <b>missile</b>. Quand un paquet est bloqué, des <b>flèches</b> apparaissent sur les câbles : choisis la bonne.');
  playOcto(0,{shield:12,stats:[]});
}
function playOcto(L,carry){
  stopGame();
  const LV=OLV[L];
  main.querySelectorAll('.stage,.hud,.card').forEach(e=>e.remove());
  mk('div','hud',`<span id="oh"></span><span id="osh"></span>`,main);
  const st=mk('div','stage ost ost2','<svg aria-hidden="true"></svg><div class="hpbar"><div style="width:100%"></div></div><div class="olv"></div>',main);
  const info=mk('div','card rtable',null,main);
  const svg=st.querySelector('svg');
  st.querySelector('.olv').innerHTML=`${LV.e} ${L+1}/${OLV.length} · ${LV.t}`;
  // ---- construction du réseau et des adresses IPv4 ----
  const N={}, used=new Set();
  const host=net=>{ let h; do{ h=randi(10,250); }while(used.has(net+'.'+h)); used.add(net+'.'+h); return h; };
  Object.entries(LV.nodes).forEach(([id,[t,x,y,net,sub]])=>{ N[id]={id,t,x,y,nb:[]}; if(net) N[id].net=net; N[id].sub=sub||net||LV.net; });
  const linksA=LV.links.split(' ').map(s=>{ const [a,b]=s.split('-'); const l={a,b,cut:0,line:null}; N[a].nb.push(b); N[b].nb.push(a); return l; });
  const linkOf=(a,b)=>linksA.find(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));
  // dans chaque sous-réseau, toutes les machines partagent les 3 premiers nombres
  const netOf=id=>N[id].sub;
  // une couleur par sous-réseau : la partie « réseau » de chaque adresse est écrite dans cette couleur
  const SUBS=[...new Set(Object.values(N).map(n=>n.sub))], SCOL=['#5ce1e6','#ff6aa8','#ffb547','#6ee7a0'];
  const colOf=net=>LV.subnets?SCOL[SUBS.indexOf(net)%SCOL.length]:'var(--fg)';
  const ipHtml=ip=>{ const k=ip.lastIndexOf('.'); return LV.subnets?`<b style="color:${colOf(ip.slice(0,k))}">${ip.slice(0,k)}</b>${ip.slice(k)}`:ip; };
  Object.values(N).forEach(n=>{
    if(n.t==='tu'||n.t==='qg') n.ip=netOf(n.id)+'.'+host(netOf(n.id));
    if(n.t==='rt') n.ip=n.net+'.1';
  });
  const em={qg:'💻',sw:'🔀',rt:'🗼',tu:'🚀'}, nm={qg:'QG',sw:'Switch',rt:'Routeur',tu:'Tourelle'};
  linksA.forEach(l=>{ l.line=document.createElementNS('http://www.w3.org/2000/svg','line'); l.line.setAttribute('class','link'); svg.appendChild(l.line); });
  Object.values(N).forEach(n=>{
    n.el=mk('div','node onode '+n.t,`<span class="em">${em[n.t]}</span><span class="nm">${n.t==='rt'?'Routeur<br>'+ipHtml(n.net+'.0')+'/24':n.t==='tu'||n.t==='qg'?(n.t==='qg'?'QG ':'')+ipHtml(n.ip):nm[n.t]}</span>`,st);
  });
  // zones colorées des sous-réseaux (derrière les machines)
  const zones=LV.subnets?SUBS.map(net=>({ net, el:mk('div','ozone',`<span>Sous-réseau ${net}.0/24</span>`,st) })):[];
  zones.forEach(z=>{ z.el.style.setProperty('--zc',colOf(z.net)); });
  const octo=mk('div','octo','🐙<span class="eyes"><i></i><i></i></span>',st);
  const S={ W:0,H:0, pk:[], hp:LV.hp, shield:carry.shield, ok:0, lost:0, cutLost:0, spawn:1, laserT:6, rage:0, ox:.5, ph:0, over:false, firing:0, arrows:[], t:0 };
  const g={ over:false };
  const P=id=>({x:N[id].x*S.W,y:N[id].y*S.H});
  function layout(){
    S.W=st.clientWidth; S.H=st.clientHeight;
    Object.values(N).forEach(n=>place(n.el,n.x*S.W,n.y*S.H));
    zones.forEach(z=>{ const M=Object.values(N).filter(n=>n.sub===z.net), xs=M.map(n=>n.x*S.W), ys=M.map(n=>n.y*S.H), pad=40;
      const x0=Math.max(2,Math.min(...xs)-pad), y0=Math.max(2,Math.min(...ys)-pad-10), x1=Math.min(S.W-2,Math.max(...xs)+pad), y1=Math.min(S.H-2,Math.max(...ys)+pad+6);
      Object.assign(z.el.style,{ left:x0+'px', top:y0+'px', width:(x1-x0)+'px', height:(y1-y0)+'px' });
      z.el.querySelector('span').textContent=(x1-x0>230?'Sous-réseau ':'')+z.net+'.0/24'; z.el.classList.toggle('lb',zones.indexOf(z)%2===1); });
    linksA.forEach(l=>{ const a=P(l.a), b=P(l.b); l.line.setAttribute('x1',a.x); l.line.setAttribute('y1',a.y); l.line.setAttribute('x2',b.x); l.line.setAttribute('y2',b.y); });
    showArrows();
  }
  const hudUp=()=>{ $('#oh').textContent=`🚀 missiles : ${S.ok} / ${LV.hp} · 📦 perdus : ${S.lost}`; $('#osh').textContent='🛡️ '+'■'.repeat(Math.max(0,S.shield))+'□'.repeat(Math.max(0,12-S.shield)); st.querySelector('.hpbar div').style.width=(S.hp/LV.hp*100)+'%'; };
  info.innerHTML=`<b style="color:var(--cyan)">${LV.e} Topologie : ${LV.t}</b><br>${LV.intro}`;
  // ---- paquets ----
  function spawn(){
    const T=Object.values(N).filter(n=>n.t==='tu'&&!n.hs);
    let pool=T; if(LV.subnets){ const far=T.filter(n=>netOf(n.id)!==N.Q.sub); if(far.length&&Math.random()<.7) pool=far; }
    if(!pool.length) return;
    const d=pick(pool);
    const el=mk('div','pk',`📦 ${ipHtml(d.ip)}`,st);
    const p={ el, dest:d.ip, at:'Q', prev:null, to:null, t:0, x:P('Q').x, y:P('Q').y, wait:0, born:S.t };
    S.pk.push(p); route(p);
  }
  function opts(p){ return N[p.at].nb.filter(k=>k!==p.prev); }
  function route(p){
    const n=N[p.at];
    if(n.t==='tu'){
      if(n.ip===p.dest){ if(n.hs) return lose(p,'Tourelle en feu : missile impossible',0); return fire(p,n); }
      if(!LV.ring) return lose(p,`Mauvaise tourelle : ${n.ip} ≠ ${p.dest}`,1);
    }
    const o=opts(p);
    if(!o.length) return lose(p,'Cul-de-sac !',1);
    if(o.length===1){ return go(p,o[0]); }
    // bloqué : on attend que le joueur choisisse une flèche
    p.wait=14; p.el.classList.add('wait'); showArrows();
  }
  function go(p,to){ p.from=p.at; p.to=to; p.t=0; p.wait=0; p.el.classList.remove('wait'); }
  function head1(id){ return S.pk.filter(p=>p.at===id&&!p.to&&p.wait>0).sort((a,b)=>a.born-b.born)[0]; }
  function showArrows(){
    S.arrows.forEach(a=>a.remove()); S.arrows=[];
    if(!S.W) return;
    const nodes=[...new Set(S.pk.filter(p=>!p.to&&p.wait>0).map(p=>p.at))];
    nodes.forEach(id=>{
      const p=head1(id); const a=P(id);
      opts(p).forEach(k=>{
        const b=P(k), ang=Math.atan2(b.y-a.y,b.x-a.x), d=Math.min(48,Math.hypot(b.x-a.x,b.y-a.y)*.45);
        const cut=linkOf(id,k).cut>0;
        const el=mk('button','oarr'+(cut?' off':''),'<span>➜</span>',st); el.dataset.n=id; el.dataset.k=k;
        place(el,a.x+Math.cos(ang)*d,a.y+Math.sin(ang)*d); el.querySelector('span').style.transform=`rotate(${ang}rad)`;
        el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); if(G.pause||S.over) return; if(cut){ floatTxt(st,a.x,a.y-40,'Câble coupé !','#ff5a5a'); return; } go(p,k); showArrows(); });
        S.arrows.push(el);
      });
    });
  }
  function fire(p,n){
    kill(p); S.ok++; S.hp--; hudUp(); addPts(10);
    const a=P(n.id), m=mk('div','missile','🚀',st); place(m,a.x,a.y);
    const ox=S.ox*S.W, oy=octoY(); const t0=performance.now();
    const fly=()=>{ const k=Math.min(1,(performance.now()-t0)/700), x=a.x+(ox-a.x)*k, y=a.y+(oy-a.y)*k-Math.sin(k*Math.PI)*60; place(m,x,y); m.style.transform=`translate(-50%,-50%) rotate(${Math.atan2(oy-a.y,ox-a.x)+Math.PI/4}rad)`;
      if(k<1) requestAnimationFrame(fly); else { m.remove(); const b=mk('div','boom','💥',st); place(b,ox,oy); setTimeout(()=>b.remove(),600); S.rage=Math.max(0,S.rage-.3); floatTxt(st,ox,oy+50,'-1 ❤','#ff6aa8'); if(S.hp<=0) win(); } };
    requestAnimationFrame(fly);
  }
  function lose(p,msg,dmg){ S.lost++; if(dmg) S.shield-=dmg; floatTxt(st,clamp(p.x,120,S.W-120),p.y-36,msg,'#ffb3b3'); kill(p); hudUp(); shake(st); if(S.shield<=0) finish(false); }
  function kill(p){ p.el.remove(); const i=S.pk.indexOf(p); if(i>=0) S.pk.splice(i,1); showArrows(); }
  const octoY=()=>S.H*(.09+.13*S.rage);
  function laserAt(x,y){ const ox=S.ox*S.W, oy=octoY(); octo.classList.add('fire'); S.firing=.35; laser(st,ox-8,oy-8,x,y,'#ff2a2a'); laser(st,ox+8,oy-8,x,y,'#ff2a2a'); }
  function attack(){
    const r=Math.random(), center=LV.t==='Étoile'&&Math.random()<.3;
    if(center){ const n=N.X; laserAt(n.x*S.W,n.y*S.H); n.hs=5; n.el.classList.add('hs'); alertMsg('Le centre de l\'étoile est touché !'); S.shield--; hudUp(); return; }
    if(r<.65){ const L2=linksA.filter(l=>!l.cut&&l.a!=='Q'&&l.b!=='Q'); if(!L2.length) return; const l=pick(L2), a=P(l.a), b=P(l.b);
      laserAt((a.x+b.x)/2,(a.y+b.y)/2); l.cut=7; l.line.classList.add('cut');
      // un paquet sur ce câble est grillé
      S.pk.filter(p=>p.to&&linkOf(p.from,p.to)===l).forEach(p=>{ S.cutLost++; lose(p,'Paquet grillé par le laser !',1); });
      showArrows();
    } else { const T=Object.values(N).filter(n=>n.t==='tu'&&!n.hs); if(!T.length) return; const n=pick(T); laserAt(n.x*S.W,n.y*S.H); n.hs=6; n.el.classList.add('hs'); }
  }
  function alertMsg(t){ const a=mk('div','alert',t,st); setTimeout(()=>a.remove(),1400); }
  function win(){
    if(S.over) return; S.over=g.over=true;
    const stats=carry.stats.concat([{t:LV.t,e:LV.e,ok:S.ok,lost:S.lost,cut:S.cutLost,time:Math.round(S.t)}]);
    addPts(20);
    if(L+1<OLV.length){
      overlay(`<h2>${LV.e} ${LV.t} : pieuvre repoussée !</h2><p>${S.lost} paquet${S.lost>1?'s':''} perdu${S.lost>1?'s':''}, dont ${S.cutLost} grillé${S.cutLost>1?'s':''} sur un câble coupé.</p><p>Elle revient… ton réseau change : <b>${OLV[L+1].e} ${OLV[L+1].t}</b>.</p><div class="row c"><button class="btn ok" id="o-n">Niveau suivant ▶</button></div>`);
      $('#o-n').onclick=()=>{ $('#ov').hidden=true; playOcto(L+1,{shield:Math.min(12,S.shield+3),stats}); };
    } else finish(true,stats);
  }
  function finish(won,stats){
    S.over=g.over=true; stats=stats||carry.stats.concat([{t:LV.t,e:LV.e,ok:S.ok,lost:S.lost,cut:S.cutLost,time:Math.round(S.t)}]);
    D.best.octo=Math.max(D.best.octo||0,L+(won?1:0)); save();
    endCard(won?'La pieuvre est vaincue !':'Ton réseau est tombé…', won?`Tes ${OLV.length} réseaux ont tenu bon.`:`La pieuvre a eu ton bouclier au niveau ${L+1} (${LV.t}).`, gOcto, ()=>{
      mk('div','card',`<h3 style="margin:0 0 6px">Tes réseaux face à la pieuvre</h3>
        <div class="otab">${stats.map(s=>`<div><b>${s.e} ${s.t}</b><span>${s.ok} missiles · ${s.lost} perdus · ${s.cut} grillés · ${s.time} s</span></div>`).join('')}</div>
        <ul><li><b>Arbre</b> : un seul chemin vers chaque machine. Un câble coupé isole toute une branche.</li>
        <li><b>Étoile</b> : simple, un seul choix… mais tout dépend du centre.</li>
        <li><b>Anneau</b> : deux sens possibles ; une coupure, et il faut faire le tour par l'autre côté.</li>
        <li><b>Maillé</b> : plusieurs chemins, le réseau résiste aux coupures. <b>Internet est maillé</b> : c'est pour ça qu'il survit aux pannes.</li>
        <li><b>Sous-réseaux</b> : un grand réseau est découpé en petits réseaux (chacun sa couleur ici). Toutes les machines d'un sous-réseau ont le même début d'adresse ; pour en sortir, on passe par un <b>routeur</b>.</li>
        <li><b>Adresse IPv4</b> : 4 nombres de 0 à 255 (ex. 192.168.2.14). Avec /24, les 3 premiers désignent le <b>réseau</b>, le dernier la <b>machine</b>. Les routeurs ne lisent que le réseau, le switch trouve la machine.</li></ul>`,main);
      discovery('octo','Comment un paquet trouve-t-il la bonne machine dans un grand réseau ?',[
        'Il passe par toutes les machines une par une jusqu\'à la trouver',
        'Les routeurs lisent la partie « réseau » de l\'adresse IP, puis le réseau local trouve la machine',
        'Chaque ordinateur connaît le chemin vers toutes les machines du monde'],1,
        'Une adresse IPv4 comme 192.168.2.14 se lit en deux morceaux : <b>192.168.2</b> = le réseau, <b>.14</b> = la machine. Chaque routeur ne connaît que le prochain pas vers un réseau. Et plus il y a de chemins (réseau maillé), mieux le réseau résiste quand un câble est coupé.');
    });
  }
  g.update=dt=>{
    if(S.over) return;
    if(!S.W) layout();
    S.t+=dt; S.ph+=dt*.6; S.ox=.5+Math.sin(S.ph)*.25;
    S.rage+=dt/40; if(S.rage>=1){ S.rage=.35; S.shield-=2; hudUp(); alertMsg('La pieuvre frappe le réseau ! 🛡️ -2'); shake(document.body); if(S.shield<=0) return finish(false); }
    place(octo,S.ox*S.W,octoY());
    if(S.firing>0 && (S.firing-=dt)<=0) octo.classList.remove('fire');
    if((S.laserT-=dt)<=0){ S.laserT=rand(4.5,7)-L*.3; attack(); }
    linksA.forEach(l=>{ if(l.cut>0 && (l.cut-=dt)<=0){ l.cut=0; l.line.classList.remove('cut'); showArrows(); } });
    Object.values(N).forEach(n=>{ if(n.hs>0 && (n.hs-=dt)<=0){ n.hs=0; n.el.classList.remove('hs'); } });
    if((S.spawn-=dt)<=0){ const max=S.ok<2?1:L>=3?3:2; if(S.pk.length<max) spawn(); S.spawn=rand(1.5,3); }
    for(const p of [...S.pk]){
      if(S.over) break;
      if(p.to){
        const l=linkOf(p.from,p.to);
        if(l.cut>0 && p.t===0){ p.el.classList.add('wait'); continue; }   // attend que le câble revienne
        p.el.classList.remove('wait');
        const a=P(p.from), b=P(p.to), d=Math.hypot(b.x-a.x,b.y-a.y)||1;
        p.t+=dt*150/d; const t=Math.min(1,p.t); p.x=a.x+(b.x-a.x)*t; p.y=a.y+(b.y-a.y)*t; place(p.el,p.x,p.y-24);
        if(t>=1){ p.prev=p.from; p.at=p.to; p.to=null; route(p); }
      } else if(p.wait>0){
        // l'étiquette se met du côté d'où vient le paquet, là où il n'y a pas de flèche
        const a=P(p.at); p.x=a.x; p.y=a.y; let ang=-Math.PI/2; if(p.prev){ const b=P(p.prev); ang=Math.atan2(b.y-a.y,b.x-a.x); }
        const lx=clamp(a.x+Math.cos(ang)*84,70,S.W-70), ly=a.y+Math.sin(ang)*58; place(p.el,lx,ly);
        p.wait-=dt; p.el.innerHTML=`📦 ${p.dest}<small>${Math.ceil(p.wait)}s</small>`;
        if(p.wait<=0) lose(p,'Trop tard : paquet perdu',1);
      }
    }
  };
  const onR=()=>layout(); addEventListener('resize',onR);
  g.stop=()=>removeEventListener('resize',onR);
  startGame(g); layout(); hudUp();
}

const BOX=[
  { f:n=>n*2, ok:'Elle double le nombre (× 2)', bad:['Elle ajoute 2','Elle met le nombre au carré','Elle ajoute 10'] },
  { f:n=>n+7, ok:'Elle ajoute 7', bad:['Elle double le nombre','Elle ajoute 5','Elle retire 7'] },

function gBox(lv=0){

      tests.push([n,out]); $('#bh').insertAdjacentHTML('afterbegin',`<tr><td>${n}</td><td>${out}</td></tr>`);

      $('#bi').value=''; sugg();

    phase='hyp';

    $('#bz').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(b.textContent!==B.ok){ b.classList.add('wrong'); b.disabled=true; $('#bf').className='fb bad'; $('#bf').textContent='Cette hypothèse ne colle pas avec tes essais. Refais des essais pour vérifier !'; tests.push(['?','✗']); phase='test'; setTimeout(()=>{ if(phase==='test') $('#bz').innerHTML=''; },1600); return; }
      b.classList.add('right'); proof();
    });
  };
  // preuve : prédire 3 sorties avant de les voir

    $('#bz').innerHTML=`<p style="margin-top:12px">Prouve-le : que va sortir la boîte pour ces nombres ?</p>${ins.map((n,i)=>`<div class="pred"><span>${n} →</span><input data-i="${i}" inputmode="numeric" aria-label="Sortie pour ${n}"></div>`).join('')}<div class="row c"><button class="btn ok" id="bp">Vérifier</button></div>`;

function gBubble(){

  // probabilité d'apparaître : surtout le profil, un tout petit peu d'exploration
  const proba=()=>{ const s=w.reduce((a,b)=>a+b,0); return w.map(v=>.97*v/s+.03/TOP.length); };
  function draw(){
    const p=proba(), idx=TOP.map((_,i)=>i), out=[];
    for(let k=0;k<3;k++){ let s=idx.reduce((a,i)=>a+p[i],0), r=Math.random()*s; let c=idx[0]; for(const i of idx){ r-=p[i]; if(r<=0){ c=i; break; } } out.push(c); idx.splice(idx.indexOf(c),1); }
    return out;
  }

  // boucle de rétroaction : le thème liké et ses voisins montent, le reste baisse
  function like(t){ TOP.forEach((_,i)=>{ const d=ADJ(i,t); w[i]*= d===0?2 : d===1?1.35 : .85; }); norm(); }
  function nope(t){ TOP.forEach((_,i)=>{ const d=ADJ(i,t); w[i]*= d===0?.2 : d===1?.75 : 1.05; }); norm(); }
  function search(t){ TOP.forEach((_,i)=>{ const d=ADJ(i,t); w[i]*= d===0?1.8 : d===1?1.2 : .95; }); norm(); }
  const chance=()=>{ const p=proba()[mission.t]; return Math.round((1-Math.pow(1-p,3))*100); };

/* =========================================================
   8 · LA BOUCLE DE DOPAMINE : la récompense imprévisible entretient l'envie
   ========================================================= */
const DOPA={
  bof:[['📢','Une pub pour des chaussettes'],['🌫️','Une photo floue du ciel'],['🥱','Ton oncle partage la météo'],['📄','Le règlement du CDI'],['🧾','Une pub pour une assurance'],['🪑','Une chaise. Juste une chaise.'],['🚌','Ton bus a 5 min de retard'],['🥦','Recette de brocolis vapeur']],
  bien:[['🐱','Un chat qui tombe du canapé'],['😂','Un mème sur le bac blanc'],['🎵','Le son du moment'],['⚽','Le but de la semaine'],['🛍️','Une pépite en friperie'],['🎮','Un clip de ton jeu préféré']],
  top:[['🔥','Une vidéo INCROYABLE'],['💘','Ton crush a liké ta photo !'],['🏆','Badge rare débloqué !'],['🤯','Le secret du prochain épisode'],['🎟️','Places de concert gagnées !'],['🎓','Parcoursup : un « oui » !']]
};
const DRV={ bof:0, bien:1, top:3 };
function gDopa(){
  head('🧠','La boucle de dopamine','Fais défiler ton fil. À côté, un cerveau simulé montre ta <b>dopamine</b>, la molécule de l\'envie. Observe quand elle monte… et quand elle chute.');
  mk('div','hud','<span id="dp-ph"></span><span id="dp-n"></span>',main);
  mk('div','dpwrap',`<div><div class="dpphone"><div class="dpnotif" id="dp-not" hidden>🔔 <b>3</b></div><div class="dppost" id="dp-post"></div></div>
      <div class="row" style="margin-top:8px"><button class="btn ok dpgo" id="dp-go">Suivant ▶</button><button class="btn" id="dp-stop" hidden>J'arrête</button></div></div>
    <div class="dpbrain"><div class="dpt">🧠 Dopamine</div><svg id="dp-c" viewBox="0 0 300 120" aria-label="Courbe de dopamine"></svg>
      <div class="dpt" style="margin-top:6px">🤤 Envie de continuer</div><div class="dpg"><i id="dp-e"></i></div>
      <div class="dploop" id="dp-loop"><span data-k="0">🔔 Déclencheur</span><span data-k="1">👆 Action</span><span data-k="2">🎁 Récompense</span><span data-k="3">🤤 Envie</span></div>
      <p class="lead" id="dp-m" style="margin:6px 0 0;font-size:13px"></p></div>`,main);
  const z=mk('div',null,null,main);
  // phase 1 : récompense prévisible (bof, bof, SUPER…) ; phase 2 : récompense imprévisible
  const S={ ph:1, n:0, n2:0, V:[0,0,0], V2:0, pts:[], env:.3, busy:false, notT:rand(6,10), nots:0, d1:[], d2:[], over:false, idle:0 };
  const g={ over:false };
  const hud=()=>{ $('#dp-ph').textContent=S.ph===1?'Phase 1 : fil prévisible':'Phase 2 : fil imprévisible'; $('#dp-n').textContent=S.ph===1?`Post ${S.n} / 15`:`${S.n2} posts`; };
  const loop=k=>{ document.querySelectorAll('#dp-loop span').forEach(s=>s.classList.toggle('on',+s.dataset.k===k)); };
  function plot(v,kind){ S.pts.push({v,kind}); if(S.pts.length>36) S.pts.shift(); draw(); }
  function draw(){
    const P=S.pts, x=i=>8+i*(284/35), y=v=>60-clamp(v,-1.6,3)*17;
    let s=`<rect width="300" height="120" fill="#0b0a1c"/><line x1="0" y1="60" x2="300" y2="60" stroke="#3a3468" stroke-dasharray="4 4"/><text x="296" y="56" font-size="9" fill="#9d96cc" text-anchor="end">niveau de base</text>`;
    s+=`<polyline fill="none" stroke="#ffb547" stroke-width="2.5" stroke-linejoin="round" points="${P.map((p,i)=>`${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>`;
    P.forEach((p,i)=>{ if(p.kind) s+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="${p.kind==='cue'?'#5ce1e6':p.v<-.2?'#ff5a5a':'#6ee7a0'}"/>`; });
    $('#dp-c').innerHTML=s;
  }
  const envUp=()=>{ $('#dp-e').style.width=Math.round(clamp(S.env,0,1)*100)+'%'; };
  function show(kind){ const [e,t]=pick(DOPA[kind]); $('#dp-post').innerHTML=`<div class="dpe ${kind}">${e}</div><div class="dptx">${t}</div>${kind==='top'?'<div class="dpsp">✨</div>':''}`; $('#dp-post').className='dppost '+kind; }
  function next(fromNotif){
    if(S.busy||S.over) return; S.busy=true; S.idle=0;
    let kind, exp;
    if(S.ph===1){ const pos=S.n%3; kind=pos===2?'top':'bof'; exp=S.V[pos]; }
    else { const r=Math.random(); kind=fromNotif?(r<.5?'top':'bien'):r<.25?'top':r<.55?'bien':'bof'; exp=S.V2; }
    loop(1);
    // anticipation : la dopamine monte AVANT la récompense quand on l'attend
    plot(0,null); plot(exp*.8,'cue');
    $('#dp-post').className='dppost load'; $('#dp-post').innerHTML='<div class="dpe">⏳</div>';
    setTimeout(()=>{
      if(S.over) return;
      const r=DRV[kind], d=r-exp;
      if(S.ph===1){ const pos=S.n%3; S.V[pos]+=.45*d; S.n++; S.d1.push(d); }
      else { S.V2+=.2*d; S.n2++; S.d2.push(d); }
      show(kind); loop(2); plot(d,'rew'); plot(0,null);
      S.env=clamp(S.env*.82+.15*Math.abs(d)+(d<0?.1:0)+(S.ph===2?.03:0),0,1); envUp();
      const m=d>1.2?'Surprise ! Pic de dopamine.':d<-.3?'Tu attendais mieux : la dopamine chute sous la normale… et tu as envie de réessayer.':Math.abs(d)<.3&&r>0?'Tu savais que ça arrivait : presque plus de pic au moment de la récompense.':S.ph===1&&exp>1.2&&kind==='top'?'La dopamine monte maintenant AVANT le post, dès que tu sais qu\'il arrive.':'Rien de spécial.';
      $('#dp-m').textContent=m;
      setTimeout(()=>loop(3),500);
      S.busy=false; hud();
      if(S.ph===1 && S.n>=15) endPhase1();
      if(S.ph===2 && S.n2>=8) $('#dp-stop').hidden=false;
      if(S.ph===2 && S.n2>=45) finish();
    },550);
  }
  function endPhase1(){
    S.busy=true;
    const last=S.d1.slice(-3).map(Math.abs), avgL=last.reduce((a,b)=>a+b,0)/3, first=Math.abs(S.d1[2]);
    z.innerHTML=''; mk('div','card',`<h3 style="margin:0 0 6px">Fil prévisible : ton cerveau a compris le truc</h3>
      <p>Au début, le super post a fait un pic de dopamine de <b>${first.toFixed(1)}</b>. À la fin, seulement <b>${avgL.toFixed(1)}</b> : comme tu savais qu'un super post arrive tous les 3, ce n'était plus une surprise. La dopamine montait <b>avant</b>, au moment d'appuyer (points bleus), puis plus rien.</p>
      <p>Ton envie de continuer : <b>${Math.round(S.env*100)} %</b>. Prévisible = vite ennuyeux.</p>
      <p><b>Phase 2</b> : maintenant, impossible de deviner ce qui arrive. Fais défiler aussi longtemps que tu veux, et appuie sur « J'arrête » quand tu as envie d'arrêter.</p>
      <div class="row"><button class="btn ok" id="dp-p2">Phase 2 ▶</button></div>`,z);
    $('#dp-p2').onclick=()=>{ z.innerHTML=''; S.ph=2; S.busy=false; S.V2=1; hud(); $('#dp-m').textContent=''; $('#dp-post').className='dppost'; $('#dp-post').innerHTML='<div class="dpe">📱</div><div class="dptx">Appuie sur Suivant</div>'; };
  }
  function finish(){
    if(S.over) return; S.over=g.over=true; $('#dp-go').disabled=true; $('#dp-stop').hidden=true; $('#dp-not').hidden=true;
    const av=a=>a.length?a.reduce((x,y)=>x+Math.abs(y),0)/a.length:0, a1=av(S.d1.slice(-6)), a2=av(S.d2.slice(-10));
    addPts(20); D.best.dopa=Math.max(D.best.dopa||0,S.n2); save();
    z.innerHTML='';
    mk('div','card',`<h3 style="margin:0 0 6px">Ce qui se passait dans ton cerveau</h3>
      <ul><li>Fil prévisible : surprise moyenne à la fin <b>${a1.toFixed(1)}</b>. Fil imprévisible : <b>${a2.toFixed(1)}</b>, ${a2>a1*1.5?'beaucoup plus':'plus'} : le cerveau n'arrive jamais à prévoir, donc il reste en alerte.</li>
      <li>Tu as fait défiler <b>${S.n2} posts</b> dans la phase 2${S.nots?`, et tu as touché <b>${S.nots} notification${S.nots>1?'s':''}</b> 🔔`:''}.</li>
      <li>Après chaque post décevant, la dopamine tombait <b>sous la normale</b> : un petit manque, qui donne envie… du post suivant.</li></ul>
      <div class="dploop big"><span>🔔 <b>Déclencheur</b><br>notification, ennui, pouce sur l'écran</span><span>👆 <b>Action</b><br>faire défiler, ouvrir l'appli</span><span>🎁 <b>Récompense imprévisible</b><br>parfois super, souvent bof</span><span>🤤 <b>Envie</b><br>la dopamine pousse à recommencer</span></div>
      <h3 style="margin:12px 0 6px">Ce que disent les chercheurs</h3>
      <ul><li>Wolfram Schultz (1997) a mesuré les neurones à dopamine de singes : ils s'activent pour une récompense <b>inattendue</b>, puis, une fois qu'elle est prévisible, pour le <b>signal</b> qui l'annonce. Si la récompense attendue ne vient pas, leur activité chute. C'est l'« erreur de prédiction ».</li>
      <li>La dopamine n'est pas la molécule du plaisir mais celle de l'<b>envie</b> et de l'apprentissage : elle pousse à chercher.</li>
      <li>Les récompenses imprévisibles (machines à sous, défilement infini, likes) sont celles qui font le plus recommencer (Skinner, voir l'épreuve des likes).</li>
      <li>Nuance : parler d'« addiction » aux écrans fait débat. L'effet moyen des écrans sur le bien-être des ados mesuré par les études est faible (Orben et Przybylski, 2019) ; tout dépend de l'usage.</li></ul>
      <p><b>Casser la boucle</b> : couper le déclencheur (notifications), rendre l'action moins facile (se déconnecter, appli hors de l'écran d'accueil), mettre une fin (minuteur, pas de défilement infini).</p>
      <div class="row"><button class="btn ok" id="dp-d">Noter ma découverte</button></div>`,z);
    $('#dp-d').onclick=()=>{ $('#dp-d').parentNode.remove(); discovery('dopa','Pourquoi a-t-on du mal à arrêter de faire défiler un fil ?',[
      'Parce que les récompenses imprévisibles entretiennent l\'envie : la dopamine pousse à chercher la prochaine',
      'Parce que chaque post fait toujours autant plaisir',
      'Parce que le téléphone nous empêche physiquement d\'arrêter'],0,
      'La dopamine réagit à la <b>surprise</b> : quand on ne peut pas prévoir si le prochain post sera super, chaque post décevant crée un petit manque et chaque bon post un pic. Déclencheur → action → récompense imprévisible → envie : c\'est une boucle.'); };
  }
  $('#dp-go').onclick=()=>next(false);
  $('#dp-stop').onclick=finish;
  $('#dp-not').onclick=()=>{ $('#dp-not').hidden=true; S.nots++; loop(0); setTimeout(()=>next(true),250); };
  g.update=dt=>{
    if(S.over) return;
    S.idle+=dt; S.env=Math.max(0,S.env-dt*.02); envUp();
    // phase 2 : une notification arrive quand on ralentit
    if(S.ph===2 && !S.busy && $('#dp-not').hidden && (S.notT-=dt)<=0){ $('#dp-not').hidden=false; $('#dp-not b').textContent=randi(1,9); loop(0); S.notT=rand(5,11); }
  };
  startGame(g); hud(); draw(); envUp(); show('bof'); $('#dp-post').innerHTML='<div class="dpe">📱</div><div class="dptx">Appuie sur Suivant pour faire défiler</div>';
}

      <div class="slhist" id="sl-h"></div>
      <div class="slprof" id="sl-p"></div>

    </div>`,main);
  const z=mk('div',null,null,main);
  const S={ prof:TH.map(()=>1), it:[], hist:[], likes:0, t:0, spawn:0, m:0, hold:0, fav:null, favL:0, mt:0, over:false, log:[], ser:[], st:0 };
  // courbes : part de chaque thème, ressemblance et diversité, sur les 40 dernières secondes

    TH.forEach((t,k)=>{ if(!P.length) return; s+=`<polyline fill="none" stroke="${t[2]}" stroke-width="${MY.includes(k)?2.6:1.6}" stroke-linejoin="round" ${MY.includes(k)?'':'stroke-dasharray="3 2"'} points="${P.map((p,i)=>`${x(i).toFixed(1)},${y1(p.sh[k]).toFixed(1)}`).join(' ')}"/>`; });
    if(P.length){ const L=P[P.length-1], i=P.length-1;

        // la contre-réaction en action : flèche qui pousse vers le bas

      P.forEach((p,i)=>{ if(p.ev) u+=`<line x1="${x(i)}" x2="${x(i)}" y1="2" y2="78" stroke="#fff" opacity=".35"/><text x="${x(i)+2}" y="10" font-size="9" fill="#ddd">${p.ev}</text>`; });

  }
  let pendEv='';
  [['#sl-r','🔁'],['#sl-d','🎲'],['#sl-a','🧯']].forEach(([id,e])=>$(id).addEventListener('change',()=>{ pendEv=e; }));
  const g={ over:false };

  const flux=$('#sl-f');
  const share=k=>S.hist.length?S.hist.filter(x=>x===k).length/S.hist.length:0;
  function weights(){
    const r=val('#sl-r'), d=val('#sl-d'), a=val('#sl-a'), gam=.3+4*r;
    let w=S.prof.map(p=>Math.pow(p,gam)); const sw=w.reduce((x,y)=>x+y,0); w=w.map(x=>x/sw);
    w=w.map((x,k)=>((1-d)*x+d/6)*Math.exp(-5*a*Math.max(0,share(k)-.22)));
    const s2=w.reduce((x,y)=>x+y,0); return w.map(x=>x/s2);
  }
  function spawn(){
    const w=weights(); let r=Math.random(), k=0; while(k<5 && (r-=w[k])>0) k++;
    const el=mk('div','slit',`<span>${TH[k][0]}</span><b>${pick(THT[k])}</b><i>${TH[k][1]}</i>`,flux);
    el.style.borderColor=TH[k][2];
    const o={ el, k, y:-50, x:rand(4,40) };
    el.style.left=o.x+'%';
    el.addEventListener('pointerdown',ev=>{ ev.preventDefault(); like(o); });
    S.it.push(o); S.hist.push(k); if(S.hist.length>30) S.hist.shift();
  }
  function like(o){
    if(o.liked||S.over) return; o.liked=1; S.likes++; o.el.classList.add('liked');
    const r=val('#sl-r'); S.prof[o.k]+=.25+.9*r;
    if(S.ms===1 && o.k===S.fav) S.favL++;
    const h=mk('div','rsheart','❤️',flux); h.style.left=(o.x+10)+'%'; h.style.top=o.y+'px'; setTimeout(()=>h.remove(),1200);

  function gauges(){

    addPts(15);
    if(S.ms===0){ // le thème que l'algorithme a le plus oublié
      const c=TH.map((_,k)=>k).filter(k=>!MY.includes(k)).sort((a,b)=>S.prof[a]-S.prof[b]); S.fav=c[0]; S.favL=0;

    } else if(S.ms===1) toast('✓ Retrouvé !');

name: photos des inventions
on:
  push:
    paths: ['tools/photos.py', '.github/workflows/photos.yml']
permissions:
  contents: write
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/photos.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add S1_enquete_techno/photos
          git commit -m "Photos des inventions (Wikimedia Commons)" || true
          git push

<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Brain Exploration</title>
<!-- version affichée : à augmenter à chaque mise à jour -->
<div id="version" style="position:fixed;top:1px;left:50%;transform:translateX(-50%);z-index:99999;font:600 10px/1.4 system-ui,sans-serif;color:#fffc;background:#000a;padding:0 7px;border-radius:0 0 6px 6px;pointer-events:none">v2 · 13/11/2026</div>
<!-- plein écran (si le navigateur ou ÉLÉA l'autorise) -->
<button id="fsbtn" type="button" title="Plein écran" aria-label="Plein écran" style="position:fixed;top:1px;left:calc(50% + 58px);z-index:99999;font:600 10px/1.4 system-ui,sans-serif;color:#fffc;background:#000a;border:0;padding:0 7px;border-radius:0 0 6px 6px;cursor:pointer" hidden>⛶ plein écran</button>
<script>(function(){ var b=document.getElementById('fsbtn'), d=document, e=d.documentElement;
  var on=function(){ return d.fullscreenElement||d.webkitFullscreenElement; };
  if(!(d.fullscreenEnabled||d.webkitFullscreenEnabled)) return;
  b.hidden=false;
  b.onclick=function(){ if(on()) (d.exitFullscreen||d.webkitExitFullscreen).call(d); else (e.requestFullscreen||e.webkitRequestFullscreen).call(e); };
  var up=function(){ b.textContent=on()?'✕ quitter le plein écran':'⛶ plein écran'; };
  d.addEventListener('fullscreenchange',up); d.addEventListener('webkitfullscreenchange',up);
})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1426;--panel:#1a2142;--deep:#131a33;--line:#344072;--fg:#e9edff;--muted:#98a2cf;--amber:#ffb547;--cyan:#5ce1e6;--pink:#ff6aa8;--violet:#b18cff;--good:#6ee7a0;--bad:#ff5a5a;--ink:#1a1300;
--f-display:'Silkscreen',monospace;--f-mono:'JetBrains Mono',monospace;--f-body:'Atkinson Hyperlegible',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 var(--f-body)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
[hidden]{display:none!important}
#wrap{max-width:960px;margin:0 auto;padding:10px 16px 28px}
header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
header h1{flex:1;margin:0;font:700 clamp(14px,4vw,20px) var(--f-display);color:var(--violet);letter-spacing:.02em}
header .pts{font:700 17px var(--f-mono);color:var(--cyan)}
.iconbtn{min-width:44px;height:44px;padding:0 10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;font:700 15px var(--f-body)}
h2{margin:0 0 6px;font:700 clamp(18px,4.6vw,26px) var(--f-display);color:var(--cyan);letter-spacing:.02em;text-wrap:balance}
h3{margin:0 0 6px;font:700 15px var(--f-display);color:var(--cyan)}
p{margin:0 0 10px}
.lead{color:var(--muted);max-width:70ch}
b{color:var(--amber)}
.btn{min-height:46px;padding:0 16px;background:var(--panel);border:1px solid var(--line);border-bottom-width:3px;border-radius:9px;font:700 15px var(--f-body)}
.btn:active{transform:translateY(2px)}
.btn.ok{background:var(--amber);color:var(--ink);border-color:#c98a24}
.btn:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.c{justify-content:center}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:10px}
.fb{min-height:1.5em;font-weight:700;margin:8px 0}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)} .fb.info{color:var(--cyan)}
.fb span{color:var(--fg);font-weight:400}
.hud{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font:700 14px var(--f-mono);margin-bottom:6px}
/* menu */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px;margin:14px 0}
.pairh{grid-column:1/-1;margin:6px 0 -4px;font:700 13px var(--f-display);color:var(--violet);letter-spacing:.04em}
.gcard{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;text-align:left;background:var(--panel);border:1px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:14px}
.gcard:hover{border-color:var(--amber)}
.gcard .e{grid-row:span 3;font-size:44px;line-height:1}
.gcard .t{font:700 16px var(--f-display);letter-spacing:.02em}
.gcard .d{color:var(--muted);font-size:14px}
.gcard .s{font:700 13px var(--f-mono);color:var(--good)}
.gcard .s.wip{color:var(--amber)}
.gcard.done{border-color:var(--good)}
.gcard.locked{cursor:not-allowed;opacity:.75}
.gcard.locked .e,.gcard.locked .t,.gcard.locked .d{filter:blur(5px);user-select:none}
.gcard.locked .s.lk{color:var(--amber)}
.gcard.final{border-color:var(--violet)}
/* scène commune */
.stage{position:relative;height:min(62vh,540px);min-height:400px;border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:manipulation;-webkit-user-select:none;user-select:none}
body.paused .stage{filter:blur(14px)}
.float{position:absolute;transform:translate(-50%,-50%);font:700 17px var(--f-mono);pointer-events:none;z-index:60;animation:rise 1s forwards;white-space:nowrap;text-shadow:0 2px 4px #000}
@keyframes rise{to{transform:translate(-50%,-160%);opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,3px)}80%{transform:translate(4px,-2px)}}
@keyframes pop{from{transform:scale(.8);opacity:.3}to{transform:scale(1);opacity:1}}
@keyframes blink{to{opacity:.35}}
.overlay{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:16px;background:rgba(6,8,20,.84);overflow:auto}
.overlay .card{max-width:540px;width:100%;text-align:center}
/* découverte */
.opts{display:grid;gap:8px;margin:10px 0}
.opt{text-align:left;min-height:48px;padding:10px 14px;background:var(--deep);border:1px solid var(--line);border-radius:10px;font-weight:700}
.opt.right{border-color:var(--good);background:#16382c}
.opt.wrong{border-color:var(--bad);background:#3a1a24}
.opt.sel{border-color:var(--cyan);background:#163040}
textarea{width:100%;min-height:60px;padding:10px;background:var(--deep);color:var(--fg);border:1px solid var(--line);border-radius:10px;font:15px var(--f-body);resize:vertical}
.disc{margin-top:16px;border-color:var(--cyan)}
.steps{display:flex;gap:6px;margin:0 0 10px}
.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps i.on{background:var(--cyan)} .steps i.done{background:var(--good)}
.reassure{padding:8px 12px;border-left:4px solid var(--violet);background:#1f1d44;border-radius:0 8px 8px 0;font-size:14px;color:var(--fg)}
.scene{padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,#3a2614,#1e3a2a);font-size:15px}
.scene .big{font-size:44px;line-height:1.1;letter-spacing:4px;margin-bottom:6px}
.power{display:inline-block;padding:4px 10px;border-radius:20px;background:var(--violet);color:#160b33;font:700 14px var(--f-body);margin-bottom:6px}
.case{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--deep);margin:8px 0}
.case .opts{grid-template-columns:repeat(3,1fr)}
.case .opt{text-align:center;padding:8px}
.tag{display:inline-block;font:700 12px var(--f-mono);padding:1px 6px;border-radius:6px;background:var(--line);color:var(--fg)}
.notes li{margin-bottom:12px}
.notes .q{color:var(--muted);font-size:14px}
.wipbox{text-align:center;padding:30px 16px}
.wipbox .e{font-size:72px}
/* 1 · homéostasie */
.hst{background:linear-gradient(#24365a,#1a2a3f 55%,#2b2a1c)}
.hst.hot{background:linear-gradient(#7a3412,#4a2a18 55%,#3a2a12)}
.hst.cold{background:linear-gradient(#3a6a96,#22405e 55%,#2a3646)}
.hst.auto{background:linear-gradient(#1e2a4a,#151d33 55%,#20201a)}
.hav{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);font-size:72px;line-height:1;transition:filter .3s;filter:drop-shadow(0 6px 6px #0008)}
.hav.bad{filter:drop-shadow(0 0 14px #ff3b3b)}
.hlife{position:absolute;left:12px;right:12px;top:10px;height:12px;border-radius:6px;background:#0008;overflow:hidden}
.hlife i{display:block;height:100%;background:var(--good);transition:width .2s}
.hev{position:absolute;left:50%;top:48px;transform:translateX(-50%);max-width:92%;padding:6px 12px;border-radius:10px;background:#000a;font:700 15px var(--f-body);text-align:center;z-index:20;animation:pop .3s}
.hev.warn{background:#5a3a00e6;border:2px solid var(--amber);animation:blink .5s alternate infinite}
.hgs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#0007}
.hg{display:grid;justify-items:center;gap:4px}
.hg .lb{font:700 12px var(--f-body);text-align:center;line-height:1.1}
.hg .lb span{font-size:22px;display:block}
.hbar{position:relative;width:34px;height:110px;border-radius:8px;background:#0009;border:1px solid #fff3;overflow:hidden}
.hbar .zone{position:absolute;left:0;right:0;bottom:35%;height:30%;background:#6ee7a033;border-top:1px dashed #6ee7a0;border-bottom:1px dashed #6ee7a0}
.hbar .lvl{position:absolute;left:4px;right:4px;bottom:0;border-radius:5px 5px 0 0;background:var(--cyan);transition:background .2s}
.hbar.danger .lvl{background:var(--bad)}
.hbar.danger{animation:blink .4s alternate infinite}
.hbt{display:flex;gap:4px}
.hbt button{width:40px;height:40px;border-radius:9px;border:1px solid var(--line);background:var(--panel);font:700 20px var(--f-mono)}
.hbt button:active{background:var(--amber);color:var(--ink)}
.hauto{font:700 11px var(--f-mono);color:var(--good);height:40px;display:grid;place-items:center;text-align:center}
.hz{position:absolute;transform:translate(-50%,-50%);font-size:46px;background:none;border:0;padding:0;z-index:15;animation:pop .25s;filter:drop-shadow(0 4px 4px #000a)}
.hn{position:absolute;transform:translate(-50%,-50%);z-index:16;padding:6px 10px;border-radius:12px;background:#f4f4f8;color:#222;border:0;font:700 13px var(--f-body);box-shadow:0 4px 10px #0008;animation:pop .2s;max-width:180px;text-align:left}
.hn small{display:block;font-weight:400;color:#666;font-size:11px}
.hcurve{width:100%;height:auto;display:block;background:var(--deep);border-radius:10px;margin:8px 0}
/* 2 · hallucination */
.fst{display:grid;place-items:center;transition:background .6s}
.fst.calm{background:radial-gradient(circle at 50% 40%,#5b8a4a,#2e4a26 70%)}
.fst.alert{background:radial-gradient(circle at 50% 40%,#3a1a1a,#120808 75%)}
.fimg{width:min(64vw,260px);height:min(64vw,260px);display:grid;place-items:center;border-radius:14px;overflow:hidden;position:relative}
.fimg svg{width:100%;height:100%}
.fmask{position:absolute;inset:0;background:repeating-conic-gradient(#555 0 25%,#999 0 50%) 0 0/12px 12px}
.fban{position:absolute;top:10px;left:10px;right:10px;padding:6px 10px;border-radius:10px;font:700 14px var(--f-body);text-align:center;background:#0008}
.fst.alert .fban{background:#7a0010d9;border:2px solid #ff5a5a;animation:blink .6s alternate infinite}
.fbtns{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:12px}
.fbtns .btn{min-width:130px;font-size:17px}
.fcount{position:absolute;right:12px;bottom:70px;font:700 13px var(--f-mono);color:#fffc}
.scram{font:18px/1.6 var(--f-body);padding:14px;background:#f6f1e2;color:#2a2440;border-radius:12px}
.bspot{position:relative;max-width:440px;height:150px;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(90deg,#f2d23c 0 10px,#2a6fd6 10px 20px)}
.bspot .x{position:absolute;left:12%;top:50%;transform:translate(-50%,-50%);font:700 34px var(--f-mono);color:#000;background:#fff;border-radius:6px;padding:0 6px}
.bspot .dot{position:absolute;left:78%;top:50%;width:30px;height:30px;border-radius:50%;background:#e01020;transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff}
.probs{display:grid;gap:4px;margin:8px 0}
.probs div{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.probs i{display:block;height:12px;border-radius:6px;background:var(--violet)}
.word{display:inline-block;min-width:90px;border-bottom:3px solid var(--amber);text-align:center;color:var(--amber);font-weight:700}
@media (max-width:520px){ .hbar{height:84px;width:28px} .hbt button{width:34px;height:36px;font-size:17px} .hav{font-size:58px} .case .opts{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){ .hev.warn,.hbar.danger,.fst.alert .fban{animation:none!important} }
</style>

<div id="wrap">
  <header><button class="iconbtn" id="home" aria-label="Retour au menu">☰</button><h1>Brain Exploration</h1><button class="iconbtn" id="pausebtn" hidden>Pause</button><span class="pts" id="pts">0 pt</span></header>
  <main id="main"></main>
</div>
<div class="overlay" id="ov" hidden><div class="card" id="ovc"></div></div>

<script>
'use strict';
const $=s=>document.querySelector(s), main=$('#main');
const rand=(a,b)=>a+Math.random()*(b-a), randi=(a,b)=>Math.floor(rand(a,b+1)), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mk(tag,cls,html,parent){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; parent.appendChild(e); return e; }
function place(e,x,y){ e.style.left=x+'px'; e.style.top=y+'px'; }

/* ---------- sauvegarde : ÉLÉA (SCORM 1.2) si la page y est ouverte, sinon cet appareil ---------- */
const KEY='snt-brain-exploration';
const SCORM=(()=>{
  let api=null;
  try{ let w=window; for(let i=0;i<12 && w;i++){ if(w.API){ api=w.API; break; } if(w===w.parent) break; w=w.parent; } }catch(e){}
  try{ if(!api && window.opener && window.opener.API) api=window.opener.API; }catch(e){}
  if(api){ try{ if(String(api.LMSInitialize(''))!=='true') api=null; }catch(e){ api=null; } }
  return api;
})();
let D={ pts:0, best:{}, disc:{} };
try{ const v=JSON.parse(SCORM ? SCORM.LMSGetValue('cmi.suspend_data') : localStorage.getItem(KEY)); if(v && typeof v==='object') D=Object.assign(D,v); }catch(e){}
// note ÉLÉA : la part des jeux dont la découverte est notée (100 quand les 12 sont faites)
function save(){
  try{
    if(SCORM){
      // suspend_data est limité (4096 caractères en SCORM 1.2) : on raccourcit les textes
      const slim={ pts:D.pts, best:D.best, prof:D.prof, disc:{} };
      for(const k in D.disc){ const d=D.disc[k]; slim.disc[k]={ ok:d.ok, got:d.got, txt:String(d.txt||'').slice(0,200), help:String(d.help||'').slice(0,80), trap:String(d.trap||'').slice(0,80) }; }
      SCORM.LMSSetValue('cmi.suspend_data',JSON.stringify(slim));
      const n=GAMES.filter(g=>D.disc[g.id]).length, pct=Math.round(n*100/GAMES.length);
      SCORM.LMSSetValue('cmi.core.score.min','0'); SCORM.LMSSetValue('cmi.core.score.max','100');
      SCORM.LMSSetValue('cmi.core.score.raw',String(pct));
      SCORM.LMSSetValue('cmi.core.lesson_status', n>=GAMES.length ? 'completed' : 'incomplete');
      SCORM.LMSCommit('');
    } else localStorage.setItem(KEY,JSON.stringify(D));
  }catch(e){}
  $('#pts').textContent=D.pts+' pt';
}
addEventListener('pagehide',()=>{ if(SCORM){ try{ save(); SCORM.LMSFinish(''); }catch(e){} } });
// chaque réponse est envoyée à ÉLÉA comme une « interaction » : l'enseignant la lit dans le rapport de l'activité SCORM
function sendInt(id,resp,result){
  if(!SCORM || !resp) return;
  try{
    const n=+SCORM.LMSGetValue('cmi.interactions._count')||0, k='cmi.interactions.'+n+'.';
    SCORM.LMSSetValue(k+'id',String(id).replace(/[^\w-]/g,'_'));
    SCORM.LMSSetValue(k+'type','fill-in'); SCORM.LMSSetValue(k+'time',new Date().toTimeString().slice(0,8));
    SCORM.LMSSetValue(k+'student_response',String(resp).replace(/[\r\n]+/g,' ').slice(0,250));
    SCORM.LMSSetValue(k+'result',result||'neutral');
    SCORM.LMSCommit('');
  }catch(e){}
}
function addPts(n,x,y,st){ D.pts+=Math.round(n); save(); if(st && x!=null) floatTxt(st,x,y,'+'+Math.round(n),'var(--good)'); }
function floatTxt(st,x,y,t,c){ const e=mk('div','float',t,st); e.style.color=c||'#fff'; place(e,x,y); setTimeout(()=>e.remove(),1000); }
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

/* ---------- boucle de jeu (s'arrête en pause) ---------- */
const G={ cur:null, pause:false };
let last=0;
function frame(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; if(G.cur && !G.pause && G.cur.update) G.cur.update(dt); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
function startGame(g){ stopGame(); G.cur=g; G.pause=false; $('#pausebtn').hidden=!g.update; }
function stopGame(){ if(G.cur && G.cur.stop) G.cur.stop(); G.cur=null; G.pause=false; document.body.classList.remove('paused'); $('#pausebtn').hidden=true; $('#pausebtn').textContent='Pause'; $('#ov').hidden=true; }
function togglePause(){ if(!G.cur || !G.cur.update || G.cur.over) return; G.pause=!G.pause; document.body.classList.toggle('paused',G.pause); $('#pausebtn').textContent=G.pause?'Reprendre':'Pause'; }
$('#pausebtn').onclick=togglePause;
addEventListener('keydown',e=>{ if(e.key==='Escape' && G.cur){ e.preventDefault(); togglePause(); } });
function overlay(html){ $('#ovc').innerHTML=html; $('#ov').hidden=false; }
function head(e,t,lead){ main.innerHTML=`<h2>${e} ${t}</h2>${lead?`<p class="lead">${lead}</p>`:''}`; scrollTo(0,0); }

/* =========================================================
   DÉCOUVERTE EN 5 ÉTAPES (jamais de pénalité)
   1 révélation · 2 superpouvoir et scène préhistorique · 3 enquête
   4 Et l'IA ? · 5 tes mots (+ quand ça aide, quand ça piège)
   ========================================================= */
const REASSURE='Pas d\'inquiétude : la plupart des gens font exactement pareil, ton prof aussi. Ce n\'est pas un défaut, c\'est la façon dont marche un cerveau humain.';
const VERD={aide:'Ça aide',piege:'Ça piège',deux:'Les deux'};
function discovery(id,cfg){
  stopGame();
  const prev=D.disc[id]||{}; const res={ ok:prev.ok, got:prev.got };
  let step=0; const N=5;
  const box=mk('div','card disc',null,main);
  const bar=()=>`<div class="steps">${Array.from({length:N},(_,i)=>`<i class="${i<step?'done':i===step?'on':''}"></i>`).join('')}</div>`;
  const qcm=(el,q,opts,good,explain,onDone,tag)=>{
    const w=mk('div',null,`<p><b>${q}</b></p><div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join('')}</div><p class="fb"></p>`,el);
    w.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const k=+b.dataset.i;
      w.querySelectorAll('.opt').forEach((x,i)=>{ x.classList.toggle('right',i===good); x.classList.toggle('wrong',i===k && i!==good); x.disabled=true; });
      const fb=w.querySelector('.fb'); fb.className='fb '+(k===good?'good':'info');
      fb.innerHTML=(k===good?'Oui ! ':'Bonne piste à creuser. ')+`<span>${explain}</span>`;
      sendInt(id+'_'+tag,opts[k],k===good?'correct':'wrong');
      onDone(k===good);
    });
    return w;
  };
  const next=(label)=>{ const r=mk('div','row',`<button class="btn ok">${label||'Suivant →'}</button>`,box); r.querySelector('button').onclick=()=>{ step++; render(); }; return r; };
  function render(){
    box.innerHTML=bar()+`<h3>Ta découverte · ${['Ce qui s\'est passé','Ton superpouvoir','Mode enquête','Et l\'IA ?','Avec tes mots'][step]}</h3>`;
    if(step===0){
      if(cfg.reveal.html) mk('div',null,cfg.reveal.html,box);
      qcm(box,cfg.reveal.q,cfg.reveal.opts,cfg.reveal.good,cfg.reveal.explain,ok=>{
        res.ok=ok; if(ok && !prev.got){ res.got=prev.got=1; addPts(20); }
        mk('p','reassure',REASSURE,box); next();
      },'revelation');
    } else if(step===1){
      mk('div',null,`<span class="power">🦸 Superpouvoir : ${cfg.power.name}</span><div class="scene"><div class="big">${cfg.power.emoji}</div>${cfg.power.scene}</div>`,box);
      qcm(box,cfg.power.q,cfg.power.opts,cfg.power.good,cfg.power.explain,()=>{
        mk('div','card',`<p>✅ <b>Aujourd'hui, ça t'aide :</b> ${cfg.power.help}</p><p style="margin:0">⚠️ <b>Aujourd'hui, ça te piège :</b> ${cfg.power.trap}</p>`,box); next();
      },'superpouvoir');
    } else if(step===2){
      mk('p','lead','🔎 Enquête : ces situations viennent de la vie de tous les jours. Pour chacune, ce mécanisme aide, piège… ou les deux ?',box);
      let left=cfg.cases.length;
      cfg.cases.forEach((c,ci)=>{
        const w=mk('div','case',`<p style="margin:0">${c.s}</p><div class="opts">${Object.keys(VERD).map(k=>`<button class="opt" data-k="${k}">${VERD[k]}</button>`).join('')}</div><p class="fb" style="margin:0"></p>`,box);
        w.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
          const k=b.dataset.k, good=k===c.a;
          w.querySelectorAll('.opt').forEach(x=>{ x.disabled=true; x.classList.toggle('right',x.dataset.k===c.a); x.classList.toggle('wrong',x===b && !good); });
          const fb=w.querySelector('.fb'); fb.className='fb '+(good?'good':'info'); fb.innerHTML=(good?'Bien vu ! ':`Plutôt « ${VERD[c.a]} ». `)+`<span>${c.why}</span>`;
          if(good) addPts(5);
          sendInt(id+'_enquete'+(ci+1),VERD[k],good?'correct':'wrong');
          if(--left===0) next();
        });
      });
    } else if(step===3){
      if(cfg.ai.html) mk('div',null,cfg.ai.html,box);
      qcm(box,cfg.ai.q,cfg.ai.opts,cfg.ai.good,cfg.ai.explain,()=>next(),'ia');
    } else {
      box.insertAdjacentHTML('beforeend',`<p class="lead">${cfg.ask}</p><textarea id="d-txt" placeholder="J'ai découvert que…">${esc(prev.txt||'')}</textarea>
        <p class="lead" style="margin-top:10px">Une situation de <b>ta</b> vie où ce mécanisme <b>t'aide</b> :</p><textarea id="d-help" placeholder="Par exemple…">${esc(prev.help||'')}</textarea>
        <p class="lead" style="margin-top:10px">Une situation où il peut <b>te piéger</b> :</p><textarea id="d-trap" placeholder="Par exemple…">${esc(prev.trap||'')}</textarea>
        <div class="row" style="margin-top:10px"><button class="btn ok" id="d-ok">Enregistrer et revenir au menu</button></div>`);
      $('#d-ok').onclick=()=>{
        const d={ q:cfg.reveal.q, ok:res.ok, got:res.got, txt:$('#d-txt').value.trim(), help:$('#d-help').value.trim(), trap:$('#d-trap').value.trim() };
        if(d.txt!==(prev.txt||'')) sendInt(id+'_phrase',d.txt);
        if(d.help!==(prev.help||'')) sendInt(id+'_aide',d.help);
        if(d.trap!==(prev.trap||'')) sendInt(id+'_piege',d.trap);
        if(!D.disc[id]) addPts(10);
        D.disc[id]=d; save(); menu();
      };
    }
    box.scrollIntoView({behavior:'smooth',block:'start'});
  }
  render();
}

/* =========================================================
   1 · SURVIE HOMÉOSTATIQUE
   phase 1 : tu régules à la main · phase 2 : tu vois venir, tu anticipes
   phase 3 : pilote automatique… et les notifications
   ========================================================= */
const HG=[ {k:'temp',e:'🌡️',n:'Température'}, {k:'eau',e:'💧',n:'Eau'}, {k:'sucre',e:'🍬',n:'Sucre'}, {k:'stress',e:'💓',n:'Stress'} ];
const HEV=[
  {e:'☀️',t:'Canicule',d:'température ↑, eau ↓',r:{temp:7,eau:-3},dur:4,main:'temp',dir:-1,cls:'hot'},
  {e:'❄️',t:'Vague de froid',d:'température ↓',r:{temp:-7},dur:4,main:'temp',dir:1,cls:'cold'},
  {e:'🏃',t:'Course',d:'sucre ↓, eau ↓, température ↑',r:{sucre:-6,eau:-3,temp:3},dur:3,main:'sucre',dir:1},
  {e:'🍩',t:'Goûter',d:'sucre ↑',r:{sucre:8},dur:3,main:'sucre',dir:-1},
  {e:'🍟',t:'Chips très salées',d:'eau ↓',r:{eau:-8},dur:3,main:'eau',dir:1},
  {e:'🧟',t:'Zombie en vue !',d:'stress ↑',r:{stress:10},dur:2.5,main:'stress',dir:-1},
  {e:'🥤',t:'Grand verre d\'eau',d:'eau ↑',r:{eau:8},dur:3,main:'eau',dir:-1}
];
const NOTIFS=[['Groupe classe','42 nouveaux messages'],['Appli de vidéos','Ton créateur préféré est en live !'],['Jeu','Ton coffre expire dans 5 min ⏰'],['Réseau','Quelqu\'un a commenté ta photo'],['Maman','Tu rentres à quelle heure ?'],['Appli','Ne perds pas ta série de 87 jours 🔥'],['Info','ALERTE : nouvelle incroyable'],['Réseau','3 personnes ont vu ton profil']];
function gHomeo(){
  head('🌡️','Survie homéostatique','Garde ton survivant en vie : chaque jauge doit rester dans la <b>zone verte</b>. Appuie sur <b>−</b> et <b>+</b> pour corriger. Trois phases de 30 secondes.');
  const go=mk('div','row',`<button class="btn ok" id="h-go">Commencer</button>`,main);
  $('#h-go').onclick=()=>{ go.remove(); playHomeo(); };
}
function playHomeo(){
  const PH=[
    {t:'Phase 1 · À la main',m:'Les événements tombent sans prévenir : corrige vite !'},
    {t:'Phase 2 · Tu vois venir',m:'Maintenant, tu vois l\'événement 3 secondes avant. Corrige <b>avant</b> qu\'il arrive : bonus « Anticipé ! ».'},
    {t:'Phase 3 · Pilote automatique',m:'Ton corps prend le relais pour la température, l\'eau et le sucre. Toi, élimine les zombies qui approchent (touche-les).'}
  ];
  const hud=mk('div','hud',`<span id="h-ph"></span><span id="h-t"></span><span id="h-sc">0 pt</span>`,main);
  const st=mk('div','stage hst',null,main);
  st.innerHTML=`<div class="hlife"><i style="width:100%"></i></div><div class="hav">🧍</div><div class="hgs">${HG.map(g=>`<div class="hg" data-k="${g.k}"><div class="lb"><span>${g.e}</span>${g.n}</div><div class="hbar"><div class="zone"></div><div class="lvl"></div></div><div class="hbt"><button data-d="-1" aria-label="${g.n} moins">−</button><button data-d="1" aria-label="${g.n} plus">+</button></div><div class="hauto" hidden>AUTO ✓</div></div>`).join('')}</div>`;
  const S={ ph:0, t:0, v:{temp:50,eau:55,sucre:50,stress:30}, life:100, sc:0, ev:null, warn:null, nextEv:2, antic:0, faints:0, zt:1.5, nt:0, zs:[], ns:[], stressLog:[], tapsInWarn:{}, over:false, paid:0 };
  const W=()=>st.clientWidth, H=()=>st.clientHeight;
  const ev=mk('div','hev','',st); ev.hidden=true;
  const tap=(k,d)=>{
    if(S.ph===2 && k!=='stress') return;
    S.v[k]=clamp(S.v[k]+d*7,0,100);
    if(S.warn && S.warn.main===k && d===S.warn.dir) S.tapsInWarn[k]=(S.tapsInWarn[k]||0)+1;
  };
  st.querySelectorAll('.hg').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>tap(g.dataset.k,+b.dataset.d)));
  const showEv=(html,warn)=>{ ev.hidden=false; ev.className='hev'+(warn?' warn':''); ev.innerHTML=html; };
  function startPhase(i){
    S.ph=i; S.t=0; S.ev=null; S.warn=null; S.nextEv=2.5; ev.hidden=true;
    $('#h-ph').textContent=PH[i].t;
    st.classList.toggle('auto',i===2);
    st.querySelectorAll('.hg').forEach(g=>{ const auto=i===2 && g.dataset.k!=='stress'; g.querySelector('.hbt').hidden=auto; g.querySelector('.hauto').hidden=!auto; });
    G.pause=true; overlay(`<h2>${PH[i].t}</h2><p>${PH[i].m}</p><div class="row c"><button class="btn ok" id="h-c">C'est parti</button></div>`);
    $('#h-c').onclick=()=>{ $('#ov').hidden=true; G.pause=false; };
  }
  function launch(e){
    const strength=S.tapsInWarn[e.main]? .45 : 1;
    if(S.ph===1 && S.tapsInWarn[e.main]){ S.antic++; S.sc+=15; S.paid+=15; addPts(15); floatTxt(st,W()/2,H()*.36,'Anticipé ! +15','var(--good)'); }
    S.tapsInWarn={}; S.warn=null;
    S.ev={ ...e, left:e.dur, k:strength };
    if(S.ph<2) showEv(`${e.e} <b>${e.t}</b> · ${e.d}`);
    st.classList.remove('hot','cold'); if(e.cls) st.classList.add(e.cls);
  }
  function spawnZombie(){
    const z=mk('button','hz','🧟',st); const x=rand(40,W()-40), y=rand(H()*.3,H()*.55); place(z,x,y);
    const o={el:z,age:0}; S.zs.push(o);
    z.onclick=()=>{ z.remove(); S.zs.splice(S.zs.indexOf(o),1); S.sc+=10; S.paid+=10; addPts(10,x,y,st); };
  }
  function spawnNotif(){
    const [a,m]=pick(NOTIFS); const n=mk('button','hn',`<small>📱 ${a}</small>${m}`,st);
    place(n,rand(100,W()-100),rand(60,H()*.42)); const o={el:n}; S.ns.push(o);
    S.v.stress=clamp(S.v.stress+7,0,100);
    n.onclick=()=>{ n.remove(); S.ns.splice(S.ns.indexOf(o),1); };
    if(S.ns.length>5){ const old=S.ns.shift(); old.el.remove(); }
  }
  const g={ update(dt){
    if(S.over) return;
    S.t+=dt; const v=S.v;
    // dérives naturelles
    v.eau-=1.1*dt; v.sucre-=1*dt; v.temp+=rand(-1.5,1.5)*dt; v.stress+=(S.ph<2?.4:0)*dt;
    // événements (phases 1 et 2 ; en phase 3 ils continuent, le pilote automatique s'en charge)
    if(!S.ev && !S.warn){ S.nextEv-=dt; if(S.nextEv<=0){
      const e=pick(S.ph===2?HEV.filter(x=>x.main!=='stress'):HEV);
      if(S.ph===1){ S.warn={...e,left:3}; S.tapsInWarn={}; showEv(`⏳ Dans 3 s : ${e.e} <b>${e.t}</b> (${e.d})`,true); }
      else launch(e);
    }}
    if(S.warn){ S.warn.left-=dt; ev.innerHTML=`⏳ Dans ${Math.ceil(S.warn.left)} s : ${S.warn.e} <b>${S.warn.t}</b> (${S.warn.d})`; if(S.warn.left<=0) launch(S.warn); }
    if(S.ev){ for(const k in S.ev.r) v[k]+=S.ev.r[k]*S.ev.k*dt; S.ev.left-=dt; if(S.ev.left<=0){ S.ev=null; ev.hidden=true; st.classList.remove('hot','cold'); S.nextEv=S.ph===0?rand(1.2,2.4):rand(1.6,2.6); } }
    // phase 3 : régulation automatique (sauf le stress, que le corps ne règle que lentement)
    if(S.ph===2){
      for(const k of ['temp','eau','sucre']) v[k]+=(50-v[k])*2.2*dt;
      v.stress+=(30-v.stress)*.05*dt;
      S.zt-=dt; if(S.zt<=0){ spawnZombie(); S.zt=rand(1,1.8); }
      S.zs.slice().forEach(o=>{ o.age+=dt; if(o.age>3.2){ o.el.remove(); S.zs.splice(S.zs.indexOf(o),1); v.stress+=6; } });
      if(S.t>6){ S.nt-=dt; if(S.nt<=0){ spawnNotif(); S.nt=rand(.8,1.4); } }
      S.stressLog.push(v.stress);
    } else v.stress+=(30-v.stress)*.08*dt;
    let bad=0;
    for(const k in v){ v[k]=clamp(v[k],0,100); if(v[k]<20||v[k]>80) bad++; }
    const inZone=Object.values(v).every(x=>x>=35&&x<=65);
    S.life=clamp(S.life-bad*(S.ph===2?3:9)*dt+(inZone?3*dt:0),0,100);
    if(inZone && S.ph<2){ S.sc+=dt*4; }
    if(S.life<=0){ S.faints++; S.life=60; for(const k of ['temp','eau','sucre']) v[k]=50; shake(st); floatTxt(st,W()/2,H()*.3,'Malaise ! On repart.','#ffb3b3'); }
    // affichage
    st.querySelectorAll('.hg').forEach(el=>{ const x=v[el.dataset.k]; el.querySelector('.lvl').style.height=x+'%'; el.querySelector('.hbar').classList.toggle('danger',x<20||x>80); });
    st.querySelector('.hlife i').style.width=S.life+'%'; st.querySelector('.hlife i').style.background=S.life<35?'var(--bad)':'var(--good)';
    const av=st.querySelector('.hav');
    av.textContent=v.stress>75?'😰':v.temp>75?'🥵':v.temp<25?'🥶':v.eau<25?'🫠':v.sucre<25?'😵':S.ph===2?'🧘':'🧍';
    av.classList.toggle('bad',bad>0);
    $('#h-t').textContent=Math.max(0,Math.ceil(30-S.t))+' s'; $('#h-sc').textContent=Math.round(S.sc)+' pt';
    if(S.t>=30){ if(S.ph<2) startPhase(S.ph+1); else finish(); }
  }, stop(){ S.over=true; } };
  function finish(){
    S.over=true; G.cur.over=true;
    const sc=Math.round(S.sc); D.best.homeo=Math.max(D.best.homeo||0,sc); addPts(Math.max(0,sc-S.paid));
    const log=S.stressLog, n=log.length, pts=log.filter((_,i)=>i%6===0).map((y,i,a)=>`${(i/(a.length-1||1)*300).toFixed(1)},${(100-y).toFixed(1)}`).join(' ');
    const endStress=Math.round(log[n-1]||S.v.stress);
    stopGame();
    overlay(`<h2>Fin de la survie</h2><p>Score : <b>${sc} pt</b>${S.antic?` · ${S.antic} anticipation${S.antic>1?'s':''}`:''}${S.faints?` · ${S.faints} malaise${S.faints>1?'s':''} (pas grave, c'est un jeu !)`:''}</p>
      <p style="text-align:left">En phase 3, ton stress pendant le pilote automatique :</p>
      <svg class="hcurve" viewBox="0 0 300 100" preserveAspectRatio="none"><rect x="0" y="35" width="300" height="30" fill="#6ee7a022"/><polyline points="${pts}" fill="none" stroke="#ff6aa8" stroke-width="3"/></svg>
      <p style="text-align:left">${endStress>65?'Les notifications ont fait grimper ton stress, et le pilote automatique n\'arrivait plus à le faire redescendre.':'Ton stress a tenu, mais regarde comme il montait à chaque notification.'}</p>
      <div class="row c"><button class="btn" id="h-a">Rejouer</button><button class="btn ok" id="h-d">Ma découverte</button></div>`);
    $('#h-a').onclick=()=>{ $('#ov').hidden=true; gHomeo(); };
    $('#h-d').onclick=()=>{ $('#ov').hidden=true; main.querySelectorAll('.stage,.hud').forEach(e=>e.remove()); discHomeo(); };
  }
  startGame(g); startPhase(0);
}

/* =========================================================
   2 · HALLUCINATION CONTRÔLÉE
   flashs zombie ou souche (calme puis alerte) · lettres mélangées
   tache aveugle · le mot suivant
   ========================================================= */
// silhouettes : zombie et souche sont construits avec les MÊMES pièces (tronc, deux membres, base)
// m = 0 → souche, m = 1 → zombie ; entre les deux → forme ambiguë. ws / hs : rapport largeur / hauteur variable
function silItem(k,seed){
  const R=i=>{ const x=Math.sin(seed*12.9898+i*78.233)*43758.5453; return x-Math.floor(x); };
  const m=k==='z'?.64+R(1)*.2:k==='s'?.16+R(1)*.2:.45+R(1)*.1;
  return { k, seed, m, ws:.7+R(2)*.65, hs:.75+R(3)*.45, dir:R(4)<.5?-1:1, bg:R(5) };
}
function fSvg(o){
  const R=i=>{ const x=Math.sin(o.seed*7.137+i*31.7)*9187.31; return x-Math.floor(x); };
  const m=o.m, cx=50, ground=94, H=58*o.hs, W=15*o.ws, top=ground-H, legH=H*.36*m, bodyB=ground-legH;
  const P=[];
  // tronc / corps
  P.push(`<rect x="${(cx-W/2).toFixed(1)}" y="${top.toFixed(1)}" width="${W.toFixed(1)}" height="${(bodyB-top+2).toFixed(1)}" rx="${(2+4*m).toFixed(1)}"/>`);
  // jambes (zombie) ou racines (souche)
  const gap=W*.22*m, lw=(W-gap)/2;
  if(legH>1){ P.push(`<rect x="${(cx-W/2).toFixed(1)}" y="${(bodyB-1).toFixed(1)}" width="${lw.toFixed(1)}" height="${(legH+1).toFixed(1)}" rx="2"/>`,`<rect x="${(cx+gap/2).toFixed(1)}" y="${(bodyB-1).toFixed(1)}" width="${lw.toFixed(1)}" height="${(legH+1).toFixed(1)}" rx="2"/>`); }
  const sp=(1-m)*11*o.ws;
  if(sp>1) P.push(`<path d="M${cx-W/2-sp} ${ground} L${cx-W/2} ${ground-9} L${cx+W/2} ${ground-9} L${cx+W/2+sp} ${ground} Z"/>`);
  // tête (zombie) ou sommet cassé (souche)
  const hr=7.5*m*Math.sqrt(o.ws);
  if(hr>1) P.push(`<circle cx="${(cx+o.dir*2*m).toFixed(1)}" cy="${(top-hr*.75).toFixed(1)}" r="${hr.toFixed(1)}"/>`);
  const th=(1-m)*8;
  if(th>1) P.push(`<path d="M${cx-W/2} ${top+2} L${cx-W/4} ${top-th*R(1)} L${cx} ${top+1} L${cx+W/5} ${top-th} L${cx+W/2} ${top+2} Z"/>`);
  // deux membres : branches vers le haut (souche) → bras tendus devant (zombie)
  const sy=top+H*(.12+.3*(1-m)*R(2)), sy2=top+H*(.12+.35*(1-m)*R(3)), L1=17*o.ws*(.8+.4*R(4)), L2=17*o.ws*(.8+.4*R(5));
  const a1=(-130+130*m)*Math.PI/180, a2=(-50+58*m)*Math.PI/180;
  const limb=(x,y,a,L)=>{ const ax=o.dir>0?a:Math.PI-a; return `<path d="M${x.toFixed(1)} ${y.toFixed(1)} L${(x+Math.cos(ax)*L).toFixed(1)} ${(y+Math.sin(ax)*L).toFixed(1)}" stroke="#141210" stroke-width="${(4+1.5*o.ws).toFixed(1)}" stroke-linecap="round"/>`; };
  P.push(limb(cx-o.dir*W*.3,sy,a1,L1), limb(cx+o.dir*W*.3,sy2,a2,L2));
  const bgc=['#55684a','#4c5f4e','#5d6650','#4a5a44'][Math.floor(o.bg*4)];
  return `<svg viewBox="0 0 100 100"><defs><filter id="bl${o.seed}"><feGaussianBlur stdDeviation="1.3"/></filter></defs><rect width="100" height="100" fill="${bgc}"/><rect y="88" width="100" height="12" fill="#00000033"/><g filter="url(#bl${o.seed})" fill="#141210">${P.join('')}</g></svg>`;
}
function gHallu(){
  head('👁️','Hallucination contrôlée','Quatre petites épreuves sur ce que tu <b>vois</b> vraiment. Réponds vite, sans réfléchir : il n\'y a pas de piège… enfin, presque.');
  const go=mk('div','row',`<button class="btn ok" id="f-go">Commencer</button>`,main);
  $('#f-go').onclick=()=>{ go.remove(); hFlash(); };
}
const HA={};
// barème : zombie raté (ou pas de réponse) −5, souche prise pour un zombie −1, bonne réponse +1
const FCOST={hit:1,miss:-5,fa:-1};
function hFlash(){
  HA.amb=[0,1,2,3].map(i=>silItem('a',i*17+randi(1,9)));
  HA.res={calm:0,alert:0}; HA.score=0; HA.miss=0; HA.fa=0;

      <p>Sur ces 4 silhouettes ambiguës, tu as vu un zombie <b>${c} fois au calme</b> et <b>${a} fois en alerte</b>.</p>

      <p>Et avec ces règles (zombie raté −5, fausse alerte −1), dans le doute, il vaut mieux crier « zombie ! » : une fausse alerte coûte peu, un zombie raté coûte cher.</p>
      <p class="reassure" style="margin:0">${REASSURE}</p>`,main);
    mk('div','row',`<button class="btn ok" id="f-n2">Épreuve suivante →</button>`,main);

    <ol class="notes">${L.map(({g,d})=>`<li><b>${g.e} ${g.t}</b><br>${d?`${d.txt?`« ${esc(d.txt)} »`:'<span class="q">(pas de phrase)</span>'}${d.help?`<br>✅ Ça m'aide : ${esc(d.help)}`:''}${d.trap?`<br>⚠️ Ça me piège : ${esc(d.trap)}`:''}`:'<span class="q">Pas encore fait.</span>'}</li>`).join('')}</ol>
    <p>Total : <b>${D.pts} points</b></p><div class="row"><button class="btn ok" id="cpy">Copier le texte</button><button class="btn" id="back">Menu</button><button class="btn" id="rs">Tout effacer</button></div><p class="fb" id="nf"></p>`;
  const txt='Mes découvertes (SNT · Brain Exploration)\n\n'+L.map(({g,d})=>`${g.e} ${g.t}\n${d?`« ${d.txt||'-'} »${d.help?`\nÇa m'aide : ${d.help}`:''}${d.trap?`\nÇa me piège : ${d.trap}`:''}`:'(pas fait)'}`).join('\n\n');
  $('#cpy').onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); $('#nf').className='fb good'; $('#nf').textContent='Copié !'; }catch(e){ $('#nf').className='fb bad'; $('#nf').textContent='Copie impossible ici : sélectionne le texte à la main.'; } };
  $('#back').onclick=menu;
  $('#rs').onclick=()=>{ if(confirm('Effacer tes découvertes, records et points ?')){ D={pts:0,best:{},disc:{}}; save(); menu(); } };
}
$('#home').onclick=menu;
save(); menu();
</script>

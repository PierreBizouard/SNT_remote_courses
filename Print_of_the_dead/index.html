<style>

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}

<script>

function lev(a,b){ const d=Array.from({length:a.length+1},(_,i)=>[i]); for(let j=1;j<=b.length;j++) d[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return d[a.length][b.length]; }

/* =====================================================================
   Mini-interpréteur Python (une ligne) : print, variables, calculs, textes
   ===================================================================== */
class PyErr extends Error{ constructor(type,msg,tip){ super(msg); this.type=type; this.tip=tip||''; } }
class PyFloat{ constructor(v){ this.v=v; } }
class Builtin{ constructor(name,fn){ this.name=name; this.fn=fn; } }

const SE=(m,t)=>new PyErr('SyntaxError',m,t);
const TE=(m,t)=>new PyErr('TypeError',m,t);
function tname(v){ if(typeof v==='string') return 'str'; if(typeof v==='boolean') return 'bool'; if(typeof v==='number') return 'int'; if(v instanceof PyFloat) return 'float'; if(v===null) return 'NoneType'; if(v instanceof Builtin) return 'builtin_function_or_method'; if(v instanceof PyType) return 'type'; return 'object'; }
function fstr(x){ if(!isFinite(x)) return x>0?'inf':'-inf'; if(Number.isInteger(x)&&Math.abs(x)<1e16) return x.toFixed(1); return String(x); }
function pstr(v){ if(typeof v==='string') return v; if(typeof v==='boolean') return v?'True':'False'; if(typeof v==='number') return String(v); if(v instanceof PyFloat) return fstr(v.v); if(v===null) return 'None'; if(v instanceof Builtin) return `<built-in function ${v.name}>`; if(v instanceof PyType) return `<class '${v.n}'>`; return String(v); }
function pyrepr(v){ if(typeof v==='string') return v.includes("'")&&!v.includes('"')?`"${v}"`:`'${v.replace(/'/g,"\\'")}'`; return pstr(v); }
const isNum=x=>typeof x==='number'||typeof x==='boolean'||x instanceof PyFloat;
const nv=x=>x instanceof PyFloat?x.v:+x;
const same=(a,b)=>typeof a==='string'||typeof b==='string'?a===b:isNum(a)&&isNum(b)?nv(a)===nv(b):a===b;

const TIP_CONCAT='On ne peut pas coller (+) un texte et un nombre. Utilise une virgule : print("Il reste", balles) ou transforme le nombre en texte : str(balles).';
function binop(op,a,b){
  if(op==='+'){
    if(typeof a==='string'&&typeof b==='string'){ if(a.length+b.length>5000) throw new PyErr('Oups','texte trop long pour ce jeu'); return a+b; }
    if(typeof a==='string') throw TE(`can only concatenate str (not "${tname(b)}") to str`,TIP_CONCAT);
    if(typeof b==='string') throw TE(`unsupported operand type(s) for +: '${tname(a)}' and 'str'`,TIP_CONCAT);
  }
  if(op==='*'&&(typeof a==='string'||typeof b==='string')){
    const [s,k]=typeof a==='string'?[a,b]:[b,a];
    if(typeof k==='number'||typeof k==='boolean'){ const n=Math.max(0,+k); if(s.length*n>5000) throw new PyErr('Oups','texte beaucoup trop long pour ce jeu !'); return s.repeat(n); }
    throw TE(`can't multiply sequence by non-int of type '${tname(k)}'`, typeof k==='string'?'On ne multiplie pas deux textes. Un texte × un nombre entier le répète : cri * 3.':'Un texte se répète un nombre ENTIER de fois : cri * 3.');
  }
  if(!isNum(a)||!isNum(b)) throw TE(`unsupported operand type(s) for ${op}: '${tname(a)}' and '${tname(b)}'`, typeof a==='string'||typeof b==='string'?'On ne fait pas de calcul avec du texte. "5" entre guillemets est un texte ; 5 sans guillemets est un nombre.':'Ce calcul n\'a pas de sens pour Python.');
  const fl=a instanceof PyFloat||b instanceof PyFloat, x=nv(a), y=nv(b);
  const ZD=m=>new PyErr('ZeroDivisionError',m,'On ne peut pas diviser par zéro, même pour tuer un zombie.');
  let r;
  switch(op){
    case '+': r=x+y; break; case '-': r=x-y; break; case '*': r=x*y; break;
    case '/': if(y===0) throw ZD('division by zero'); return new PyFloat(x/y);
    case '//': if(y===0) throw ZD('integer division or modulo by zero'); r=Math.floor(x/y); break;
    case '%': if(y===0) throw ZD('integer modulo by zero'); r=x-y*Math.floor(x/y); break;
    case '**': r=x**y; if(!fl&&y<0) return new PyFloat(r); break;
  }
  return fl?new PyFloat(r):r;
}
function cmpop(op,a,b){
  if(op==='=='||op==='!='){ const e=same(a,b); return op==='=='?e:!e; }
  const bothS=typeof a==='string'&&typeof b==='string';
  if(!bothS&&!(isNum(a)&&isNum(b))) throw TE(`'${op}' not supported between instances of '${tname(a)}' and '${tname(b)}'`,'On ne compare pas un texte et un nombre.');

function argc(name,args,n){ if(args.length!==n) throw TE(`${name}() takes exactly ${n===1?'one argument':n+' arguments'} (${args.length} given)`); }
const BI={
  print:new Builtin('print',(a,kw,c)=>{ const sep=kw.sep!==undefined?pstr(kw.sep):' '; c.out.push(a.map(pstr).join(sep)); return null; }),
  len:new Builtin('len',(a)=>{ argc('len',a,1); if(typeof a[0]==='string') return [...a[0]].length; throw TE(`object of type '${tname(a[0])}' has no len()`,'len( ) compte les caractères d\'un TEXTE. Un nombre n\'a pas de longueur.'); }),
  str:new Builtin('str',(a)=>{ argc('str',a,1); return pstr(a[0]); }),
  int:new Builtin('int',(a)=>{ argc('int',a,1); const x=a[0]; if(typeof x==='string'){ if(/^\s*[+-]?\d+\s*$/.test(x)) return parseInt(x,10); throw new PyErr('ValueError',`invalid literal for int() with base 10: ${pyrepr(x)}`,'Ce texte ne contient pas un nombre entier.'); } if(isNum(x)) return Math.trunc(nv(x)); throw TE(`int() argument must be a string or a number, not '${tname(x)}'`); }),
  float:new Builtin('float',(a)=>{ argc('float',a,1); const x=a[0]; if(typeof x==='string'){ const f=parseFloat(x); if(/^\s*[+-]?(\d+\.?\d*|\.\d+)\s*$/.test(x)) return new PyFloat(f); throw new PyErr('ValueError',`could not convert string to float: ${pyrepr(x)}`); } if(isNum(x)) return new PyFloat(nv(x)); throw TE(`float() argument must be a string or a real number, not '${tname(x)}'`); }),
  type:new Builtin('type',(a)=>{ argc('type',a,1); return new PyType(tname(a[0])); }),
  abs:new Builtin('abs',(a)=>{ argc('abs',a,1); if(!isNum(a[0])) throw TE(`bad operand type for abs(): '${tname(a[0])}'`); return a[0] instanceof PyFloat?new PyFloat(Math.abs(a[0].v)):Math.abs(+a[0]); }),
  round:new Builtin('round',(a)=>{ if(!a.length||!isNum(a[0])) throw TE('round() attend un nombre'); if(a.length>1){ const p=10**nv(a[1]); return new PyFloat(Math.round(nv(a[0])*p)/p); } return Math.round(nv(a[0])); }),
  max:new Builtin('max',(a)=>{ if(a.length<2) throw TE('max() attend au moins deux valeurs ici'); return a.reduce((m,x)=>cmpop('>',x,m)?x:m); }),
  min:new Builtin('min',(a)=>{ if(a.length<2) throw TE('min() attend au moins deux valeurs ici'); return a.reduce((m,x)=>cmpop('<',x,m)?x:m); }),
  input:new Builtin('input',()=>{ throw new PyErr('Oups','input() attend que quelqu\'un tape au clavier… pas pendant une attaque de zombies !','On verra input( ) plus tard. Ici, écris directement la valeur.'); })
};
const KW=new Set(['if','else','elif','for','while','def','return','import','from','class','and','or','not','in','is','lambda','with','try','except','pass','break','continue','global','del','assert','yield','raise','as','finally','nonlocal']);

function tokenize(s){
  if(/^[ \t]+\S/.test(s)) throw new PyErr('IndentationError','unexpected indent','Pas d\'espace au tout début de la ligne : en Python, le décalage (l\'indentation) a un sens.');
  const T=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(c===' '||c==='\t'){ i++; continue; }
    if(c==='#') break;
    let f=false;
    if((c==='f'||c==='F')&&(s[i+1]==='"'||s[i+1]==="'")){ f=true; i++; }
    const q=s[i];
    if(q==='"'||q==="'"){
      let j=i+1, v='';
      while(j<s.length&&s[j]!==q){ if(s[j]==='\\'&&j+1<s.length){ const e=s[j+1]; v+=e==='n'?'\n':e==='t'?'\t':e; j+=2; } else { v+=s[j]; j++; } }
      if(j>=s.length) throw SE('unterminated string literal (detected at line 1)','Un guillemet a été ouvert mais jamais fermé : un texte commence ET finit par un guillemet, comme "LUNDI".');
      T.push({k:f?'fstr':'str',v}); i=j+1; continue;
    }
    if(/[0-9]/.test(c)||(c==='.'&&/[0-9]/.test(s[i+1]||''))){
      const m=/^\d*\.?\d*/.exec(s.slice(i))[0], after=s[i+m.length]||'';
      if(/[\p{L}_]/u.test(after)) throw SE('invalid decimal literal','Un nom de variable ne commence jamais par un chiffre (écris ail2, pas 2ail). Et pour multiplier, il faut l\'étoile : 2 * ail.');
      if(after===',') { /* ok : virgule entre deux arguments */ }
      T.push({k:'num',v:m.includes('.')?new PyFloat(parseFloat(m)):parseInt(m,10)}); i+=m.length; continue;
    }
    if(/[\p{L}_]/u.test(c)){ const m=/^[\p{L}_][\p{L}\p{N}_]*/u.exec(s.slice(i))[0]; T.push({k:'name',v:m}); i+=m.length; continue; }
    const two=s.substr(i,2);
    if(['+=','-=','*=','/=','==','!=','<=','>=','//','**'].includes(two)){ T.push({k:'op',v:two}); i+=2; continue; }
    if('+-*/%()=,<>:[].{}'.includes(c)){ T.push({k:'op',v:c}); i++; continue; }
    const code='U+'+c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');
    let tip='Ce caractère ne fait pas partie du langage Python.';
    if('«»“”„'.includes(c)) tip='Utilise les guillemets droits " (touche 3 du clavier), pas les guillemets « » ou “ ”.';
    else if(c==='×') tip='En Python, la multiplication s\'écrit avec une étoile : 6 * 7.';
    else if(c==='÷') tip='En Python, la division s\'écrit avec / : 10 / 2.';
    else if(c===';') tip='Pas besoin de point-virgule à la fin d\'une ligne en Python.';
    else if(c==='!') tip='Le point d\'exclamation va DANS le texte, entre les guillemets : print("BOUH !").';
    throw SE(`invalid character '${c}' (${code})`,tip);
  }
  T.push({k:'end'}); return T;
}

function parse(T){
  let i=0;
  const op=v=>T[i].k==='op'&&T[i].v===v;
  const NOTCLOSED=()=>SE("'(' was never closed",'Une parenthèse a été ouverte mais jamais fermée : ajoute ) à la fin.');
  if(T[0].k==='end') return {t:'empty'};
  for(const t of T) if(t.k==='name'&&KW.has(t.v)) throw new PyErr('Patience',`« ${t.v} » est bien un mot de Python, mais il n'est pas au programme de ce niveau.`,'Ici on utilise seulement print( ), les variables (nom = valeur) et les calculs.');
  if(T[0].k==='name'&&T[0].v==='print'&&T[1].k!=='end'&&!(T[1].k==='op'&&['(','=','+=','-=','*=','/=','.'].includes(T[1].v)))
    throw SE("Missing parentheses in call to 'print'. Did you mean print(...)?",'En Python, print a besoin de parenthèses : print("LUNDI").');
  if(T[0].k==='name'&&T[1].k==='op'&&['=','+=','-=','*=','/='].includes(T[1].v)){
    const n=T[0].v, o=T[1].v; i=2;
    if(T[i].k==='end') throw SE('invalid syntax',`Il manque la valeur après le ${o} : par exemple ${n} ${o} 3`);
    const e=expr(); endCheck(); return {t:'assign',n,op:o,e};
  }
  const e=expr();
  if(op('=')){ const kind=['num','str','const','fstr'].includes(e.t)?'literal':e.t==='call'?'function call':'expression';
    throw SE(`cannot assign to ${kind} here. Maybe you meant '==' instead of '='?`,'Le = range la valeur de DROITE dans la boîte de GAUCHE. À gauche, il faut un NOM de variable : ail = 3 (et pas 3 = ail).'); }
  endCheck(); return {t:'expr',e};

  function endCheck(){
    if(T[i].k==='end') return;
    if(op(')')) throw SE("unmatched ')'",'Il y a une parenthèse fermante de trop.');
    if(T[0].k==='name'&&T[1].k==='name') throw SE('invalid syntax','Pas d\'espace dans un nom de variable : écris mon_arme (avec un tiret bas _), pas mon arme.');
    throw SE('invalid syntax','Python ne comprend pas cette ligne. Vérifie les guillemets, les parenthèses et les opérateurs (+ - * /).');
  }
  function expr(){ let a=arith(); if(T[i].k==='op'&&['==','!=','<','>','<=','>='].includes(T[i].v)){ const o=T[i++].v; a={t:'cmp',op:o,a,b:arith()}; } return a; }
  function arith(){ let a=term(); while(op('+')||op('-')){ const o=T[i++].v; a={t:'bin',op:o,a,b:term()}; } return a; }
  function term(){ let a=unary(); while(op('*')||op('/')||op('//')||op('%')){ const o=T[i++].v; a={t:'bin',op:o,a,b:unary()}; } return a; }
  function unary(){ if(op('-')){ i++; return {t:'neg',a:unary()}; } if(op('+')){ i++; return unary(); } return power(); }
  function power(){ const a=primary(); if(op('**')){ i++; return {t:'bin',op:'**',a,b:unary()}; } return a; }
  function primary(){
    const t=T[i];
    if(t.k==='num'){ i++; return {t:'num',v:t.v}; }
    if(t.k==='str'||t.k==='fstr'){ let v='', f=false; while(T[i].k==='str'||T[i].k==='fstr'){ v+=T[i].v; f=f||T[i].k==='fstr'; i++; } return {t:f?'fstr':'str',v}; }
    if(t.k==='name'){
      i++;
      if(t.v==='True'||t.v==='False'||t.v==='None') return {t:'const',v:t.v==='True'?true:t.v==='False'?false:null};
      let n={t:'name',n:t.v};
      if(op('.')) throw new PyErr('Patience','Le point (objet.méthode) sert aux objets : c\'est le niveau 2, « Python of the Dead » !','Ici, pas de point : juste print( ), des variables et des calculs.');
      if(op('[')) throw new PyErr('Patience','Les crochets [ ] (listes) sont pour le niveau 2.','');
      while(op('(')){
        i++; const args=[], kw={};
        while(!op(')')){
          if(T[i].k==='end') throw NOTCLOSED();
          if(T[i].k==='name'&&T[i+1].k==='op'&&T[i+1].v==='='){ const k=T[i].v; i+=2; kw[k]=expr(); }
          else args.push(expr());
          if(op(',')){ i++; continue; }
          if(op(')')) break;
          if(T[i].k==='end') throw NOTCLOSED();
          throw SE('invalid syntax. Perhaps you forgot a comma?','Entre deux éléments dans les parenthèses, il faut une virgule (ou un + pour coller deux textes).');
        }
        i++; n={t:'call',f:n,args,kw};
      }
      return n;
    }
    if(op('(')){ i++; if(T[i].k==='end') throw NOTCLOSED(); const e=expr(); if(T[i].k==='end') throw NOTCLOSED(); if(!op(')')) throw SE('invalid syntax. Perhaps you forgot a comma?','Il manque une virgule ou un opérateur.'); i++; return e; }
    if(t.k==='end') throw SE('invalid syntax','La ligne s\'arrête trop tôt : il manque quelque chose à la fin (un nombre, un texte, une parenthèse ?).');
    if(op(')')) throw SE("unmatched ')'",'Il y a une parenthèse fermante de trop.');
    if(op('[')) throw new PyErr('Patience','Les crochets [ ] (listes) sont pour le niveau 2.','');
    throw SE('invalid syntax','Python ne comprend pas cette ligne. Vérifie les guillemets, les parenthèses et les opérateurs.');
  }
}

function ev(n,c){
  switch(n.t){
    case 'num': case 'str': case 'const': return n.v;
    case 'fstr': return n.v.replace(/\{([^{}]*)\}/g,(_,e)=>{ const st=parse(tokenize(e.trim())); if(st.t!=='expr') throw SE('f-string: invalid syntax'); return pstr(ev(st.e,c)); });
    case 'name': if(Object.prototype.hasOwnProperty.call(V,n.n)) return V[n.n]; if(BI[n.n]) return BI[n.n]; if(n.n==='str'||n.n==='int') return BI[n.n]; nameErr(n.n);
    case 'neg': { const a=ev(n.a,c); if(!isNum(a)) throw TE(`bad operand type for unary -: '${tname(a)}'`); return a instanceof PyFloat?new PyFloat(-a.v):-a; }
    case 'bin': return binop(n.op,ev(n.a,c),ev(n.b,c));
    case 'cmp': return cmpop(n.op,ev(n.a,c),ev(n.b,c));
    case 'call': {
      const f=ev(n.f,c);
      if(!(f instanceof Builtin)){ if(f instanceof PyType) return BI[f.n]?BI[f.n].fn(n.args.map(a=>ev(a,c)),{},c):null;
        throw TE(`'${tname(f)}' object is not callable`,`${n.f.n||'Cette valeur'} est une boîte qui contient ${pyrepr(f)}, pas une commande : on ne met pas de parenthèses après.`); }
      const kw={}; for(const k in n.kw) kw[k]=ev(n.kw[k],c);
      return f.fn(n.args.map(a=>ev(a,c)),kw,c);
    }
  }
  throw SE('invalid syntax');
}
let screenTexts=()=>[], screenVars=()=>[];
function nameErr(n){
  const cands=[...Object.keys(V),...Object.keys(BI)];
  const ci=cands.find(k=>k!==n&&k.toLowerCase()===n.toLowerCase());
  const close=ci||cands.map(k=>[k,lev(k,n)]).filter(x=>x[1]<=(n.length<3?1:2)).sort((a,b)=>a[1]-b[1]).map(x=>x[0])[0];
  let msg=`name '${n}' is not defined`+(close?`. Did you mean: '${close}'?`:''), tip;
  const low=n.toLowerCase();
  if(screenVars().includes(n)) tip=`La boîte ${n} n'existe pas encore : crée-la d'abord avec ${n} = … (regarde la mémoire de Python).`;
  else if(screenTexts().some(w=>w.toLowerCase().split(/\s+/).includes(low))) tip=`Sans guillemets, Python cherche une boîte (une variable) appelée ${n}… qui n'existe pas. Pour du texte, mets des guillemets : "${n}".`;
  else if(ci) tip=`Python fait la différence entre majuscules et minuscules : écris ${ci}.`;
  else if(close) tip=`Faute de frappe ? Python connaît ${close}.`;
  else tip=`La boîte ${n} n'existe pas encore. Crée-la d'abord (${n} = …), ou mets des guillemets si c'est du texte.`;
  throw new PyErr('NameError',msg,tip);
}
function exec(src){
  const st=parse(tokenize(src));
  const c={src,st,out:[],before:Object.assign({},V),assigned:null,aug:false,isPrint:false,echo:undefined};
  if(st.t==='empty') return c;
  if(st.t==='assign'){
    if(BI[st.n]) throw new PyErr('Oups',`tu allais écraser ${st.n} !`,`Python te laisserait faire, mais ensuite ${st.n}( ) ne marcherait plus. Choisis un autre nom de variable.`);
    let v=ev(st.e,c);
    if(st.op!=='='){ if(!(st.n in V)) nameErr(st.n); v=binop(st.op[0],V[st.n],v); }
    V[st.n]=v; c.assigned=st.n; c.aug=st.op!=='='; c.rhs=st.e;
  } else {
    const v=ev(st.e,c);
    c.isPrint=st.e.t==='call'&&st.e.f.t==='name'&&st.e.f.n==='print';
    if(v!==null) c.echo=pyrepr(v);
  }
  return c;
}
function uses(node,n){ if(!node||typeof node!=='object') return false; if(node.t==='name'&&node.n===n) return true; if(node.t==='fstr') return new RegExp('\\{[^}]*\\b'+n+'\\b').test(node.v); return Object.values(node).some(x=>Array.isArray(x)?x.some(y=>uses(y,n)):typeof x==='object'&&x!==null&&uses(x,n)); }
const usesIn=(c,n)=>uses(c.st,n)||(c.aug&&c.assigned===n);
const printed=c=>c.out.join('\n');

/* =====================================================================
   Les tâches : une phrase en français, une ligne modèle, une vérification
   par l'EFFET (ce qui est affiché, ce que contient la mémoire)
   ===================================================================== */
function tText(fr,w){ return {fr,code:`print("${w}")`,ok(c){
  if(!c.isPrint) return false; const o=printed(c);
  if(o===w) return true;
  if(o.trim()===w) return 'Attention aux espaces : tout ce qui est entre les guillemets est affiché, même les espaces.';
  if(o.toLowerCase()===w.toLowerCase()) return `Presque ! Python fait la différence entre majuscules et minuscules : il faut exactement ${w}`;
  return false; }}; }
function tNum(fr,n){ return {fr,code:`print(${n})`,ok(c){ return c.isPrint&&printed(c)===String(n); }}; }
function tCalc(fr,a,o,b){ const r=o==='*'?a*b:o==='+'?a+b:a-b; return {fr,code:`print(${a} ${o} ${b})`,ok(c){
  if(!c.isPrint) return false; const p=printed(c);
  if(p===String(r)) return true;
  if(p.replace(/\s/g,'')===`${a}${o}${b}`) return `Entre guillemets, Python ne calcule pas : il recopie le texte. Enlève les guillemets : print(${a} ${o} ${b})`;
  return false; }}; }
function tSet(fr,v,val){ const code=`${v} = ${typeof val==='string'?'"'+val+'"':val}`; return {fr,code,v,ok(c){
  if(c.assigned===v&&same(V[v],val)&&typeof V[v]===typeof val) return true;
  if(c.assigned===v&&typeof val==='number'&&typeof V[v]==='string'&&V[v]===String(val)) return `"${val}" entre guillemets, c'est du texte. Pour un nombre, pas de guillemets : ${code}`;
  if(c.assigned&&c.assigned!==v&&same(V[c.assigned],val)) return `Bonne valeur, mais mauvaise boîte : la variable doit s'appeler ${v}.`;
  if(c.assigned===v&&typeof val==='string'&&typeof V[v]==='string'&&V[v].toLowerCase()===val.toLowerCase()) return `Presque : majuscules et minuscules comptent. ${code}`;
  if(c.isPrint&&printed(c)===String(val)) return `Là tu as tiré, mais il fallait RANGER la valeur dans la boîte ${v} : ${code}`;
  return false; }}; }
function tShowVar(fr,v){ return {fr,code:`print(${v})`,ok(c){
  if(!c.isPrint) return false;
  if(usesIn(c,v)&&printed(c)===pstr(V[v])) return true;
  if(printed(c)===v) return `Avec des guillemets, tu tires le MOT « ${v} » 🙃. Sans guillemets, tu tires ce qu'il y a DANS la boîte : print(${v})`;
  return false; }}; }
function tFire(fr,v,want){ return {fr,code:`print(${v})`,ok(c){
  if(!c.isPrint) return false;
  if(usesIn(c,v)&&printed(c)===want) return true;
  if(printed(c)===v) return `Tu as tiré le MOT « ${v} »… Le monstre rigole. Sans guillemets, tu tires le CONTENU de la boîte : print(${v})`;
  if(usesIn(c,v)) return `La boîte ${v} contient ${pyrepr(V[v])}, pas "${want}". Range d'abord la bonne valeur : ${v} = "${want}"`;
  if(printed(c)===want) return `Ce monstre exige que tu tires avec la boîte ${v} : print(${v})`;
  return false; }}; }
function tCalcVar(fr,v,code,f,need){ return {fr,code,ok(c){
  if(c.assigned!==v) return false;
  const b=c.before[v]; if(!isNum(b)) return false;
  const want=f(nv(b)); if(!(isNum(V[v])&&Math.abs(nv(V[v])-want)<1e-9)) return false;
  if(!usesIn(c,v)) return `Le loup-garou a vu que tu as fait le calcul de tête 😏 Laisse Python calculer avec la boîte : ${code}`;
  return true; }}; }
function tPrintExpr(fr,code,want,need){ return {fr,code,ok(c){
  if(!c.isPrint) return false; const w=want();
  if(printed(c)!==w) { if(need.length&&need.every(n=>usesIn(c,n))&&printed(c).replace(/\s/g,'')===w.replace(/\s/g,'')) return 'Presque : regarde les espaces ! Dans "Salut " l\'espace est avant le guillemet fermant.'; return false; }
  const miss=need.filter(n=>!usesIn(c,n));
  if(miss.length) return `Bonne réponse, mais ce monstre veut que tu utilises la boîte ${miss.join(' et ')} : ${code}`;
  return true; }}; }

function loop(now){

function nearMiss(c){
  const n=s=>s.replace(/\s+/g,'').replace(/'/g,'"');
  const src=n(c.src);
  const best=G.m.map(z=>[z,lev(n(z.steps[z.i].code),src)]).sort((a,b)=>a[1]-b[1])[0];
  if(best&&best[1]<=Math.max(3,n(best[0].steps[best[0].i].code).length*.4)){ const z=best[0]; z.miss++; line('tip',`Presque ! « ${z.steps[z.i].fr} » s'écrit :  ${z.steps[z.i].code}`); if(!z.reveal){ z.reveal=true; render(z); } }
  else if(c.assigned) line('tip',`La boîte ${c.assigned} a bien été remplie, mais aucun monstre n'attendait ça.`);
  else if(c.isPrint) line('tip','Ton tir ne correspond à aucun monstre : relis bien leur bulle.');
}
function showErr(e,src){
  if(!(e instanceof PyErr)){ line('err','Erreur : '+e.message); console.error(e); return; }
  line('err',`${e.type}: ${e.message}`);
  let tip=e.tip;
  if(e.type==='SyntaxError'&&!/["']/.test(src)&&G){ const w=screenTexts().find(w=>w.length>1&&src.toLowerCase().includes(w.toLowerCase())&&!/[=(]/.test(w)); if(w) tip=`Du texte se met entre guillemets : print("${w}")`; }
  if(tip) line('tip','💡 '+tip);
  if(G) G.errs[e.type]=(G.errs[e.type]||0)+1;
}
function fixQuotes(s){ return s.replace(/[“”„«»]/g,'"').replace(/[‘’‚]/g,"'").replace(/ /g,' '); }

/* ---------------- fin de mission ---------------- */
function stars(){ const acc=G.ok/Math.max(1,G.tries); return 1+(G.lives>=2?1:0)+(acc>=.75?1:0); }
function win(){
  const st=stars(), w=G.w, acc=Math.round(100*G.ok/Math.max(1,G.tries));
  D.stars[w]=Math.max(D.stars[w]||0,st); D.best[w]=Math.max(D.best[w]||0,G.score); save();
  const errs=Object.entries(G.errs).sort((a,b)=>b[1]-a[1]);
  ov(`<h2>✅ Mission ${w+1} réussie !</h2>
    <p style="font-size:24px;color:var(--warn);margin:4px 0">${'★'.repeat(st)}${'☆'.repeat(3-st)}</p>
    <p>${G.score} points · ${acc} % de lignes justes · ${G.lives} vie${G.lives>1?'s':''} restante${G.lives>1?'s':''}</p>
    ${errs.length?`<p>Tes erreurs Python :</p><table class="tbl">${errs.map(([t,n])=>`<tr><td>${ERRDOC[t]||''}</td><td>${t} × ${n}</td></tr>`).join('')}</table>`:'<p>Aucune erreur Python : propre !</p>'}
    <p>${M[w].lesson}</p>
    <div class="row">${w+1<M.length?`<button class="btn ok" data-w="${w+1}">Mission ${w+2} ▶</button>`:'<button class="btn ok" data-act="fin">Le bilan ▶</button>'}<button class="btn" data-w="${w}">Rejouer</button><button class="btn" data-act="menu">Menu</button></div>`);
}
function lose(){
  G.over=true; clearMonsters();
  ov(`<h2 style="color:var(--bad)">🧟 Dévoré !</h2><p>Tu as éliminé ${G.done} monstre${G.done>1?'s':''} sur ${M[G.w].n}.</p><p>Astuce : ouvre l'antisèche 📜 et regarde la mémoire de Python avant de taper. Touche un monstre pour voir son code.</p><div class="row"><button class="btn ok" data-w="${G.w}">Recommencer</button><button class="btn" data-act="menu">Menu</button></div>`);
}
const RECAP=`<table class="tbl">
  <tr><td>Afficher (tirer) un texte</td><td>print("LUNDI")</td></tr>
  <tr><td>Afficher un nombre, un calcul</td><td>print(13) · print(6 * 7)</td></tr>
  <tr><td>Créer une boîte (variable)</td><td>ail = 3 · arme = "soleil"</td></tr>
  <tr><td>Afficher le contenu d'une boîte</td><td>print(arme)</td></tr>
  <tr><td>Changer une boîte avec un calcul</td><td>balles = balles + 4</td></tr>
  <tr><td>Coller / répéter du texte</td><td>"Salut " + nom · cri * 3</td></tr>
  <tr><td>Texte et nombre ensemble</td><td>print("Il reste", balles, "balles")</td></tr>
  <tr><td>Longueur d'un texte</td><td>len(nom)</td></tr>
</table>`;
function finale(){
  const tot=M.reduce((s,_,i)=>s+(D.stars[i]||0),0);
  ov(`<h2>🏆 Survivant de la nuit</h2><p style="font-size:22px;color:var(--warn)">${tot} ★ sur ${M.length*3}</p>${RECAP}
    <p>Prochain niveau : <b>Python of the Dead</b>, où ton arme devient un <b>objet</b> avec ses méthodes (<code>gun.reload()</code>).</p>
    <div class="row"><button class="btn ok" data-act="menu">Menu</button></div>`);
}
const CHEAT=`<h2>📜 Antisèche</h2>${RECAP}
  <p><b>Les erreurs les plus fréquentes</b></p>
  <table class="tbl">
    <tr><td>Texte sans guillemets : Python cherche une variable</td><td>NameError: name 'LUNDI' is not defined</td></tr>
    <tr><td>Majuscule en trop</td><td>NameError: name 'Print' is not defined</td></tr>
    <tr><td>Oubli des parenthèses</td><td>SyntaxError: Missing parentheses in call to 'print'</td></tr>
    <tr><td>Guillemet pas fermé</td><td>SyntaxError: unterminated string literal</td></tr>
    <tr><td>Parenthèse pas fermée</td><td>SyntaxError: '(' was never closed</td></tr>
    <tr><td>Valeur à gauche du =</td><td>SyntaxError: cannot assign to literal</td></tr>
    <tr><td>Texte + nombre</td><td>TypeError: can only concatenate str (not "int") to str</td></tr>
  </table>
  <p>Le signe <code>=</code> veut dire « range dans la boîte ». <code>"ail"</code> est un texte, <code>ail</code> est le nom d'une boîte.</p>
  <div class="row"><button class="btn ok" data-act="resume">Reprendre</button></div>`;

/* ---------------- écrans ---------------- */
function ov(html){ closeOv(); const o=document.createElement('div'); o.className='ov'; o.innerHTML=`<div class="card">${html}</div>`; document.body.appendChild(o); return o; }
function closeOv(){ document.querySelectorAll('.ov').forEach(o=>o.remove()); }
function unlocked(i){ return i===0||D.prof||(D.stars[i-1]||0)>0; }
function menu(){
  if(G){ G.over=true; } G=null; clearMonsters(); V={}; drawMem(); hud(); $('#h-w').textContent='Menu'; $('#gun').style.transform='';
  ov(`<h2>🧟 Print of the Dead</h2>
    <p>La nuit tombe sur le lycée. Zombies, vampires, fantômes et loups-garous arrivent, et ta seule arme est le <b>Printeur 3000</b> : il tire du <b>Python</b>.</p>
    <p>Chaque monstre porte une bulle en français. Tape la ligne de Python qui fait exactement cela, puis <b>Entrée</b>. Regarde la <b>mémoire de Python</b> : tes variables y apparaissent comme des boîtes.</p>
    <div class="ms">${M.map((m,i)=>{ const L=!unlocked(i), s=D.stars[i]||0; return `<button class="mb" data-w="${i}" ${L?'disabled':''}><span class="e">${L?'🔒':m.e}</span><span><b>Mission ${i+1} · ${m.t}</b><small>${['print("…"), nombres et calculs','créer une boîte : arme = "ail", print(arme)','balles = balles + 4, / et *','"Salut " + nom, cri * 3, virgules dans print','tout mélangé + le boss Bernard'][i]}</small></span><span class="st">${'★'.repeat(s)}${'☆'.repeat(3-s)}</span></button>`; }).join('')}</div>
    <p style="color:var(--mut);font-size:13px;margin-top:12px">Python niveau 1 · entraînement sans note, progression gardée dans ce navigateur. Au menu, la console marche aussi : essaie <code>print("Bonjour")</code>. Code prof : tape <code>SNT-PROF</code> dans la console.</p>
    <div class="row"><button class="btn" data-act="sandbox">🧪 Console libre</button></div>`);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-w],[data-act]'); if(!b||b.closest('#sym')) return;
  if(b.dataset.w!==undefined) return startMission(+b.dataset.w);
  const a=b.dataset.act;
  if(a==='go') go();
  else if(a==='menu') menu();
  else if(a==='fin') finale();
  else if(a==='resume'){ closeOv(); if(G&&!G.over){ if(!G.started) return go(); G.pause=false; last=performance.now(); } focusIn(); }
  else if(a==='sandbox'){ closeOv(); line('good','🧪 Console libre : essaie print("Bonjour"), ail = 3, print(ail * 2)… Bouton ☰ pour revenir au menu.'); $('#in').focus(); }
});
const HIST=[]; let hi=0;
$('#in').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); submit(); }
  else if(e.key==='ArrowUp'&&HIST.length){ e.preventDefault(); hi=Math.max(0,hi-1); e.target.value=HIST[hi]; }
  else if(e.key==='ArrowDown'&&HIST.length){ e.preventDefault(); hi=Math.min(HIST.length,hi+1); e.target.value=HIST[hi]||''; }
});
$('#go').onclick=()=>{ submit(); $('#in').focus(); };
$('#b-cheat').onclick=()=>{ if(G&&!G.over){ if(G.pause&&document.querySelector('.ov')) { /* écran d'intro ouvert */ } else G.pause=true; } ov(CHEAT); };
$('#b-menu').onclick=menu;
drawMem(); hud(); menu();
</script>
</body></html>
